<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九十刻度 · D1会员管理</title><style>body{font:15px system-ui;background:#f3f5f9;color:#182338;margin:0;padding:20px}.box{max-width:480px;margin:40px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 8px 30px #18233812}h1{font-size:23px}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:8px}input{border:1px solid #cbd3df}button{background:#b9252c;color:#fff;border:0;margin-top:18px;font-weight:700}button:disabled{opacity:.6}#panel[hidden],#login[hidden]{display:none}#result{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#657085;line-height:1.7;display:block;margin-top:12px}</style></head><body><div class="box"><h1>九十刻度 · D1会员管理</h1><section id="login"><label>管理员邮箱</label><input id="email" type="email" autocomplete="username"><label>管理员密码</label><input id="password" type="password" autocomplete="current-password"><button id="signIn">管理员登录</button></section><section id="panel" hidden><p id="identity"></p><h2>重置会员密码</h2><label>会员邮箱</label><input id="target" type="email" autocomplete="off" placeholder="请输入会员账号邮箱"><small>系统自动生成高强度临时密码。重置不会修改VIP状态或到期时间。请通过私密渠道发送给会员，避免公开传播。</small><button id="reset">生成新密码并重置</button><p id="result" role="status"></p><button id="logout" style="background:#67748a">退出管理</button></section><p id="notice" role="status"></p></div><script>
const API='https://suolun-vip-staging.hjh19970220.workers.dev';let token='';
const $=id=>document.getElementById(id);
async function call(path,opts={}){const res=await fetch(API+path,{...opts,cache:'no-store',headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'HTTP '+res.status);return data}
$('signIn').onclick=async()=>{const b=$('signIn');b.disabled=true;$('notice').textContent='正在验证…';try{const d=await call('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=d.token;const me=await call('/auth/me');if(me.role!=='admin')throw Error('当前账号没有D1管理员权限');$('identity').textContent='已登录管理员：'+me.email;$('password').value='';$('login').hidden=true;$('panel').hidden=false;$('notice').textContent='';}catch(e){token='';$('notice').textContent='登录失败：'+e.message}finally{b.disabled=false}};
$('reset').onclick=async()=>{const email=$('target').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email)){$('result').textContent='请输入有效会员邮箱';return}if(!confirm('确定重置 '+email+' 的密码？旧密码将立即失效。'))return;const b=$('reset');b.disabled=true;$('result').textContent='正在重置…';try{const d=await call('/admin/member/reset-password',{method:'POST',body:JSON.stringify({email})});$('result').textContent='密码重置成功！\n会员：'+d.email+'\n临时新密码：'+d.temporary_password+'\n请立即安全告知会员。离开本页面后不再展示该密码。'}catch(e){$('result').textContent='重置失败：'+e.message}finally{b.disabled=false}};
$('logout').onclick=()=>{token='';$('panel').hidden=true;$('login').hidden=false;$('result').textContent='';$('notice').textContent='已退出'};
<\/script></body></html>
