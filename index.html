<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d72b30">
  <title>索伦引擎 · 足球赛事分析</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:#282828;background:#f3f3f3;font-synthesis:none;--red:#d62c31;--deep:#bd1f26;--ink:#2d2d2d;--muted:#999;--line:#e8e8e8;--green:#159d78}
    *{box-sizing:border-box}body{margin:0;background:#f3f3f3;min-height:100vh}.app{max-width:640px;margin:0 auto;min-height:100vh;background:#f5f5f5;padding-bottom:82px}
    button{font:inherit}.hero{color:white;background:linear-gradient(140deg,#e33237,#c91922);position:relative;overflow:hidden}.hero:before,.hero:after{content:"";position:absolute;inset:auto;width:260px;height:260px;border:46px solid #fff;opacity:.045;transform:rotate(45deg)}.hero:before{left:-160px;top:-80px}.hero:after{right:-150px;bottom:-130px}
    .brandbar{position:relative;z-index:1;padding:14px 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:9px}.logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--red);display:grid;place-items:center;font-weight:900;box-shadow:0 4px 15px #8e101d44}.brand strong{display:block;font-size:17px;letter-spacing:.5px}.brand small{display:block;font-size:9px;opacity:.72;margin-top:1px}.version{font-size:11px;padding:6px 9px;border:1px solid #ffffff65;border-radius:999px;background:#9d111d40}
    .models{position:relative;z-index:1;display:flex;padding:5px 12px 0;overflow:auto;scrollbar-width:none}.models::-webkit-scrollbar{display:none}.model{flex:1;min-width:80px;border:0;background:none;color:#ffffffad;padding:9px 7px 11px;font-size:13px;white-space:nowrap;border-bottom:3px solid transparent}.model.active{color:#fff;font-weight:800;border-bottom-color:#ffd03d}
    .hero-copy{position:relative;z-index:1;text-align:center;padding:18px 22px 17px;background:#ae111a20;border-top:1px solid #ffffff14}.hero-copy h1{font-size:20px;margin:0 0 7px}.hero-copy p{margin:0;font-size:12px;line-height:1.7;color:#fff}.hero-copy .warn{margin-top:10px;color:#ffd833;font-size:12px;line-height:1.65;text-align:left}
    .dates{position:relative;z-index:1;display:grid;grid-template-columns:repeat(7,1fr);background:#cb272d;border-top:1px solid #ffffff16;padding:8px 0 10px}.day{border:0;background:none;color:#ffffff9c;text-align:center;padding:2px 0;font-size:11px}.day b{display:block;font-size:13px;font-weight:500;margin-bottom:3px}.day.active{color:#fff}.day.active b{font-weight:900}.day.active span{font-weight:800}
    .main.hide,.detail{display:none}.detail.show{display:block}.toolbar{padding:14px 16px 10px;background:#fff}.toolbar-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.count{font-size:13px;color:#aaa}.filters{display:flex;gap:8px}.filter{border:1px solid #3b3b3b;background:white;color:#333;border-radius:6px;padding:7px 11px;font-size:13px}.filter.active{background:var(--red);border-color:var(--red);color:white}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:12px;background:#eee;border-radius:9px;overflow:hidden}.metric{background:#fafafa;padding:9px;text-align:center}.metric b{display:block;font-size:16px;color:#333}.metric span{font-size:9px;color:#9b9b9b}.content{padding:11px 12px 28px}.section-head{display:flex;justify-content:space-between;align-items:end;padding:4px 2px 10px}.section-head h2{font-size:16px;margin:0}.section-head span{font-size:10px;color:#999}
    .cards{display:grid;gap:12px}.card{background:#fff;border-radius:16px;padding:0 14px 13px;box-shadow:0 2px 12px #00000008;overflow:hidden;cursor:pointer}.card:active{transform:scale(.996)}.card-head{height:42px;display:flex;align-items:center;justify-content:space-between;gap:8px}.match-id{font-size:11px;color:#555;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.league{font-weight:700;margin-right:5px}.status{align-self:flex-start;background:var(--red);color:#fff;padding:8px 10px 7px;border-radius:0 0 0 13px;font-size:10px;white-space:nowrap}.status.pass{background:#777}.status.verified{background:var(--green)}
    .fixture{display:grid;grid-template-columns:1fr 72px;gap:9px;align-items:center;padding:5px 0 13px}.team-list{display:grid;gap:11px}.team{display:flex;align-items:center;gap:10px;min-width:0}.crest{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;color:white;background:linear-gradient(145deg,#e44a4f,#aa141b);font-size:12px;font-weight:900;box-shadow:inset 0 0 0 3px #ffffffc9,0 1px 3px #0002;flex:0 0 auto}.team:nth-child(2) .crest{background:linear-gradient(145deg,#3a75c4,#1c3e7d)}.team-name{font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{text-align:right;color:var(--red);font-size:20px;font-weight:900}.score span{display:block;color:#bbb;font-size:9px;font-weight:500;margin-top:3px}
    .analysis{border-top:1px solid #ddd;padding-top:10px}.triplet{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #ddd;border-radius:5px;overflow:hidden}.triplet.pair{grid-template-columns:repeat(2,1fr)}.triplet.six-grid .datum:nth-child(3){border-right:0}.triplet.six-grid .datum:nth-child(-n+3){border-bottom:1px solid #ddd}.datum{padding:8px 5px;text-align:center;border-right:1px solid #ddd;min-width:0}.datum:last-child{border-right:0}.datum span{display:block;color:#777;font-size:9px;margin-bottom:4px}.datum b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.datum.primary b{color:var(--red)}.advice{font-size:13px;font-weight:800;color:var(--red);margin-top:10px;line-height:1.5}.advice small{color:#777;font-size:10px;font-weight:500;margin-left:5px}.history-result{margin-top:9px;padding-top:9px;border-top:1px solid #eee;font-size:11px;color:#777}.history-result b{color:var(--red)}.status.fail{background:#777}
    .empty,.error{background:#fff;border-radius:16px;padding:34px 18px;text-align:center;color:#999;font-size:12px;line-height:1.7}.empty b,.error b{display:block;color:#444;font-size:15px;margin-bottom:6px}.notice{margin-top:12px;background:#fff5dc;border:1px solid #f1dfaa;color:#896c26;border-radius:11px;padding:10px 12px;font-size:10px;line-height:1.7}
    .backbar{position:sticky;top:0;z-index:4;background:var(--red);padding:12px 14px;color:#fff;display:flex;align-items:center;gap:12px}.back{border:0;background:none;color:#fff;font-size:21px;padding:2px 7px}.backbar b{font-size:15px}.detail-body{padding:12px}.detail-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px #00000008}.detail-card h2{font-size:20px;margin:11px 0 5px}.sub{font-size:11px;color:#999}.audit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.audit-item{border:1px solid #eee;background:#fafafa;border-radius:9px;padding:10px}.audit-item span{display:block;color:#999;font-size:9px;margin-bottom:4px}.audit-item b{font-size:12px;word-break:break-word}.riskbox{margin-top:12px;border-top:1px solid #eee;padding-top:12px}.riskbox h3{font-size:12px;margin:0 0 6px}.riskbox p{font-size:11px;line-height:1.7;color:#737373;margin:0 0 5px}
    .bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#ffffffed;backdrop-filter:blur(15px);border-top:1px solid #ddd;padding:7px 0 max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center}.bottom-inner{width:min(640px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;background:none;color:#999;font-size:9px;padding:3px}.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}.nav.active{color:var(--red);font-weight:700}.loading{display:inline-flex;gap:5px;align-items:center}.loading:after{content:"";width:10px;height:10px;border:2px solid #ddd;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:641px){.app{box-shadow:0 0 40px #0001}.hero{border-radius:0 0 18px 18px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="brandbar">
        <div class="brand"><div class="logo">S</div><div><strong>索伦引擎</strong><small>SOREN FOOTBALL ENGINE</small></div></div>
        <div class="version" id="version">版本核验中</div>
      </div>
      <div class="models" id="models">
        <button class="model active" data-model="overview">综合评测</button>
        <button class="model" data-model="handicap">让球评测</button>
        <button class="model" data-model="wdl">胜平负</button>
        <button class="model" data-model="risk">风险分析</button>
        <button class="model" data-model="cold">冷门监测</button>
        <button class="model" data-model="six">六维定胆</button>
        <button class="model" data-model="daily">每日优选</button>
      </div>
      <div class="hero-copy">
        <h1 id="modelTitle">索伦综合评测</h1>
        <p id="modelDesc">汇总正式赛前冻结记录，展示首选、次选与让球方向</p>
        <div class="warn">数据仅来自正式赛前冻结批次；未发布字段显示“未确认”。内容仅供赛事研究参考。</div>
      </div>
      <div class="dates" id="dates"></div>
    </header>
    <main class="main" id="main">
      <section class="toolbar">
        <div class="toolbar-top">
          <span class="count" id="poolCount">正在读取正式比赛</span>
          <div class="filters">
            <button class="filter active" data-filter="jczq">竞足</button>
          </div>
        </div>
        <div class="metrics">
          <div class="metric"><b id="totalCount">—</b><span>全池场次</span></div>
          <div class="metric"><b id="pickCount">—</b><span>赛果已核验</span></div>
          <div class="metric"><b id="passCount">—</b><span>等待赛果</span></div>
        </div>
      </section>
      <section class="content" id="content"><div class="empty"><b>正在连接正式数据</b><span class="loading">核验索伦3.8赛前冻结记录</span></div></section>
    </main>
    <section class="detail" id="detail">
      <div class="backbar"><button class="back" id="back" aria-label="返回">‹</button><b>比赛详情</b></div>
      <div class="detail-body"><div class="detail-card" id="detailCard"></div></div>
    </section>
  </div>
  <nav class="bottom">
    <div class="bottom-inner">
      <button class="nav active" data-tab="home"><i>⌂</i>首页</button>
      <button class="nav" data-tab="matches"><i>▦</i>赛事</button>
      <button class="nav" data-tab="history"><i>✓</i>战绩</button>
      <button class="nav" data-tab="profile"><i>◎</i>说明</button>
    </div>
  </nav>
  <script>
    const API='https://ttydbcejxqxdkcfoizkj.supabase.co/functions/v1/soren-public-api-v1';
    const state={today:null,history:null,tab:'home',filter:'jczq',model:'overview',selected:null,selectedDate:null,baseDate:null};
    const ARCHIVED_FOCUS={
      '2026-09-13':['002','006','008','009','020','022','023'],
      '2026-09-14':['003','008'],
      '2026-09-15':['003','008','011','012'],
      '2026-09-16':['016'],
      '2026-09-17':['002','003','005','007','011'],
      '2026-09-18':['001','012','014'],
      '2026-09-19':['006','008','013','014','017','027']
    };
    const $=id=>document.getElementById(id);
    const safe=v=>{if(v===null||v===undefined||v==='')return '未确认';const s=String(v);return s==='PASS'?'未确认':s.replace(/PASS/g,'未确认')};
    const resultName={H:'主胜',D:'平',A:'客胜'},pickCode={'主胜':'H','平':'D','客胜':'A'};
    const normalizeResult=v=>({H:'H',D:'D',A:'A','3':'H','1':'D','0':'A','主胜':'H','平':'D','客胜':'A'}[String(v??'')]||null);
    const verified=row=>row.resultVerified===true&&normalizeResult(row.result)!==null;
    const modelCopy={
      overview:['索伦综合评测','汇总正式赛前冻结记录，展示首选、次选与让球方向'],
      handicap:['索伦让球评测','根据公开让球线展示经正式批次核验的方向'],
      wdl:['索伦胜平负','展示正式FT首选、第二方向及已发布的Top1概率'],
      risk:['索伦风险分析','展示可公开的风险指标与质量核验结论'],
      cold:['索伦冷门监测','监测全池HUR红的正式赛前风险场，不伪造冷门分数'],
      six:['索伦六维定胆','逐项展示FT、概率、HUR、DTR、DLR与DQ六项正式证据'],
      daily:['索伦每日优选','仅展示赛前正式标记的重心场次；完整全池请前往赛事页查看']
    };
    const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
    function fmtTime(v){if(!v)return '未确认';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch{return '未确认'}}
    function fmtStamp(v){if(!v)return '未确认';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(v))}catch{return '未确认'}}
    function initial(name){const s=safe(name);return s==='未确认'?'?':s.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,'').slice(0,1).toUpperCase()||'?'}
    function coldHit(row){return verified(row)&&pickCode[row.second]===normalizeResult(row.result)&&pickCode[row.ftTop1]!==normalizeResult(row.result)}
    function evaluationHit(row){return verified(row)&&(pickCode[row.ftTop1]===normalizeResult(row.result)||pickCode[row.second]===normalizeResult(row.result))}
    function statusText(row,history){
      if(verified(row)&&state.model==='cold')return coldHit(row)?'抓冷成功':'冷门未中';
      if(verified(row))return evaluationHit(row)?'评测成功':'评测未中';
      if(row.matchStatus==='POSTPONED')return '比赛延期';if(row.resultVerified===true)return '赛果待复核';if(history)return '等待赛果';if(state.model==='cold')return '冷门监测';if(state.model==='six')return '六维入选';if(state.model==='daily')return '每日优选';
      return '赛前冻结'
    }
    function statusClass(row,history){if(row.matchStatus==='POSTPONED')return 'status pass';if(verified(row)){const success=state.model==='cold'?coldHit(row):evaluationHit(row);return 'status '+(success?'verified':'fail')}return 'status'}
    function moduleData(row){
      if(state.model==='handicap')return [['官方让球',row.officialHandicap],['让球方向',row.handicap],['方向状态',row.handicapEligible===true?'已发布':row.handicapEligible===false?'未通过':'未确认']];
      if(state.model==='wdl')return [['FT首选',row.ftTop1],['Top1概率',row.confidence==null?'未确认':row.confidence+'%'],['第二方向',row.second]];
      if(state.model==='risk')return [['HUR',row.risk?.hur],['DTR',row.risk?.dtr],['DLR',row.risk?.dlr]];
      if(state.model==='cold')return [['冷门风险','HUR '+safe(row.risk?.hur)],['关注第二方向',row.second]];
      if(state.model==='six')return [['FT首选',row.ftTop1],['Top1概率',row.confidence==null?'未确认':row.confidence+'%'],['HUR',row.risk?.hur],['DTR',row.risk?.dtr],['DLR',row.risk?.dlr],['DQ',row.risk?.dq]];
      if(state.model==='daily')return [['重心等级',ARCHIVED_FOCUS[row.date]?.includes(String(row.no).padStart(3,'0'))?'赛前重心':row.focusTag||row.focus_tag||row.tier],['首选建议',row.ftTop1],['次选建议',row.second]];
      return [['FT首选',row.ftTop1],['第二方向',row.second],['让球方向',row.handicap]];
    }
    function adviceText(row){
      if(state.model==='handicap')return row.handicap==='未确认'||!row.handicap?'让球建议：未确认':'让球建议：'+row.handicap;
      if(state.model==='wdl')return '胜平负建议：'+safe(row.ftTop1)+' / '+safe(row.second);
      if(state.model==='risk')return '风险结论：'+safe(row.risk?.dq||row.riskAnalysis);
      if(state.model==='cold')return '冷门结论：'+safe(row.riskAnalysis);
      if(state.model==='six')return '定胆建议：'+safe(row.ftTop1)+' / '+safe(row.second);
      if(state.model==='daily')return '优选建议：'+safe(row.ftTop1)+' / '+safe(row.second);
      return '测评建议：'+safe(row.ftTop1)+' / '+safe(row.second);
    }
    function matchCard(row,history=false){
      const c=el('article','card');c.tabIndex=0;c.setAttribute('role','button');
      const head=el('div','card-head');
      const id=el('div','match-id');id.append(el('span','league',safe(row.league)),document.createTextNode(fmtTime(row.kickoff)+' · '+safe(row.no)));
      head.append(id,el('span',statusClass(row,history),statusText(row,history)));
      const fixture=el('div','fixture'),teams=el('div','team-list');
      [row.home,row.away].forEach(name=>{const t=el('div','team');t.append(el('span','crest',initial(name)),el('span','team-name',safe(name)));teams.append(t)});
      const settled=verified(row),score=el('div','score',settled?safe(resultName[row.result]||row.result):safe(row.officialHandicap));score.append(el('span','',settled?'正式赛果':row.matchStatus==='POSTPONED'?'比赛延期':'官方让球'));
      fixture.append(teams,score);
      const analysis=el('div','analysis'),values=moduleData(row),triplet=el('div','triplet'+(values.length===2?' pair':values.length===6?' six-grid':''));
      values.forEach(([k,v],i)=>{const d=el('div','datum'+(i===0?' primary':''));d.append(el('span','',k),el('b','',safe(v)));triplet.append(d)});
      const advice=el('div','advice',adviceText(row));advice.append(el('small','','首选或次选命中即评测成功'));
      analysis.append(triplet,advice);
      c.append(head,fixture,analysis);
      if(history){const r=el('div','history-result');r.append(document.createTextNode('首选 '),el('b','',pickCode[row.ftTop1]===normalizeResult(row.result)?'命中':'未中'),document.createTextNode(' · 次选 '),el('b','',pickCode[row.second]===normalizeResult(row.result)?'命中':'未中'),document.createTextNode(' · 评测 '),el('b','',evaluationHit(row)?'成功':'未中'));c.append(r)}
      c.onclick=()=>openDetail(row,history);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(row,history)}};return c
    }
    function sectionHead(title,sub){const h=el('div','section-head');h.append(el('h2','',title),el('span','',sub));return h}
    function empty(title,text){const x=el('div','empty');x.append(el('b','',title),el('div','',text));return x}
    function notice(){return el('div','notice','全池展示正式赛前冻结的首选与次选，任一方向命中即计本场评测成功。影子表、赛后补算和未核验字段不会作为正式结论发布。')}
    function isFocus(row){
      const archived=ARCHIVED_FOCUS[row.date],no=String(row.no??'').padStart(3,'0');
      if(Array.isArray(archived))return row.pregameVerified===true&&archived.includes(no);
      const tags=[row.focusTag,row.focus_tag,row.recommendationLevel,row.recommendation_level,row.priorityTag,row.priority_tag,row.bestPlayLevel,row.best_play_level,row.bestPlay?.level,row.best_play?.level];
      const explicit=tags.some(v=>/^(重心|重点|核心|FOCUS|PRIORITY|BEST_PLAY|A\+|A\+单|A\+双)$/i.test(String(v??'').trim()));
      const marked=row.isFocus===true||row.is_focus===true||row.isKeyMatch===true||row.is_key_match===true||row.isBestPlay===true||row.is_best_play===true;
      const tier=String(row.tier??'').trim().toUpperCase(),mode=String(row.mode??'').trim().toUpperCase();
      const frozenFormal=(mode==='SINGLE'||mode==='DOUBLE')&&tier!==''&&tier!=='PASS'&&row.pass!==true;
      return row.pregameVerified===true&&(explicit||marked||frozenFormal);
    }
    function filterRows(rows){
      if(state.model==='daily')return rows.filter(isFocus);
      if(state.model==='cold')return rows.filter(r=>r.risk?.hur==='红'&&r.second);
      return rows
    }
    function visibleRows(){if(!state.today)return [];return filterRows(state.today.rows||[])}
    function currentTitle(){return {overview:'今日竞足',handicap:'让球评测',wdl:'胜平负',risk:'风险分析',cold:'冷门监测',six:'六维定胆',daily:'每日优选'}[state.model]||'今日竞足'}
    function renderCards(title,sub,rows,history=false){
      const box=$('content');box.replaceChildren(sectionHead(title,sub));
      if(!rows.length){box.append(empty(state.model==='daily'?'暂无正式重心场次':'暂无已发布赛事',state.model==='daily'?'当前接口未发布可核验的赛前重心标记，不会按赛果或赔率临时拼凑优选。完整比赛请切换赛事页。':'当前没有符合条件的正式竞足记录。'),notice());return}
      const grid=el('div','cards');rows.forEach(r=>grid.append(matchCard(r,history)));box.append(grid,notice())
    }
    function renderHome(){const rows=visibleRows();renderCards(state.model==='daily'?'每日优选 · 重心场次':currentTitle(),rows.length+'场 · 索伦 '+safe(state.today?.modelVersion),rows)}
    function renderMatches(){const rows=visibleRows();renderCards(currentTitle()+'赛事',rows.length+'场 · 索伦 '+safe(state.today?.modelVersion),rows)}
    async function renderHistory(){
      const box=$('content');box.replaceChildren(sectionHead('真实战绩','仅已核验赛果'));
      if(!state.history){box.append(empty('正在读取战绩','只统计同时具备赛前冻结证据和赛果核验的记录。'));try{const h=await load('history',state.selectedDate);state.history=h;renderHistory()}catch(e){box.replaceChildren(errorBox(e))}return}
      const rows=filterRows(state.history.rows||[]);if(!rows.length){box.append(empty('暂无已核验战绩','当前模块没有同时满足赛前冻结与赛果核验的记录。'),notice());return}
      const grid=el('div','cards');rows.forEach(r=>grid.append(matchCard(r,true)));box.replaceChildren(sectionHead('真实战绩',rows.length+'场 · 赛果已核验'),grid,notice())
    }
    function renderProfile(){
      const d=state.today,box=$('content'),card=el('div','detail-card');box.replaceChildren(sectionHead('数据说明','客户公开版'));
      card.append(el('h2','','索伦引擎 '+safe(d?.modelVersion)),el('div','sub','正式赛前冻结 · 缺失数据不补猜'));
      const a=el('div','audit');[['数据来源','正式公开接口'],['比赛日',safe(d?.date)],['赛前冻结',d?d.pregameVerifiedCount+'/'+d.count:'未确认'],['数据时间',fmtStamp(d?.dataTime)],['评测口径','首选或次选任一命中'],['赛果纪律','不使用赛果倒灌']].forEach(([k,v])=>{const x=el('div','audit-item');x.append(el('span','',k),el('b','',v));a.append(x)});card.append(a);box.append(card,notice())
    }
    function openDetail(row,history){
      state.selected=row;$('main').classList.add('hide');$('detail').classList.add('show');
      const c=$('detailCard');c.replaceChildren();
      c.append(el('span',statusClass(row,history),statusText(row,history)),el('h2','',safe(row.home)+' vs '+safe(row.away)),el('div','sub',[safe(row.no),safe(row.league),fmtTime(row.kickoff),'北京时间'].join(' · ')));
      const a=el('div','audit');[['FT首选',row.ftTop1],['第二方向',row.second],['评测口径','任一命中'],['当日版本',row.version],['官方让球',row.officialHandicap],['让球方向',row.handicap],['Top1概率',row.confidence==null?'未确认':row.confidence+'%'],['冻结时间',fmtStamp(row.frozenAt)]].forEach(([k,v])=>{const x=el('div','audit-item');x.append(el('span','',k),el('b','',safe(v)));a.append(x)});c.append(a);
      const risk=el('div','riskbox');risk.append(el('h3','','风险分析'),el('p','','HUR '+safe(row.risk?.hur)+' · DTR '+safe(row.risk?.dtr)+' · DLR '+safe(row.risk?.dlr)+' · DQ '+safe(row.risk?.dq)),el('p','',safe(row.riskAnalysis)));
      const hand=el('div','riskbox');hand.append(el('h3','','让球说明'),el('p','',safe(row.handicapAnalysis)));c.append(risk,hand);
      if(history)c.append(el('div','history-result','赛果：'+safe(resultName[row.result]||row.result)+' · 首选 '+(pickCode[row.ftTop1]===normalizeResult(row.result)?'命中':'未中')+' · 次选 '+(pickCode[row.second]===normalizeResult(row.result)?'命中':'未中')+' · '+(evaluationHit(row)?'评测成功':'评测未中')));
      window.scrollTo({top:0,behavior:'smooth'})
    }
    function closeDetail(){$('detail').classList.remove('show');$('main').classList.remove('hide');state.selected=null}
    function errorBox(e){const x=el('div','error');x.append(el('b','','正式接口暂不可用'),el('div','',safe(e?.message||e)+'。页面不会使用模拟数据代替。'));return x}
    function render(){closeDetail();if(state.tab==='home')renderHome();else if(state.tab==='matches')renderMatches();else if(state.tab==='history')renderHistory();else renderProfile()}
    async function load(view,date){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),15000);try{const qs=new URLSearchParams({view,client:'1'});if(date)qs.set('date',date);qs.set('_',String(Date.now()));const r=await fetch(API+'?'+qs.toString(),{cache:'no-store',signal:ctrl.signal});if(!r.ok)throw Error('接口返回 HTTP '+r.status);const j=await r.json();if(!j.ok||!Array.isArray(j.rows))throw Error(j.error||'接口数据异常');if(!['3.2','3.3','3.6','3.8'].includes(j.modelVersion))throw Error('模型版本未通过公开校验');return j}finally{clearTimeout(timer)}}
    function isoDate(d){return d.toISOString().slice(0,10)}
    function buildDates(poolDate){
      const base=new Date((poolDate||new Date().toISOString().slice(0,10))+'T12:00:00+08:00'),days=['日','一','二','三','四','五','六'],box=$('dates');box.replaceChildren();
      for(let i=-6;i<=0;i++){const d=new Date(base);d.setDate(d.getDate()+i);const iso=isoDate(d),isBase=iso===state.baseDate,isActive=iso===state.selectedDate,b=el('button','day'+(isActive?' active':''));b.append(el('b','',isBase?'今天':'周'+days[d.getDay()]),el('span','',String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')));b.onclick=()=>selectDate(iso);box.append(b)}
    }
    async function selectDate(date){
      if(date===state.selectedDate)return;
      if(date<isoDate(new Date(new Date(state.baseDate+'T12:00:00+08:00').getTime()-6*86400000))||date>state.baseDate){alert('该日期暂无可核验的正式赛前记录。');return}
      $('content').replaceChildren(empty('正在读取 '+date,'核对当日正式版本与赛前冻结记录。'));
      try{const d=await load('archive',date);state.today=d;state.selectedDate=date;const settled=d.rows.filter(r=>verified(r));state.history={...d,count:settled.length,rows:settled};setHeader(d);render()}catch(e){$('content').replaceChildren(errorBox(e))}
    }
    function setHeader(d){const settled=d.rows.filter(r=>verified(r)).length;$('version').textContent='索伦 '+safe(d.modelVersion);$('poolCount').textContent=safe(d.date)+' · '+d.count+' 场比赛';$('totalCount').textContent=d.count;$('pickCount').textContent=settled;$('passCount').textContent=Math.max(0,d.rows.filter(r=>r.matchStatus!=='POSTPONED'&&!verified(r)).length);buildDates(state.baseDate||d.date)}
    document.querySelectorAll('.model').forEach(b=>b.onclick=()=>{document.querySelectorAll('.model').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.model=b.dataset.model;[$('modelTitle').textContent,$('modelDesc').textContent]=modelCopy[state.model];render()});
    document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;render()});
    document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.tab=b.dataset.tab;render()});
    $('back').onclick=closeDetail;
    load('archive').then(d=>{state.today=d;state.baseDate=d.date;state.selectedDate=d.date;const settled=d.rows.filter(r=>verified(r));state.history={...d,count:settled.length,rows:settled};setHeader(d);render()}).catch(e=>{$('version').textContent='数据未确认';$('poolCount').textContent='接口异常';$('content').replaceChildren(errorBox(e));buildDates()});
    // Refresh settled results when the page becomes visible; preserve the selected day and model.
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.selectedDate)selectDateRefresh()});
    async function selectDateRefresh(){try{const d=await load('archive',state.selectedDate);if(d.date!==state.selectedDate)return;state.today=d;const settled=d.rows.filter(verified);state.history={...d,count:settled.length,rows:settled};setHeader(d);if(!state.selected)render()}catch(e){console.warn('赛果刷新失败',e)}}
  </script>
</body>
</html>
