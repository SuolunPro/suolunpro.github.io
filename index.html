<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>索伦引擎 · 足球分析</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#182338;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:540px;margin:auto;padding-bottom:85px}.hero{background:linear-gradient(130deg,#111e38,#284773);color:white;padding:26px 20px 24px;border-radius:0 0 28px 28px}.eyebrow{letter-spacing:2px;font-size:11px;color:#b7d4ff}.hero h1{font-size:29px;margin:12px 0 6px}.hero p{font-size:13px;color:#d8e5fa}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:21px}.metric{background:#ffffff16;border:1px solid #ffffff25;border-radius:13px;padding:11px 8px}.metric b{display:block;margin-top:7px;font-size:14px}.metric small{font-size:11px;color:#d7e6ff}main{padding:17px}.notice{background:#fff9e9;border:1px solid #f3dfac;color:#80611d;border-radius:12px;padding:12px;font-size:12px;line-height:1.7}.section{display:flex;justify-content:space-between;align-items:center;margin:23px 1px 12px}.section h2{font-size:17px;margin:0}.section span{font-size:11px;color:#7b879a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{background:white;border:1px solid #e8edf5;border-radius:17px;padding:17px 14px;min-height:132px;box-shadow:0 3px 14px #12244008;text-align:left;cursor:pointer;color:inherit}.tile .ico{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#eaf1ff;color:#345eaa;font-size:19px}.tile strong{display:block;margin:12px 0 6px;font-size:15px}.tile small{color:#778399;line-height:1.5}.panel{background:white;border:1px solid #e8edf5;border-radius:17px;padding:17px;margin-top:13px}.panel h3{font-size:16px;margin:0 0 12px}.muted{color:#778399;font-size:13px;line-height:1.7}.pill{display:inline-block;background:#e9f1ff;color:#2855a1;padding:5px 9px;border-radius:99px;font-size:11px}.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eef1f5;font-size:13px}.line:last-child{border:0}.empty{text-align:center;padding:24px 12px;color:#8190a5}.empty b{display:block;color:#30415b;margin:8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e9edf4;display:flex;justify-content:space-around;padding:11px 0 max(12px,env(safe-area-inset-bottom));z-index:5}.bottom button{border:0;background:none;color:#778399;font-size:12px;cursor:pointer}.bottom button.active{color:#265cb3;font-weight:700}button:focus-visible{outline:2px solid #2a65bc}#detail{display:none}#detail.show{display:block}#home.hide{display:none}.back{border:0;background:none;color:#2855a1;font-weight:600;padding:8px 0 16px;cursor:pointer}</style></head><body><div class="wrap"><header class="hero"><div class="eyebrow">SOREN ENGINE · CLIENT</div><h1>索伦引擎</h1><p>足球赛事数据分析 · 客户体验版</p><div class="metrics"><div class="metric"><small>今日赛事</small><b>待同步</b></div><div class="metric"><small>精选分析</small><b>待运行</b></div><div class="metric"><small>数据状态</small><b>未接入</b></div></div></header><main><div class="notice">当前为客户界面预览，尚未接入豪竞正式预测接口。所有概率、场次、战绩均不使用模拟数值冒充真实结果。</div><div id="home"><div class="section"><h2>赛事分析中心</h2><span>七大模块</span></div><div class="grid" id="tiles"></div><div class="section"><h2>今日赛事</h2><span>实时赛前数据</span></div><div class="panel empty"><span style="font-size:28px">⚽</span><b>赛事数据待同步</b><div class="muted">正式客户接口接通后，这里展示真实赛事、赛前冻结时间和各模块分析。</div></div></div><div id="detail"><button class="back" id="back">← 返回分析中心</button><div class="panel"><span class="pill" id="tag">分析模块</span><h3 id="detailTitle" style="margin-top:13px"></h3><p class="muted" id="description"></p><div id="fields"></div><div class="empty"><b>暂无已核验的赛前分析</b><div class="muted">接入正式公开接口后展示真实比赛数据；缺失字段标记未确认。</div></div></div></div></main></div><nav class="bottom"><button class="active" data-nav="首页">⌂<br>首页</button><button data-nav="赛事">▦<br>赛事</button><button data-nav="战绩">▥<br>战绩</button><button data-nav="我的">◉<br>我的</button></nav><script>const modules=[["★","每日优选","首选、次选及单双选","FT首选|FT次选|让球方向|A+/B+等级"],["❄","冷门检测","热门不胜与让平风险","市场热门|平局风险|直接输球风险|让平风险"],["◇","六维定胆","六维稳定性审计","市场支持|实力差距|比分分布|阵容情报|尾部风险|数据质量"],["▤","胜平负锦囊","FT概率及方向仲裁","主胜概率|平局概率|客胜概率|最终首选|次选"],["⚽","泊松进球数","比分与总进球概率","主队预期进球|客队预期进球|总进球Top1|比分分布"],["↗","凯利方差","机构赔率分歧分析","赔率时间点|机构样本|主胜离散度|平局离散度|客胜离散度"],["⚖","Elo让球分析","实力差与净胜球审计","主队Elo|客队Elo|澳门让球|体彩官方让球|让球方向"]];const tiles=document.getElementById("tiles"),home=document.getElementById("home"),detail=document.getElementById("detail");function show(i){const m=modules[i];document.getElementById("detailTitle").textContent=m[1];document.getElementById("description").textContent=m[2];document.getElementById("fields").replaceChildren(...m[3].split("|").map(s=>{const e=document.createElement("div");e.className="line";const a=document.createElement("span"),b=document.createElement("span");a.textContent=s;b.textContent="待核验";b.style.color="#8793a7";e.append(a,b);return e}));home.classList.add("hide");detail.classList.add("show");window.scrollTo(0,0)}modules.forEach((m,i)=>{const b=document.createElement("button");b.className="tile";b.innerHTML='<span class="ico">'+m[0]+'</span><strong>'+m[1]+'</strong><small>'+m[2]+'</small>';b.addEventListener("click",()=>show(i));tiles.append(b)});function back(){detail.classList.remove("show");home.classList.remove("hide")}document.getElementById("back").onclick=back;document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-nav]").forEach(x=>x.classList.remove("active"));b.classList.add("active");back();if(b.dataset.nav!=="首页"){home.innerHTML='<div class="panel empty"><b>'+b.dataset.nav+' · 待接入</b><div class="muted">正式数据及客户服务功能将在验收后开放。</div></div>'}});</script></body></html>
