<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d62c31">
  <link rel="icon" type="image/jpeg" href="./assets/ninety-mark-avatar.jpg">
  <title>九十刻度 · 4.0 赛事分析</title>
  <link rel="stylesheet" href="./assets/app-20261003.css?v=20261012-abc-audit-ui-v2">
  <style>
    /* Keep the same shell, navigation, fixture and choice grid as the main site. */
    .app{padding-bottom:75px}
    .hero{background:var(--red)}
    .hero:before,.hero:after{display:none}
    .brandbar{padding:10px 14px 7px}
    .models{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;padding:6px 12px 10px;overflow:visible}
    .model{grid-column:span 3;display:flex;align-items:center;justify-content:center;min-width:0;min-height:42px;padding:8px 2px;border:1px solid #ffffff29;border-radius:8px;background:#ffffff17;color:#fff;font-size:clamp(11px,2.9vw,13px);font-weight:600;line-height:1.3;white-space:nowrap;text-align:center;cursor:pointer}
    .model:nth-child(n+5){grid-column:span 4}
    .model.active{background:#fff;color:var(--deep);border-color:#fff;font-weight:800}
    .v4-datebar{border-top:1px solid #ffffff24;padding:8px 14px 10px;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .v4-datebar span:last-child{color:#ffdbdb}
    .toolbar{padding:11px 13px 10px}
    .toolbar-top{font-size:12px}
    .metrics{margin-top:9px}
    .metric{padding:8px 4px}
    .metric b{font-size:17px}
    .content{padding:9px 12px 24px}
    .section-head{padding:2px 2px 9px}
    .cards{gap:10px}
    .card{padding:0 13px 12px;cursor:default}
    .card:active{transform:none}
    .card-head{height:37px}
    .fixture{padding:3px 0 10px}
    .team-list{gap:8px}
    .crest{width:32px;height:32px}
    .team-name{font-size:15px}
    .analysis{padding-top:9px}
    .triplet{border-radius:9px}
    .datum{padding:9px 4px}
    .datum span{font-size:10px}
    .datum b{font-size:15px}
    .datum.primary{background:#fff4f4}
    .datum .v4-prob{font-size:11px;color:#888;margin:4px 0 0}
    .datum.hit{background:#eaf6f0}
    .datum.hit b{color:#278464!important}
    .datum.miss b{color:#333}
    .status.verified{background:var(--green)}
    .v4-stats{background:#fff;border:1px solid #ececec;border-radius:11px;margin:11px 0 4px;overflow:hidden}
    .v4-stats-head{padding:11px 12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px;align-items:center}
    .v4-stats-head strong{font-size:13px;color:#333}
    .v4-stats-head span{font-size:10px;color:#999}
    .v4-stat-group{padding:9px 12px}
    .v4-stat-group+.v4-stat-group{border-top:1px solid #eee}
    .v4-stat-title{font-size:11px;font-weight:800;color:#555;margin-bottom:7px}
    .v4-stat-line{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:4px 0;font-size:12px;color:#555}
    .v4-stat-line b{color:#c92731;font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
    .v4-stat-line small{color:#999;font-size:10px}
    .v4-verdict{margin-top:10px;border-radius:8px;background:#f5f5f5;padding:9px 10px;font-size:11px;line-height:1.65;color:#777}
    .v4-verdict.hit{background:#eaf6f0;color:#278464}
    .v4-verdict.miss{background:#fff0f0;color:#b94146}
    .v4-verdict b{font-size:12px}
    .v4-meta{margin-top:9px;border-top:1px solid #eee;padding-top:9px;font-size:10px;line-height:1.6;color:#999;overflow-wrap:anywhere}
    .v4-risk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .v4-risk .upset-panel{min-height:86px;padding:9px}
    .v4-risk .upset-value{font-size:19px}
    .v4-risk .upset-label{font-size:11px;margin-top:5px}
    .v4-reason{font-size:11px;color:#666;line-height:1.65;margin:9px 0 0}
    .v4-reason+.v4-reason{margin-top:4px}
    .v4-note{margin:10px 0 0;color:#999;font-size:10px;line-height:1.55}
    .v4-refresh{border:1px solid #dedede;border-radius:6px;background:#fff;color:#555;padding:5px 10px;font-size:11px;cursor:pointer}
    .v4-foot{color:#999;font-size:10px;line-height:1.65;margin:13px 3px}
    .v4-error{color:#b94146}
    @media(max-width:360px){.team-name{font-size:13px}.v4-stat-line{font-size:11px}.metric b{font-size:15px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="brandbar">
        <div class="brand"><img class="logo" src="./assets/ninety-mark-avatar.jpg" width="40" height="40" alt="九十刻度图标"><div><strong>九十刻度</strong><small>NINETY MARK</small></div></div>
        <div class="version">4.0 测试</div>
      </div>
      <nav class="models" id="models" aria-label="赛事分析模块"></nav>
      <div class="v4-datebar"><b id="sale-day">赛事日期 —</b><span>赛前冻结 · 赛后核验</span></div>
    </header>
    <main class="main">
      <section class="toolbar">
        <div class="toolbar-top"><span class="count" id="pool-count">正在读取赛事数据</span></div>
        <div class="metrics">
          <div class="metric"><b id="predicted">—</b><span>本模块正式预测</span></div>
          <div class="metric"><b id="settled">—</b><span>赛果已核验</span></div>
          <div class="metric"><b id="pending">—</b><span>等待赛果</span></div>
        </div>
      </section>
      <section class="content">
        <div class="v4-stats" id="module-stats"></div>
        <div class="section-head"><h2 id="section-title">胜平负赛事</h2><button class="v4-refresh" id="refresh" type="button">刷新</button></div>
        <div class="cards" id="matches"><div class="empty">正在加载今日赛事…</div></div>
        <p class="v4-foot">九十刻度提供赛事数据、概率分析和赛后复盘。模型结果存在不确定性。</p>
      </section>
    </main>
    <nav class="bottom" aria-label="页面导航"><div class="bottom-inner"><a class="nav active" href="./index.html" style="text-decoration:none"><i>⌂</i>首页</a><a class="nav" href="./member.html" style="text-decoration:none"><i>◎</i>我的</a></div></nav>
  </div>
  <script>
    const $=id=>document.getElementById(id);
    const modules=[
      ['今日优选','今日优选'],['胜平负','胜平负'],['让球','全场让球'],['半全场','半全场'],
      ['比分','全场比分'],['总进球','泊松进球'],['冷门预警','冷门预警']
    ];
    let report=null,active='胜平负';
    const label=value=>value==null?'—':String(value);
    const stamp=value=>{if(!value)return '—';const date=new Date(value);if(Number.isNaN(date.getTime()))return label(value);return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(date).replace(/\//g,'-')};
    const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!=null)node.textContent=String(text);return node};
    const rate=row=>row?.total?`${row.hit}/${row.total}＝${(100*row.hit/row.total).toFixed(2)}%`:'0/0 · 暂无正式样本';
    const pct=value=>Number.isFinite(Number(value))&&value!=null?`${Math.round(Number(value)*100)}%`:'—';
    const visibleName=name=>modules.find(([key])=>key===name)?.[1]||name;
    function navigation(){
      const root=$('models');root.replaceChildren();
      for(const [key,name] of modules){const button=el('button','model'+(key===active?' active':''),name);button.type='button';button.setAttribute('aria-current',key===active?'page':'false');button.onclick=()=>{active=key;navigation();render()};root.append(button)}
    }
    function stats(){
      const today=report.metrics?.module_stats?.[active],history=report.historical_metrics?.module_stats?.[active];
      $('predicted').textContent=today?.predicted??0;$('settled').textContent=today?.verified??0;$('pending').textContent=today?.pending??0;
      const root=$('module-stats'),head=el('div','v4-stats-head');root.replaceChildren();
      head.append(el('strong','',visibleName(active)+' · 独立命中率'),el('span','','仅统计正式预测且已核验场次'));root.append(head);
      for(const [period,stat] of [['今日',today],['历史累计',history]]){
        const group=el('div','v4-stat-group');
        group.append(el('div','v4-stat-title',`${period} · 正式预测 ${stat?.predicted??0} 场 · 已核验 ${stat?.verified??0} 场 · 待核验 ${stat?.pending??0} 场`));
        for(const [key,row] of Object.entries(stat?.rates||{})){
          const line=el('div','v4-stat-line');
          line.append(el('span','',key|| (active==='今日优选'?'正式推荐命中':'预警效果')),el('b','',rate(row)));group.append(line)
        }
        root.append(group)
      }
    }
    function fixture(card,match){
      const head=el('div','card-head'),id=el('div','match-id');
      id.append(el('span','league',label(match.league)),document.createTextNode(label(match.kickoff)+' · '+label(match.match_no)));
      head.append(id,el('span','status'+(match.settlement?' verified':' pass'),match.settlement?'已核验':'待核验'));card.append(head);
      const row=el('div','fixture'),teams=el('div','team-list');
      for(const [name,index] of [[match.home,0],[match.away,1]]){
        const team=el('div','team'),crest=el('span','crest',label(name).slice(0,1));
        crest.setAttribute('aria-hidden','true');team.append(crest,el('span','team-name',label(name)));teams.append(team)
      }
      const score=el('div','score',match.settlement?.ft||'VS');
      score.append(el('span','',match.settlement?`半场 ${label(match.settlement.ht)} · 正式赛果`:'赛前预测'));
      row.append(teams,score);card.append(row)
    }
    function choices(card,match,items,probabilities){
      const grid=el('div','triplet'+(items.length===2?' pair':''));
      const result=match.settlement?.module_results?.[active];
      items.forEach((value,index)=>{
        const actualHit=result&&String(result.actual)===String(value),cell=el('div','datum'+(actualHit?' hit':index===0?' primary':''));
        cell.append(el('span','',`Top${index+1}`),el('b','',label(value)),el('span','v4-prob',pct(probabilities?.[String(value)])));
        if(actualHit)cell.append(el('span','hit-check','✓'));grid.append(cell)
      });
      const analysis=el('div','analysis');analysis.append(grid);card.append(analysis)
    }
    function special(card,match){
      const data=match.prediction?.modules?.[active]||{},analysis=el('div','analysis');
      if(active==='今日优选'){
        if(data.selection||data.candidate)choices(card,match,[data.selection||data.candidate],match.prediction.modules['胜平负']?.probabilities);
        analysis.append(el('div','advice',data.selection?'正式入选 · '+data.selection:data.candidate?'优选观察 · '+data.candidate:'未正式入选'));
        if(data.reason)analysis.append(el('p','v4-reason',data.reason));
        for(const detail of data.evidence||[])analysis.append(el('p','v4-reason','依据 · '+detail))
      }else{
        const blocks=el('div','v4-risk');
        for(const [value,title] of [[data.direction,'风险方向'],['正式预警','预警状态']]){
          const panel=el('div','upset-panel');panel.append(el('div','upset-value',value),el('div','upset-label',title));blocks.append(panel)
        }
        analysis.append(blocks);
        for(const detail of data.evidence||[])analysis.append(el('p','v4-reason',detail))
      }
      card.append(analysis)
    }
    function verdict(card,match){
      const settled=match.settlement,result=settled?.module_results?.[active],box=el('div','v4-verdict');
      if(!settled)box.textContent='赛果待核验 · 本模块暂不计入命中率';
      else if(!result)box.textContent='本模块结算待更新';
      else{
        box.className+=' '+(result.status==='HIT'?'hit':result.status==='MISS'?'miss':'');
        const actual=active==='冷门预警'?'正式赛果 '+label(result.actual):'实际结果 '+label(result.actual);
        const checks=result.hits?Object.entries(result.hits).map(([key,hit])=>key+' '+(hit?'命中':'未命中')).join(' · '):
          result.status==='HIT'?'命中':result.status==='MISS'?'未命中':active==='今日优选'?'未正式入选':'未正式触发';
        box.append(el('b','',actual+' · '+checks));
        if(active==='冷门预警'&&result.direction)box.append(el('div','',`风险方向 ${result.direction} · 冷门${result.upset_occurred?'发生':'未发生'}`))
      }
      card.append(box);
      card.append(el('div','v4-meta',`赛前冻结 ${stamp(match.predicted_at)} · 核验 ${stamp(settled?.verified_at)}`))
    }
    function render(){
      if(!report)return;
      stats();$('sale-day').textContent='赛事日期 '+label(report.sale_day);
      $('pool-count').textContent=`全池 ${report.matches.length} 场 · 最近更新 ${stamp(report.generated_at)}`;
      const focus=active==='冷门预警'?report.matches.filter(match=>{const warning=match.prediction?.modules?.[active];return warning?.status==='TRIGGERED'&&warning.triggered===true&&['主队不败','主队不胜'].includes(warning.direction)}):
        active==='今日优选'?report.matches.filter(match=>['SELECTED','CANDIDATE'].includes(match.prediction?.modules?.[active]?.status)):report.matches;
      $('section-title').textContent=`${visibleName(active)}赛事 · ${focus.length}场`;
      const root=$('matches');root.replaceChildren();
      if(!focus.length){root.append(el('div','empty',active==='今日优选'?'今日暂无优选场次':active==='冷门预警'?'今日暂无正式冷门预警':'暂无赛事数据'));return}
      for(const match of focus){
        const card=el('article','card');fixture(card,match);
        const data=match.prediction?.modules?.[active];
        if(match.prediction?.status!=='PREDICTED'||!data)card.append(el('div','v4-verdict v4-error',match.prediction?.reason||'暂无正式预测'));
        else if(active==='冷门预警'||active==='今日优选')special(card,match);
        else{
          if(active==='让球')card.append(el('div','v4-note',`官方让球：主队 ${data.handicap>0?'+':''}${label(data.handicap)} 球`));
          choices(card,match,data.top2||data.top3||[],data.probabilities)
        }
        verdict(card,match);root.append(card)
      }
    }
    async function load(){
      try{
        const response=await fetch('./data/engine4/latest.json?t='+Date.now(),{cache:'no-store'});
        if(!response.ok)throw Error('HTTP '+response.status);
        const data=await response.json();if(!Array.isArray(data.matches))throw Error('报告格式错误');
        report=data;render()
      }catch(error){
        $('pool-count').textContent='赛事数据暂时无法加载';
        $('matches').replaceChildren(el('div','error','赛事数据暂时无法加载，请稍后刷新'))
      }
    }
    $('refresh').onclick=load;navigation();load();
  </script>
</body>
</html>
