<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>九十刻度4.0 · 独立引擎验收</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0a1220;color:#edf3fb}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:28px 16px 60px}h1{font-size:clamp(26px,5vw,42px);margin:10px 0}h2{font-size:20px;margin:0 0 12px}p{color:#a8b8cc;line-height:1.6}.eyebrow{color:#dbbb72;font-weight:700;letter-spacing:.12em}.hero{padding:24px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{border:1px solid #80663d;background:#2b291f;color:#e8c77e;padding:6px 10px;border-radius:30px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.panel,.fixture{background:#131f33;border:1px solid #2c3b51;border-radius:16px;padding:18px;margin:16px 0}.stat{background:#1b2b40;padding:16px;border-radius:12px}.stat b{display:block;font-size:25px;margin-top:5px}.fixture h3{font-size:20px;margin:0 0 10px}.fixture .meta{font-size:13px;color:#a7b8d2}.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px;margin-top:16px}.mod{background:#1b2b40;padding:12px;border-radius:10px}.mod b{color:#dfc17d;display:block;margin-bottom:5px}.mod span{font-size:14px;line-height:1.5}.low{color:#f0c879}.error{color:#ff9c9c}button{background:#324968;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}a{color:#dcb871}small{color:#98abc2}#status{min-height:24px}</style></head><body><main><header class="hero"><div class="eyebrow">九十刻度 / 90 SCALE</div><h1>4.0 独立引擎验收台</h1><p>中国体育彩票官方赛程与 SP 赛前基线 · GitHub Actions 自动生成 · 赛后官方结果核验</p><div class="row"><span class="pill">测试环境</span><span class="pill">不连接旧库</span><button id="refresh">刷新数据</button></div></header><section class="grid"><div class="stat">官方赛程场次<b id="count">—</b></div><div class="stat">已生成预测<b id="predicted">—</b></div><div class="stat">已核验赛果<b id="settled">—</b></div><div class="stat">胜平负 Top1 实测<b id="hit">—</b></div></section><section class="panel"><h2>数据状态</h2><div id="status">正在读取最新报告…</div><p id="detail"></p><small>概率来自 SP 去水归一化，不等同真实胜率。比分、进球、半全场使用简化泊松模型；尚无独立 xG、必发、威廉或澳门盘口校准。未结算场次不纳入命中率。</small></section><section><h2>逐场七模块预测</h2><div id="matches"><p>等待真实数据</p></div></section></main><script>
const $=id=>document.getElementById(id);const url='/data/engine4/latest.json';const safe=v=>String(v??'—');const list=v=>Array.isArray(v)&&v.length?v.join(' · '):'数据不足';function text(parent,cls,value){const el=document.createElement('div');el.className=cls;el.textContent=value;parent.append(el);return el}function render(data){if(!data||!Array.isArray(data.matches))throw Error('报告格式错误');$('count').textContent=data.matches.length;$('predicted').textContent=data.matches.filter(x=>x.prediction?.status==='PREDICTED').length;$('settled').textContent=data.metrics?.settled??0;$('hit').textContent=data.metrics?.top1_hit_rate==null?'待赛果':Math.round(data.metrics.top1_hit_rate*100)+'%';$('status').textContent=safe(data.status)+' · '+safe(data.pool_verification);$('detail').textContent='销售日 '+safe(data.sale_day)+' · 生成时间 '+safe(data.generated_at)+' · 来源 '+safe(data.source)+(data.errors?.length?' · 异常 '+data.errors.join('；'):'');const root=$('matches');root.replaceChildren();if(!data.matches.length){text(root,'panel','本次没有可展示的真实赛前预测，验收未通过。');return}for(const m of data.matches){const card=document.createElement('article');card.className='fixture';const head=document.createElement('h3');head.textContent=safe(m.match_no)+' · '+safe(m.home)+' vs '+safe(m.away);card.append(head);text(card,'meta',safe(m.league)+' · '+safe(m.kickoff)+' · 官方比赛 ID '+safe(m.source_id));const p=m.prediction;if(p?.status!=='PREDICTED'){text(card,'low',safe(p?.reason||'未预测'));root.append(card);continue}const modules=document.createElement('div');modules.className='modules';const x=p.modules;const entries=[['胜平负','Top1 '+safe(x['胜平负'].top1)+'｜Top2 '+list(x['胜平负'].top2)],['让球',safe(x['让球'].handicap)+'球｜'+list(x['让球'].top2)],['比分','Top3 '+list(x['比分'].top3)],['总进球','Top3 '+list(x['总进球'].top3)],['半全场','Top3 '+list(x['半全场'].top3)],['冷门预警',safe(x['冷门预警'].level)+'风险｜'+safe(x['冷门预警'].reason)],['今日优选',safe(x['今日优选'].selection||'未入选')+'｜'+safe(x['今日优选'].reason)]];for(const [label,val] of entries){const box=document.createElement('div');box.className='mod';const bold=document.createElement('b');bold.textContent=label;box.append(bold);text(box,'',val);modules.append(box)}card.append(modules);text(card,'meta','赛前生成 '+safe(m.predicted_at)+' · 信心 '+safe(p.confidence)+(m.settlement?' · 官方赛果 '+m.settlement.ft:' · 待核验'));root.append(card)}}async function load(){try{const response=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);render(await response.json())}catch(err){$('status').textContent='验收未通过：无法读取自动生成的真实报告';$('detail').textContent=err.message;$('matches').replaceChildren()}}$('refresh').onclick=load;load();
</script></body></html>
