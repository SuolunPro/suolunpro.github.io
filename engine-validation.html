<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071522"><title>九十刻度4.0 · 七模块验收</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#262d38;background:#f1f3f5;--navy:#071522;--gold:#eac878;--red:#c93138;--muted:#778494;--line:#e6e9ee}*{box-sizing:border-box}body{margin:0}.app{max-width:640px;min-height:100vh;margin:auto;background:#f5f6f8;padding-bottom:40px}.hero{background:linear-gradient(145deg,#081524,#142c43);color:#f3f7fc;padding:17px 16px 0}.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;border-radius:11px;border:1px solid #d5b46a77}.brand strong{display:block;font-size:17px}.brand small{color:#b4c4d2;font-size:10px;letter-spacing:1.5px}.badge{margin-left:auto;border:1px solid #b69c61;color:var(--gold);border-radius:20px;padding:4px 8px;font-size:11px}.hero h1{font-size:22px;margin:17px 0 4px}.hero p{font-size:12px;color:#afc0d0;margin:0 0 16px;line-height:1.5}.nav{display:flex;gap:3px;overflow:auto;scrollbar-width:none;margin:0 -16px;padding:0 12px}.nav::-webkit-scrollbar{display:none}.nav button{font:inherit;flex:none;white-space:nowrap;color:#a9bfd2;background:none;border:0;border-bottom:3px solid transparent;padding:10px 11px;font-size:13px;cursor:pointer}.nav button.active{color:#fff;border-color:var(--gold);font-weight:800}.content{padding:12px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.stat{background:#fff;border-radius:11px;padding:12px 6px;text-align:center;box-shadow:0 2px 10px #10243a08}.stat span{display:block;font-size:10px;color:#788392}.stat b{display:block;font-size:20px;color:#263142;margin-top:4px}.notice{font-size:12px;line-height:1.6;background:#fff;border-left:3px solid #d8ae54;border-radius:8px;padding:10px 12px;color:#596476;margin:12px 0}.notice strong{color:#283243}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 9px}.toolbar h2{font-size:16px;margin:0}.toolbar button{background:#fff;border:1px solid #dce1e7;color:#445365;border-radius:8px;padding:6px 10px;font-size:12px}.card{background:#fff;border-radius:16px;margin:10px 0;box-shadow:0 2px 12px #0b25300c;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:11px;color:#708093}.card-head b{color:#445163}.status{color:#ad7833;background:#fff5dc;border-radius:12px;padding:4px 8px;white-space:nowrap}.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:7px;padding:17px 12px}.team{font-size:16px;font-weight:800;overflow-wrap:anywhere}.vs{font-size:12px;color:#97a1ad}.module{border-top:1px solid var(--line);padding:13px 14px}.module-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.module-head strong{font-size:14px}.module-head small{font-size:10px;color:#8994a2}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{position:relative;min-height:76px;background:#f7f8fa;border:1px solid #e7e9ed;border-radius:10px;padding:9px 5px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;text-align:center}.choice.top{background:#fff8f7;border-color:#eac4c2}.choice .role{font-size:10px;color:#88939f}.choice .name{font-size:17px;font-weight:750;color:#26303c}.choice.top .name,.choice.top .pct{color:var(--red)}.choice .pct{font-size:12px;color:#657180;font-variant-numeric:tabular-nums}.line{color:#566579;font-size:12px;line-height:1.55}.line strong{color:#263c54}.footer{padding:11px 14px;border-top:1px solid var(--line);color:#8b97a5;font-size:10px;line-height:1.55}.empty{padding:28px;text-align:center;color:#8b97a5}.error{color:#b74142}.footnote{color:#87939e;font-size:11px;line-height:1.6;padding:8px 3px}@media(max-width:360px){.team{font-size:14px}.choice .name{font-size:15px}.stat b{font-size:18px}}
</style></head><body><div class="app"><header class="hero"><div class="brand"><img src="./assets/ninety-mark-avatar.jpg" alt="九十刻度"><div><strong>九十刻度</strong><small>NINETY MARK · 4.0</small></div><span class="badge">独立验收</span></div><h1>竞彩足球七模块预测</h1><p>赛前模型输出 · 真实赛事 · 赛后核验</p><nav class="nav" id="nav" aria-label="预测模块"></nav></header><main class="content"><section class="summary"><div class="stat"><span>候选场次</span><b id="count">—</b></div><div class="stat"><span>已预测</span><b id="predicted">—</b></div><div class="stat"><span>已核验</span><b id="settled">—</b></div><div class="stat"><span>Top1命中</span><b id="hit">—</b></div></section><div class="notice" id="notice">正在读取真实赛前预测…</div><div class="toolbar"><h2 id="section-title">全部比赛</h2><button id="refresh" type="button">刷新预测</button></div><div id="matches"></div><p class="footnote">概率口径：胜平负与让球为当前 SP 去水隐含比例；比分、总进球及半全场为简化泊松估算。它们不是已验证的真实胜率。缺少机构、必发与独立 xG 时不提高信心；风险等级不换算成百分比。</p></main></div><script>
const $=id=>document.getElementById(id),tabs=['全部','胜平负','让球','比分','总进球','半全场','冷门预警','今日优选'];let report=null,active='全部';const label=v=>v==null?'—':String(v),percent=v=>Number.isFinite(Number(v))?Math.round(Number(v)*100)+'%':'未估算';function elem(tag,cls,content){const x=document.createElement(tag);if(cls)x.className=cls;if(content!=null)x.textContent=String(content);return x}function moduleBox(name,items,probabilities,note){const box=elem('section','module'),head=elem('div','module-head');head.append(elem('strong','',name),elem('small','',note||''));box.append(head);if(items.length){const grid=elem('div','choices'+(items.length===2?' two':''));items.forEach((item,i)=>{const c=elem('div','choice'+(i===0?' top':''));c.append(elem('span','role',i===0?'Top1':'Top'+(i+1)),elem('span','name',label(item)),elem('span','pct',percent(probabilities?.[String(item)])));grid.append(c)});box.append(grid)}else box.append(elem('div','line','暂无可靠选项'));return box}function renderModule(card,name,m){const p=m.prediction,all=p?.modules;if(p?.status!=='PREDICTED'||!all){card.append(elem('div','module error',p?.reason||'无可用赛前预测'));return}const x=all[name];if(name==='胜平负')card.append(moduleBox(name,x.top2,x.probabilities,'SP 去水隐含比例'));else if(name==='让球')card.append(moduleBox(name,x.top2,x.probabilities,(x.handicap==null?'让球数待确认':`主队 ${x.handicap>0?'+':''}${x.handicap} 球`)+' · SP 去水'));else if(name==='比分'||name==='总进球'||name==='半全场')card.append(moduleBox(name,x.top3,x.probabilities,'简化泊松估算'));else if(name==='冷门预警'){const b=elem('section','module');b.append(elem('div','module-head',name),elem('div','line',`${x.level}风险 · ${x.reason}`));card.append(b)}else if(name==='今日优选'){const b=elem('section','module');b.append(elem('div','module-head',name));if(x.selection)b.append(moduleBox('入选方向',[x.selection],all['胜平负'].probabilities,'SP 去水隐含比例'));b.append(elem('div','line',x.selection?x.reason:`未入选 · ${x.reason}`));card.append(b)}}function render(){if(!report)return;const root=$('matches');root.replaceChildren();$('section-title').textContent=active==='全部'?'全部比赛 · 七模块':active+' · 全部比赛';if(!report.matches.length){root.append(elem('div','empty','暂无可展示的真实赛前预测'));return}for(const m of report.matches){const card=elem('article','card'),head=elem('div','card-head');head.append(elem('span','',`${label(m.match_no)} · ${label(m.league)} · ${label(m.kickoff)}`),elem('span','status',m.settlement?`已核验 ${m.settlement.ft}`:'赛前预测'));card.append(head);const f=elem('div','fixture');f.append(elem('div','team',m.home),elem('span','vs','VS'),elem('div','team',m.away));card.append(f);for(const name of active==='全部'?tabs.slice(1):[active])renderModule(card,name,m);card.append(elem('div','footer',`来源 ID ${label(m.source_id)} · 生成 ${label(m.predicted_at)} · ${label(m.prediction?.confidence)}`));root.append(card)}}function nav(){const root=$('nav');root.replaceChildren();for(const name of tabs){const b=elem('button',active===name?'active':'',name);b.type='button';b.setAttribute('aria-current',active===name?'page':'false');b.onclick=()=>{active=name;nav();render()};root.append(b)}}async function load(){try{const response=await fetch('./data/engine4/latest.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.matches))throw Error('报告格式错误');report=data;$('count').textContent=data.matches.length;$('predicted').textContent=data.matches.filter(x=>x.prediction?.status==='PREDICTED').length;$('settled').textContent=data.metrics?.settled??0;$('hit').textContent=data.metrics?.top1_hit_rate==null?'待赛果':percent(data.metrics.top1_hit_rate);$('notice').textContent=`销售日 ${label(data.sale_day)} · 来源 ${label(data.source)} · ${data.pool_verification==='OFFICIAL_SOURCE'?'官方赛程':'第三方候选，全池尚未官方核实'} · 更新时间 ${label(data.generated_at)}${data.errors?.length?' · 异常：'+data.errors.join('；'):''}`;render()}catch(e){$('notice').textContent='验收未通过：无法读取自动生成的真实报告 · '+e.message;$('notice').classList.add('error');$('matches').replaceChildren()}}$('refresh').onclick=load;nav();load();
</script></body></html>
