<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>豪·足球模型｜会员订单后台</title><style>:root{--bg:#07111f;--p:#0d1b2d;--line:#1b3554;--t:#ecf5ff;--m:#91a8bf;--g:#40d693;--gold:#f2c66d;--r:#ff8190}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#17385f,#07111f 43%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:920px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:22px;font-weight:900}.small{font-size:10px;color:var(--m);line-height:1.6}.card{border:1px solid var(--line);background:linear-gradient(180deg,#0f2238,#0b192a);border-radius:15px;padding:14px;margin-top:12px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid #2b5681;background:#123153;color:#d9edff;border-radius:9px;padding:8px 10px;font-size:11px;cursor:pointer}.btn.active{background:#dff1ff;color:#092139}.btn.good{border-color:#2d7a56;background:#123325;color:#8ee8b7}.btn.bad{border-color:#713342;background:#321820;color:#ff9dad}.order{border:1px solid #1c3d60;background:#0a192a;border-radius:14px;padding:13px;margin-top:9px}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.orderNo{font-weight:900;color:var(--gold)}.money{font-size:19px;font-weight:900}.kv{display:grid;grid-template-columns:105px 1fr;gap:6px 10px;margin-top:10px;font-size:11px;line-height:1.55}.kv>div:nth-child(odd){color:var(--m)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.notice{border:1px solid #765821;background:#2b2314;color:#ffd985;border-radius:12px;padding:11px 13px;margin-top:12px;font-size:11px;line-height:1.6}.empty{text-align:center;color:var(--m);padding:30px}.goodtxt{color:var(--g)}.badtxt{color:var(--r)}@media(max-width:600px){.row{display:block}.money{margin-top:6px}.kv{grid-template-columns:88px 1fr}}</style></head><body><main class="wrap"><div class="top"><div><div class="title">会员订单后台</div><div class="small">复用「豪·足球模型」私人控制台登录令牌</div></div><a class="btn" href="/">返回私人后台</a></div><div class="card" id="authCard"><b>🔒 私人访问</b><div class="small" style="margin-top:7px">如果你已经登录私人控制台，这里会直接读取同一个本地令牌。未登录时先返回私人后台登录。</div></div><div id="app" class="hidden"></div></main><script>const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-member-admin-v01';let FILTER='submitted';const token=()=>localStorage.getItem('hao_console_token')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(t){if(!t)return'—';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t))}catch{return t}}async function call(path='',opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token(),...(opts.headers||{})}}),j=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!j.ok)throw new Error(j.error||'请求失败');return j}function statusText(s){return({pending:'待付款',submitted:'待审核',paid:'已开通',rejected:'未通过',cancelled:'已取消'})[s]||s}function render(j){const app=document.getElementById('app'),orders=j.orders||[],cfg=j.payment||{};app.className='';app.innerHTML=`<div class="notice">支付宝商家码状态：<b class="${cfg.enabled?'goodtxt':'badtxt'}">${cfg.enabled?'已启用':'尚未绑定'}</b>${cfg.merchant_display_name?' · '+esc(cfg.merchant_display_name):''}<br>${cfg.enabled?'客户可生成真实订单并提交支付宝订单号。':'当前客户无法生成真实付款订单。等你提供官方商家收款码后再启用。'}</div><div class="filters">${['submitted','pending','paid','rejected','all'].map(x=>`<button class="btn ${FILTER===x?'active':''}" onclick="setFilter('${x}')">${({submitted:'待审核',pending:'待付款',paid:'已开通',rejected:'未通过',all:'全部'})[x]}</button>`).join('')}</div><div id="orders">${orders.length?orders.map(orderHtml).join(''):'<div class="card empty">当前没有这类订单</div>'}</div>`}function orderHtml(o){const p=o.profile||{};return `<div class="order"><div class="row"><div><div class="orderNo">${esc(o.order_no)}</div><div class="small">${esc(statusText(o.status))} · ${fmt(o.created_at)}</div></div><div class="money">¥${Number(o.amount_cents||0)/100}</div></div><div class="kv"><div>会员账号</div><div>${esc(p.email||o.user_id)}</div><div>套餐</div><div>${o.duration_days}天</div><div>支付宝单号</div><div>${esc(o.payer_trade_no||'未提交')}</div><div>用户备注</div><div>${esc(o.payer_note||'—')}</div><div>提交审核</div><div>${fmt(o.submitted_at)}</div><div>当前会员到期</div><div>${fmt(p.member_until)}</div></div>${o.status==='submitted'?`<div class="actions"><button class="btn good" onclick="review('${o.id}','approve')">确认到账并开通</button><button class="btn bad" onclick="review('${o.id}','reject')">未到账 / 驳回</button></div>`:''}</div>`}async function load(){if(!token()){document.getElementById('authCard').innerHTML='<b>🔒 尚未登录私人控制台</b><div class="small" style="margin-top:7px">请先返回私人后台登录，然后再打开本页。</div><a class="btn" style="display:inline-block;margin-top:10px" href="/">去登录</a>';return}try{const j=await call('?status='+encodeURIComponent(FILTER));document.getElementById('authCard').style.display='none';render(j)}catch(e){if(e.message==='unauthorized'){localStorage.removeItem('hao_console_token');document.getElementById('authCard').innerHTML='<b>🔒 私人登录已过期</b><div class="small" style="margin-top:7px">请返回私人后台重新登录。</div><a class="btn" style="display:inline-block;margin-top:10px" href="/">重新登录</a>'}else document.getElementById('authCard').innerHTML='<b>读取失败</b><div class="small">'+esc(e.message)+'</div>'}}window.setFilter=x=>{FILTER=x;load()};window.review=async(id,action)=>{const label=action==='approve'?'确认支付宝真实到账，并立即为该账号延长会员期限？':'确认驳回这笔订单？';if(!confirm(label))return;const note=prompt('管理员备注（可留空）','')||'';try{await call('',{method:'POST',body:JSON.stringify({action,order_id:id,admin_note:note})});await load()}catch(e){alert(e.message)}};load();</script></body></html>
