<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九十刻度｜会员码登录测试</title><style>body{margin:0;background:#f4f5f8;font:15px system-ui;color:#222}.box{max-width:390px;margin:12vh auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}h1{color:#bf2530}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:9px;font-size:16px}input{border:1px solid #ddd}button{border:0;background:#c72735;color:white;margin-top:15px;font-weight:700}#msg{min-height:22px;color:#b62432}.small{font-size:12px;color:#777}</style></head><body><main class="box"><h1>九十刻度</h1><h2>VIP会员码登录 · 测试版</h2><p>填写会员码（格式：vip+账号）</p><form id="form"><input id="code" autocomplete="username" placeholder="例如 vip+123456@qq.com" required maxlength="100"><button>进入九十刻度</button></form><p id="msg" role="alert"></p><p class="small">独立测试页面；已接入迁移会员资格测试（非正式安全登录）；预测数据仍受原系统保护。</p></main><script>const f=document.getElementById('form'),m=document.getElementById('msg'),c=document.getElementById('code');c.value=localStorage.getItem('ninety_member_code_test')||'';f.addEventListener('submit',async e=>{e.preventDefault();const v=c.value.trim().toLowerCase();if(!/^vip\+(?:[a-z0-9_-]{2,64}|[^\s@]+@[^\s@]+\.[^\s@]+)$/.test(v)){m.textContent='会员码格式不正确（vip+账号）';return}m.textContent='正在检查会员资格…';try{const r=await fetch('./member-code-members.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json();const bytes=new TextEncoder().encode(v);const digest=await crypto.subtle.digest('SHA-256',bytes);const hash=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');const member=(j.members||[]).find(x=>x.code_sha256===hash);if(!member){m.textContent='未查到对应尊贵月卡VIP资格，请核对账号。';return}if(member.active!==true||!member.expires_at||Date.parse(member.expires_at)<=Date.now()){m.textContent='会员已到期或停用，请联系管理员续费。';return}localStorage.setItem('ninety_member_code_test',v);m.textContent='尊贵月卡VIP资格有效，到期时间：'+new Date(member.expires_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'（北京时间）。当前仅验证会员资格，尚未开放预测内容。'}catch(_){m.textContent='会员名单暂不可用，请稍后重试。'}})</script></body></html>
