<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>豪竞2.7 多玩法扫盘</title><style>:root{--bg:#07111f;--panel:#0d1f33;--line:#1b3554;--text:#ecf5ff;--muted:#91a8bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.w{max-width:1320px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top h1{font-size:22px;margin:0}.sub,.foot{font-size:11px;color:var(--muted);line-height:1.6}.back{color:#cde5ff;text-decoration:none;border:1px solid #2b5681;padding:7px 10px;border-radius:9px}.version,.stat,.card,.history{background:linear-gradient(180deg,#0f2238,#0b192a);border:1px solid var(--line);border-radius:14px}.version{padding:9px 11px;margin:10px 0;font-size:11px;color:#b9d5ed}.version b{color:#74e0ad}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:10px 0}.stat{padding:12px}.stat b{display:block;font-size:21px;margin-top:5px}.section{font-size:15px;font-weight:850;margin:18px 0 8px}.note{font-size:11px;color:#f0c46a;margin:7px 0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:12px}.card.high{border-color:#24764f}.card.medium{border-color:#765821}.card.low{border-color:#713342}.head,.line,.result{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.no{font-weight:900;color:#f2c66d}.teams{font-size:16px;font-weight:850;margin:8px 0}.tag{font-size:11px;border:1px solid var(--line);padding:4px 7px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.box{background:#091725;border:1px solid #183655;border-radius:10px;padding:8px;min-width:0}.box span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.box b{font-size:13px;word-break:break-word}.ok{color:#71dfa8}.bad{color:#ff8e9b}.pending{color:#a8bdd0}.reason{margin-top:9px;color:#ff9dad;font-size:11px}.result{margin-top:9px;background:#081522;border:1px solid #24425f;border-radius:9px;padding:8px;font-size:12px}.history{padding:12px;overflow:auto}.history table{width:100%;border-collapse:collapse;font-size:12px;min-width:680px}.history th,.history td{padding:8px;border-bottom:1px solid #183655;text-align:center}.history th{color:#9fb8cf}.loading{text-align:center;color:var(--muted);padding:70px 10px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.cards{grid-template-columns:1fr}.top h1{font-size:19px}}</style></head><body><div class="w"><div class="top"><div><h1>豪竞2.7｜多玩法扫盘</h1><div class="sub">正式FT → 半场胜平负质量Gate → 半全场 → 总进球 → 比分｜只做下游推演，不反改豪竞2.7正式方向</div></div><a class="back" href="/">返回控制台</a></div><div id="app" class="loading">正在读取豪竞2.7最新扫盘…</div></div><script>const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-euro-odds-consensus-probe-v01?scan_public=1';const pct=x=>x==null?'—':(Number(x)*100).toFixed(1)+'%';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function ftProb(x){return x.formal_ft_top1==='主胜'?x.formal_p_home:x.formal_ft_top1==='平'?x.formal_p_draw:x.formal_ft_top1==='客胜'?x.formal_p_away:null}function lc(v){return v==='HIGH'?'high':v==='MED'?'medium':'low'}function lcn(v){return v==='HIGH'?'高共振':v==='MED'?'中等共振':'冲突/观望'}function hit(v){return v===true?'<span class="ok">✓命中</span>':v===false?'<span class="bad">✕未中</span>':'<span class="pending">待结算</span>'}function htBox(x){if(x.ht_pick_eligible)return '<span>半场胜平负｜可出手</span><b class="ok">'+esc(x.ht_pick_top2)+' '+pct(x.ht_pick_top2_mass)+'</b><div class="sub">Top1 '+esc(x.ht_pick_top1)+' '+pct(x.ht_pick_top1_prob)+'｜'+esc(x.formal_selection_label||'🟢单')+'</div>';let why=x.ht_pick_reason==='FT_NOT_FORMAL_SINGLE'?'仅豪竞2.7正式SINGLE可用':x.ht_pick_reason==='HT_TOP2_MASS_LT_75'?'Top2覆盖不足75%':'条件未通过';return '<span>半场胜平负｜PASS</span><b class="pending">'+esc(x.ht_pick_top2||'—')+' '+pct(x.ht_pick_top2_mass)+'</b><div class="sub">'+esc(why)+'</div>'}async function load(){try{const r=await fetch(API+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('接口异常 '+r.status);const j=await r.json();if(!(j.rows||[]).length)throw Error('暂无豪竞2.7扫盘数据');render(j)}catch(e){document.getElementById('app').innerHTML='<div class="card low">扫盘读取失败：'+esc(e.message)+'</div>'}}function render(j){const a=j.rows||[],c=j.cumulative||{},d=j.daily||[];const h=a.filter(x=>x.consistency_level==='HIGH').length,m=a.filter(x=>x.consistency_level==='MED').length,l=a.filter(x=>x.consistency_level==='LOW').length,ht=a.filter(x=>x.ht_pick_eligible).length,carry=a.filter(x=>x.carried_forward_prematch).length;const eng=a[0]?.engine_version||'hj27-multimarket-downstream-v0.4-ft-ht-single-gate';let html='<div class="version"><b>豪竞2.7 · revision 167+</b>｜下游 '+esc(eng)+'｜半场规则：仅正式SINGLE + Top2概率和≥75%｜赛果不参与预测</div><div class="stats"><div class="stat">本轮比赛<b>'+a.length+'</b></div><div class="stat">半场可出手<b>'+ht+'</b></div><div class="stat">高共振<b>'+h+'</b></div><div class="stat">中等共振<b>'+m+'</b></div><div class="stat">冲突/观望<b>'+l+'</b></div></div><div class="note">已启用赛前快照保留：比赛开球后即使实时执行器不再返回比分λ，也不会让原本存在的赛前扫盘场次消失。本轮保留 '+carry+' 场。</div><div class="section">豪竞2.7赛后累计战绩</div><div class="stats"><div class="stat">有效赛前样本<b>'+esc(c.settled_matches??0)+'</b></div><div class="stat">胜平负命中率<b>'+pct(c.ft_hit_rate)+'</b></div><div class="stat">总进球前二覆盖<b>'+pct(c.goals_top2_hit_rate)+'</b></div><div class="stat">比分前三覆盖<b>'+pct(c.score_top3_hit_rate)+'</b></div><div class="stat">高共振胜平负<b>'+pct(c.high_ft_hit_rate)+'</b></div></div><div class="section">本轮逐场扫盘</div><div class="cards">';html+=a.map(x=>{const go=(x.total_goals_top||[]).map(z=>z.goals+'球 '+pct(z.prob)).join(' / '),sc=(x.score_top||[]).slice(0,3).map(z=>z.score+' '+pct(z.p)).join(' / '),carryTag=x.carried_forward_prematch?' <span class="tag">赛前快照保留</span>':'';let res=x.result_verified?'<div class="result"><b>赛果：'+esc(x.result_score)+' · '+esc(x.result_1x2)+'</b>'+(x.record_counted?'<span>胜平负 '+hit(x.ft_top1_hit)+'　进球前二 '+hit(x.total_goals_top2_hit)+'　比分前三 '+hit(x.score_top3_hit)+'</span>':'<span class="pending">仅显示赛果｜不计战绩</span>')+'</div>':'<div class="result"><b>赛果：待完场核验</b><span class="ok">赛前冻结已保留</span></div>';return '<div class="card '+lc(x.consistency_level)+'"><div class="head"><span><b class="no">'+esc(x.match_no)+'</b> <span class="tag">'+esc(x.league)+'</span>'+carryTag+'</span><b>'+lcn(x.consistency_level)+'</b></div><div class="teams">'+esc(x.home_team)+' 对阵 '+esc(x.away_team)+'</div><div class="grid"><div class="box"><span>豪竞2.7正式胜平负</span><b>'+esc(x.formal_ft_top1)+' '+pct(ftProb(x))+'</b><div class="sub">'+esc(x.formal_selection_label||'')+'</div></div><div class="box">'+htBox(x)+'</div><div class="box"><span>半全场前二</span><b>'+esc(x.htft_top1)+' '+pct(x.htft_top1_prob)+' / '+esc(x.htft_top2)+' '+pct(x.htft_top2_prob)+'</b></div><div class="box"><span>总进球前二</span><b>'+esc(go)+'</b></div><div class="box"><span>比分前三</span><b>'+esc(sc)+'</b></div></div>'+res+'<div class="line" style="margin-top:9px"><span class="tag">'+esc(x.script_label)+'</span><span class="sub">半场概率：胜 '+pct(x.ht_p_home)+' / 平 '+pct(x.ht_p_draw)+' / 负 '+pct(x.ht_p_away)+'｜样本 '+esc(x.ht_sample_n)+' 场</span></div>'+(x.conflict_reason?'<div class="reason">⚠ '+esc(x.conflict_reason)+'</div>':'')+'</div>'}).join('')+'</div><div class="section">豪竞2.7每日赛后记录</div><div class="history">'+(d.length?'<table><thead><tr><th>日期</th><th>有效场次</th><th>胜平负</th><th>总进球Top2</th><th>比分Top3</th><th>高共振胜平负</th></tr></thead><tbody>'+d.map(x=>'<tr><td>'+esc(x.pool_date)+'</td><td>'+esc(x.settled_matches)+'</td><td>'+esc(x.ft_hits)+'/'+esc(x.settled_matches)+' ('+pct(x.ft_hit_rate)+')</td><td>'+esc(x.goals_top2_hits)+'/'+esc(x.settled_matches)+' ('+pct(x.goals_top2_hit_rate)+')</td><td>'+esc(x.score_top3_hits)+'/'+esc(x.settled_matches)+' ('+pct(x.score_top3_hit_rate)+')</td><td>'+esc(x.high_ft_hits)+'/'+esc(x.high_settled)+' ('+pct(x.high_ft_hit_rate)+')</td></tr>').join('')+'</tbody></table>':'<div class="pending">revision 167暂无已结算正式样本。</div>')+'</div><div class="foot">半场胜平负现在不是全池乱选：只有豪竞2.7最终正式路由为SINGLE（含原生单/AH扩展单）且半场Top2概率和≥75%才显示“可出手”，其余统一PASS。开球后保留最后一个真实赛前快照，不用赛中数据补预测。</div>';document.getElementById('app').className='';document.getElementById('app').innerHTML=html}load();setInterval(load,60000)</script></body></html>
