<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>索伦引擎 · 管理员</title><style>body{margin:0;background:#f5f5f5;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#242424}.wrap{max-width:650px;margin:35px auto;padding:20px}h1{font-size:23px}.panel{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #00000009}input{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}button{background:#cf2930;color:#fff;border:0;border-radius:8px;padding:12px 18px;margin:8px 8px 0 0;cursor:pointer}.muted{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f7f7f7;border-radius:9px;padding:15px}.stat b{font-size:26px;display:block;margin-top:8px}a{color:#b72129}</style></head><body><div class="wrap"><h1>索伦引擎 · 管理员统计</h1><p class="muted">仅限已授权管理员。普通会员无法读取会员统计。</p><section id="login" class="panel"><h2>管理员登录</h2><input id="email" type="email" autocomplete="email" placeholder="管理员邮箱"><input id="password" type="password" autocomplete="current-password" placeholder="密码"><button id="signIn">登录并查看统计</button><p id="msg" class="muted"></p></section><section id="dashboard" class="panel" hidden><div class="grid"><div class="stat">注册会员总数<b id="total">—</b></div><div class="stat">今日新增会员<b id="today">—</b></div><div class="stat">邮箱已验证<b id="verified">—</b></div><div class="stat">实际记录访次<b id="visits">—</b></div></div><p class="muted">展示访问计数：<span id="display">—</span>。统计基于数据库记录，今日按北京时间计算。</p><button id="refresh">刷新</button><button id="logout">退出</button></section><p><a href="./">返回索伦客户端</a></p></div><script>const base='https://ttydbcejxqxdkcfoizkj.supabase.co',key='sb_publishable_n5thZ1g6h93ronyzPfqhsg_N_lFaoSa';let token=null;const $=id=>document.getElementById(id);async function refresh(){const r=await fetch(base+'/rest/v1/rpc/soren_admin_stats_v1',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error(r.status===403?'该账号尚未获得管理员授权':'统计读取失败：HTTP '+r.status);const d=await r.json();$('total').textContent=Number(d.members_total).toLocaleString();$('today').textContent=Number(d.members_today).toLocaleString();$('verified').textContent=Number(d.email_verified).toLocaleString();$('visits').textContent=Number(d.visits_recorded).toLocaleString();$('display').textContent=Number(d.visits_display).toLocaleString()}$('signIn').onclick=async()=>{const btn=$('signIn');btn.disabled=true;$('msg').textContent='正在验证…';try{const r=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok||!d.access_token)throw Error('邮箱或密码错误，或邮箱尚未完成验证');token=d.access_token;await refresh();$('password').value='';$('login').hidden=true;$('dashboard').hidden=false}catch(e){token=null;$('msg').textContent=e.message}finally{btn.disabled=false}};$('refresh').onclick=async()=>{try{await refresh()}catch(e){alert(e.message)}};$('logout').onclick=()=>{token=null;$('dashboard').hidden=true;$('login').hidden=false;$('msg').textContent='已退出'};</script></body></html>
