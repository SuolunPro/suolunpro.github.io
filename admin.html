<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>索伦引擎 · 管理员统计</title><style>body{margin:0;background:#f5f5f5;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#242424}.wrap{max-width:650px;margin:35px auto;padding:20px}h1{font-size:23px}.panel{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #00000009}input{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}button{background:#cf2930;color:#fff;border:0;border-radius:8px;padding:12px 18px;margin:8px 8px 0 0;cursor:pointer}.muted{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f7f7f7;border-radius:9px;padding:15px}.stat b{font-size:26px;display:block;margin-top:8px}a{color:#b72129}</style></head><body><div class="wrap"><h1>索伦引擎 · 管理员统计</h1><p class="muted">仅限已授权管理员。普通会员无法读取会员统计。</p><section id="login" class="panel"><h2>管理员登录</h2><input id="email" type="email" autocomplete="email" placeholder="管理员邮箱"><input id="password" type="password" autocomplete="current-password" placeholder="密码"><div id="captcha" style="margin:10px 0;min-height:66px"></div><p class="muted">请完成 Cloudflare 安全验证；也可从索伦客户端登录后返回本页。</p><button id="signIn" disabled>登录并查看统计</button><p id="msg" class="muted"></p></section><section id="dashboard" class="panel" hidden><div class="grid"><div class="stat">注册会员总数<b id="total">—</b></div><div class="stat">今日新增会员<b id="today">—</b></div><div class="stat">系统标记邮箱已确认<b id="verified">—</b></div><div class="stat">实际记录访次<b id="visits">—</b></div></div><p class="muted">展示访问计数：<span id="display">—</span>。统计基于数据库记录，今日按北京时间计算。关闭邮箱验证后，「已确认」可能是系统自动标记，不等于用户实际收到过验证邮件。</p><button id="refresh">刷新</button><button id="logout">退出</button></section><p><a href="./review.html">前往邀请审核后台</a>　·　<a href="./">返回索伦客户端</a></p></div><script>"use strict";
const base="https://ttydbcejxqxdkcfoizkj.supabase.co";
const key="sb_publishable_n5thZ1g6h93ronyzPfqhsg_N_lFaoSa";
const siteKey="0x4AAAAAAFBKndRZlD2qH4Km";
const $=id=>document.getElementById(id);
let token=null, captchaToken="",widgetId=null, captchaReady=false;
const showError=e=>{
  if(e==="Email not confirmed")return "当前账号尚未完成邮箱确认。如已关闭确认要求，请在 Supabase Auth 中检查该历史账号状态。";
  if(e==="captcha protection: request disallowed (no captcha token found)")return "验证码令牌未提交，请刷新页面重新验证。";
  return e||"请求失败，请稍后重试";
};
function getSharedSession(){
 for(const store of [localStorage,sessionStorage]){
  try{
   const session=JSON.parse(store.getItem("soren_auth_v2")||"null");
   if(session?.access_token&&session?.user&&(!session.expires_at||Number(session.expires_at)>Date.now()+10000))
     return session;
  }catch{}
 }
 return null;
}
async function refresh(){
 if(!token)throw Error("请先登录管理员账号");
 const r=await fetch(base+"/rest/v1/rpc/soren_admin_stats_v1",{
  method:"POST",headers:{apikey:key,Authorization:"Bearer "+token,"Content-Type":"application/json"},
  body:"{}",cache:"no-store",signal:AbortSignal.timeout(10000)});
 if(!r.ok)throw Error(r.status===403?"该账号尚未获得管理员授权":r.status===401?"登录状态已过期，请返回索伦客户端重新登录":"统计读取失败：HTTP "+r.status);
 const d=await r.json();
 $("total").textContent=Number(d.members_total).toLocaleString();
 $("today").textContent=Number(d.members_today).toLocaleString();
 $("verified").textContent=Number(d.email_verified).toLocaleString();
 $("visits").textContent=Number(d.visits_recorded).toLocaleString();
 $("display").textContent=Number(d.visits_display).toLocaleString();
}
async function showDashboard(accessToken){
 token=accessToken;await refresh();
 $("password").value="";$("login").hidden=true;$("dashboard").hidden=false;$("msg").textContent="";
}
function resetCaptcha(){
 captchaToken="";if(widgetId!==null&&window.turnstile)try{window.turnstile.reset(widgetId)}catch{}
}
function captchaComplete(value){captchaToken=value;$("signIn").disabled=false;$("msg").textContent=""}
function captchaExpired(){captchaToken="";$("signIn").disabled=true;$("msg").textContent="安全验证已过期，请重新完成验证码"}
function captchaFailed(){captchaToken="";$("signIn").disabled=true;$("msg").textContent="验证码暂不可用，请检查网络后重试"}
function loadCaptcha(){
 const js=document.createElement("script");
 js.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
 js.async=true;
 js.onload=()=>{
  if(!window.turnstile){captchaFailed();return}
  captchaReady=true;
  widgetId=window.turnstile.render($("captcha"),{
   sitekey:siteKey,callback:captchaComplete,
   "expired-callback":captchaExpired,"error-callback":captchaFailed
  });
 };
 js.onerror=captchaFailed;
 document.head.append(js);
}
$("signIn").onclick=async()=>{
 const btn=$("signIn");
 if(!captchaReady||!captchaToken){$("msg").textContent="请先完成安全验证码";return}
 if(!$("email").value.trim()||!$("password").value){$("msg").textContent="请填写邮箱和密码";return}
 btn.disabled=true;$("msg").textContent="正在验证…";
 try{
  const r=await fetch(base+"/auth/v1/token?grant_type=password",{
   method:"POST",headers:{apikey:key,"Content-Type":"application/json"},
   body:JSON.stringify({email:$("email").value.trim(),password:$("password").value,
     gotrue_meta_security:{captcha_token:captchaToken}}),
   cache:"no-store",signal:AbortSignal.timeout(12000)});
  const d=await r.json();
  if(!r.ok||!d.access_token)throw Error(d.msg||d.error_description||d.message||"登录未完成");
  await showDashboard(d.access_token);
 }catch(e){token=null;$("msg").textContent=showError(e.message)}
 finally{resetCaptcha();btn.disabled=false}
};
$("refresh").onclick=async()=>{try{await refresh()}catch(e){alert(e.message)}};
$("logout").onclick=()=>{
 token=null;$("dashboard").hidden=true;$("login").hidden=false;$("msg").textContent="已退出当前管理员统计页面";
};
(async()=>{
 const current=getSharedSession();
 if(current){
  $("email").value=current.user.email||"";
  try{await showDashboard(current.access_token);return}
  catch(e){token=null;$("msg").textContent="已检测到客户端登录，但统计页无法读取："+e.message}
 }
 loadCaptcha();
})();
</script></body></html>
