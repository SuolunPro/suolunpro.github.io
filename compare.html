<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><title>索伦引擎 × 外部模型对照</title>
<style>
:root{--bg:#07111f;--p:#0d1b2d;--p2:#10233b;--line:#1b3554;--txt:#ecf5ff;--muted:#91a8bf;--good:#37d98a;--warn:#ffc55a;--bad:#ff6f7f;--blue:#62adff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#183c63 0,#07111f 44%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1240px;margin:auto;padding:16px 12px 50px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.title{font-weight:900;font-size:24px}.sub{color:var(--muted);font-size:12px;line-height:1.55;margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{color:#dcedff;text-decoration:none;border:1px solid #28527c;background:#102c49;border-radius:9px;padding:8px 11px;font-size:12px;cursor:pointer}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:15px 0}.bar input{background:#081522;color:#fff;border:1px solid #274867;border-radius:9px;padding:8px 10px}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:#b8cce0}.good{color:#8cebb9;border-color:#267550}.warn{color:#ffd780;border-color:#765b28}.bad{color:#ff9dab;border-color:#713846}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.metric,.panel{background:linear-gradient(180deg,#0f2238,#0b192a);border:1px solid var(--line);border-radius:14px}.metric{padding:13px}.ml{font-size:11px;color:var(--muted)}.mv{font-size:23px;font-weight:900;margin-top:7px}.panel{overflow:hidden;margin-top:12px}.head{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.head b{font-size:15px}.head span{font-size:11px;color:var(--muted)}.tablewrap{overflow:auto;max-height:70vh}table{border-collapse:collapse;width:100%;min-width:980px;font-size:12px}th,td{padding:10px;border-bottom:1px solid #162f4b;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#0a1a2c;color:#9db4ca;z-index:1}tr:hover{background:#102740}.teams{font-weight:800}.small{font-size:11px;color:var(--muted);margin-top:3px}.pick{font-size:14px;font-weight:900}.prob{font-size:11px;color:#9bcfff;margin-top:3px}.compare{font-weight:850}.detail{display:none;padding:14px}.detail.show{display:block}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#0a192a;border:1px solid #183856;border-radius:12px;padding:12px}.card h3{font-size:13px;margin:0 0 10px}.kv{display:grid;grid-template-columns:110px 1fr;gap:7px;font-size:12px;line-height:1.4}.kv div:nth-child(odd){color:var(--muted)}.notice{padding:10px 12px;border:1px solid #735c2a;background:#2c2515;border-radius:11px;color:#f4d98e;font-size:12px;line-height:1.5;margin:10px 0}.login{max-width:390px;margin:16vh auto;background:#0d1b2d;border:1px solid #214361;border-radius:18px;padding:22px}.login h2{margin:0 0 6px}.login input{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid #274867;background:#081522;color:#fff}.login button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#2e83e6;color:#fff;font-weight:850}.err{color:#ff9dab;font-size:12px;margin-top:9px}.loading{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:760px){.top{display:block}.nav{margin-top:10px}.grid{grid-template-columns:1fr 1fr}.detailgrid{grid-template-columns:1fr}.title{font-size:21px}}
</style></head>
<body><div id="app"><div class="loading">正在加载对照工作台…</div></div>
<script>
const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-console-v1';
const KEY='soren_compare_token_v1';
let TOKEN=localStorage.getItem(KEY)||'',STATE={date:'2026-09-14',rows:[],run:null,lazq:null};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function n3(v){const m=String(v??'').match(/(\d{1,3})$/);return m?m[1].padStart(3,'0'):''}
function norm(v){return String(v??'').toLowerCase().replace(/足球俱乐部|足球队|女足|俱乐部|联队|fc|sc|vps|队/g,'').replace(/[\s·.()（）-]/g,'')}
function lazqView(m){if(!m)return null;const s=m.latest_prematch||m;const p=Array.isArray(s.gaiLv)?s.gaiLv.map(Number):null;if(!p||p.length<3||p.some(x=>!Number.isFinite(x)))return {...m,...s,top1:null,pH:null,pD:null,pA:null};const [a,d,h]=p,mx=Math.max(h,d,a);return {...m,...s,top1:mx===h?'主胜':mx===d?'平':'客胜',pH:h,pD:d,pA:a}}
function code(v){return v==='主胜'?'胜':v==='平'?'平':v==='客胜'?'负':''}
function pairStatus(h,l){if(!h||!l)return h?'HAO_ONLY':'LAZQ_ONLY';let hh=norm(h.home_team),ha=norm(h.away_team),lh=norm(l.home_team),la=norm(l.away_team);if(hh&&ha&&hh===la&&ha===lh)return 'REVERSED';return 'PAIRED'}
function verdict(h,l,pair){if(pair==='REVERSED')return ['球队顺序冲突','bad'];if(!h||!l)return ['单边数据','warn'];if(!l.top1)return ['拉澳未输出','warn'];if(h.top1===l.top1)return ['同向','good'];if(String(l.yuChe||'').includes(code(h.top1)))return ['拉澳双选覆盖','warn'];return ['强分歧','bad']}
function pct(v){return Number.isFinite(Number(v))?(Number(v)*100).toFixed(1)+'%':'—'}
async function authFetch(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+TOKEN,'Cache-Control':'no-store'};let r=await fetch(url,opt);if(r.status===401){localStorage.removeItem(KEY);TOKEN='';throw new Error('AUTH')};return r}
function loginUI(msg=''){$('#app').innerHTML=`<div class="login"><h2>模型对照工作台</h2><div class="sub">使用现有索伦后台账号登录</div><input id="u" value="hao" placeholder="账号"><input id="p" type="password" placeholder="密码"><button id="go">登录</button><div class="err">${esc(msg)}</div></div>`;$('#go').onclick=login;$('#p').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){try{let r=await fetch(API+'?login=1',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});let j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'登录失败');TOKEN=j.token;localStorage.setItem(KEY,TOKEN);renderShell();await load()}catch(e){loginUI(e.message)}}
function renderShell(){$('#app').innerHTML=`<div class="wrap"><div class="top"><div><div class="title">索伦引擎 × 拉澳模型对照</div><div class="sub">两套判断独立保存，只做同向 / 分歧 / 覆盖审计，不让外部模型反向污染索伦原始输出。</div></div><div class="nav"><a href="live.html">索伦工作台</a><a href="index.html">首页</a><button class="btn" id="out">退出</button></div></div><div class="bar"><input id="date" type="date" value="${STATE.date}"><button class="btn" id="load">加载</button><span class="pill" id="rev">等待数据</span><span class="pill" id="cap">拉澳：等待</span></div><div id="body"><div class="loading">正在加载…</div></div></div>`;$('#load').onclick=()=>{STATE.date=$('#date').value;load()};$('#out').onclick=()=>{localStorage.removeItem(KEY);TOKEN='';loginUI()}}
async function load(){try{$('#body').innerHTML='<div class="loading">正在对齐竞彩编号与两套预测…</div>';const date=$('#date').value;let hr=await authFetch(API+'?api=1&history=1&t='+Date.now()),hj=await hr.json();if(!hj.ok)throw new Error(hj.error||'豪竞历史读取失败');let candidates=(hj.history||[]).filter(x=>String(x.pool_date)===date&&String(x.model_name||'').includes('豪竞'));let run=candidates.find(x=>String(x.model_version)==='3.3')||candidates[0]||null;let hrows=[];if(run){let rr=await authFetch(API+'?api=1&run_id='+run.id+'&t='+Date.now()),rj=await rr.json();if(rj.ok)hrows=rj.detail?.rows||[]}
let lazq=null;try{let lr=await fetch('data/lazq/'+date+'.json?t='+Date.now(),{cache:'no-store'});if(lr.ok)lazq=await lr.json()}catch(e){}
STATE.run=run;STATE.lazq=lazq;const hm=new Map(hrows.map(x=>[n3(x.match_no),x])),lm=new Map((lazq?.matches||[]).map(x=>[n3(x.match_no),lazqView(x)]));const keys=[...new Set([...hm.keys(),...lm.keys()])].filter(Boolean).sort();STATE.rows=keys.map(k=>{let h=hm.get(k)||null,l=lm.get(k)||null,p=pairStatus(h,l),v=verdict(h,l,p);return {k,h,l,p,v}});renderData()}catch(e){if(e.message==='AUTH')return loginUI('登录已过期，请重新登录');$('#body').innerHTML='<div class="notice">加载失败：'+esc(e.message)+'</div>'}}
function renderData(){const run=STATE.run,lz=STATE.lazq,rows=STATE.rows;$('#rev').textContent=run?`索伦 ${run.model_version} · Rev ${run.model_revision_id}`:'索伦：该日无运行';$('#rev').className='pill '+(run?.model_version==='3.3'?'good':'warn');$('#cap').textContent=lz?(lz.is_prematch===false?'拉澳：历史当前态':'拉澳：赛前冻结'):'拉澳：无归档';$('#cap').className='pill '+(lz?.is_prematch===false?'warn':lz?'good':'bad');let comparable=rows.filter(x=>x.h&&x.l&&x.l.top1&&x.p!=='REVERSED'),agree=comparable.filter(x=>x.v[0]==='同向').length,cover=comparable.filter(x=>x.v[0]==='拉澳双选覆盖').length,conflict=comparable.filter(x=>x.v[0]==='强分歧').length;let html=`<div class="grid"><div class="metric"><div class="ml">索伦场次</div><div class="mv">${rows.filter(x=>x.h).length}</div></div><div class="metric"><div class="ml">可直接比较</div><div class="mv">${comparable.length}</div></div><div class="metric"><div class="ml">Top1同向</div><div class="mv" style="color:var(--good)">${agree}</div></div><div class="metric"><div class="ml">强分歧</div><div class="mv" style="color:var(--bad)">${conflict}</div></div></div>`;
if(lz?.is_prematch===false)html+=`<div class="notice">当前 ${STATE.date} 的拉澳文件是历史接口回填预览，不是赛前冻结；从自动采集开始后的 T-60 / T-30 / T-10 才计正式对照成绩。</div>`;
html+=`<div class="panel"><div class="head"><b>同场模型对照</b><span>点击任意一场看详细风险与概率</span></div><div class="tablewrap"><table><thead><tr><th>编号</th><th>比赛</th><th>索伦引擎</th><th>拉澳</th><th>联合审计</th><th>官方让球</th></tr></thead><tbody>`;
for(const x of rows){let h=x.h,l=x.l;html+=`<tr data-k="${x.k}"><td><b>${x.k}</b></td><td><div class="teams">${esc(h?.home_team||l?.home_team||'—')} vs ${esc(h?.away_team||l?.away_team||'—')}</div><div class="small">${esc(h?.league||l?.league||'')}</div></td><td>${h?`<div class="pick">${esc(h.top1||'—')}</div><div class="prob">第二：${esc(h.second_pick||'—')} · ${esc(h.confidence_label||'—')}</div>`:'<span class="small">无索伦数据</span>'}</td><td>${l?`<div class="pick">${esc(l.top1||l.yuChe||'未输出')}</div><div class="prob">锦囊：${esc(l.yuChe||'—')} ${l.top1?`· H ${pct(l.pH)} / D ${pct(l.pD)} / A ${pct(l.pA)}`:''}</div>`:'<span class="small">无拉澳数据</span>'}</td><td><span class="pill ${x.v[1]}">${x.v[0]}</span>${x.p==='REVERSED'?'<div class="small">禁止自动合并</div>':''}</td><td>${h?`${h.official_handicap??'—'} · ${esc(h.handicap_pick||'—')}`:'—'}</td></tr>`}
html+=`</tbody></table></div><div id="detail" class="detail"></div></div>`;$('#body').innerHTML=html;document.querySelectorAll('tr[data-k]').forEach(tr=>tr.onclick=()=>showDetail(tr.dataset.k))}
function showDetail(k){const x=STATE.rows.find(r=>r.k===k),h=x?.h,l=x?.l,d=$('#detail');if(!x)return;d.className='detail show';d.innerHTML=`<div class="detailgrid"><div class="card"><h3>索伦引擎 ${esc(STATE.run?.model_version||'')}</h3><div class="kv"><div>FT Top1</div><div>${esc(h?.top1||'—')}</div><div>第二方向</div><div>${esc(h?.second_pick||'—')}</div><div>三项概率</div><div>H ${pct(h?.p_home_final)} / D ${pct(h?.p_draw_final)} / A ${pct(h?.p_away_final)}</div><div>HUR / DTR / DLR</div><div>${esc(h?.hur??'—')} / ${esc(h?.dtr??'—')} / ${esc(h?.dlr??'—')}</div><div>DQ</div><div>${esc(h?.dq||'—')}</div><div>官方让球</div><div>${esc(h?.official_handicap??'—')} · ${esc(h?.handicap_pick||'—')}</div><div>冻结时间</div><div>${esc(h?.frozen_at||'—')}</div></div></div><div class="card"><h3>拉澳结构化信号</h3><div class="kv"><div>FT Top1</div><div>${esc(l?.top1||'—')}</div><div>胜平负概率</div><div>H ${pct(l?.pH)} / D ${pct(l?.pD)} / A ${pct(l?.pA)}</div><div>胜平负锦囊</div><div>${esc(l?.yuChe||'—')}</div><div>指数</div><div>${esc(l?.zhiShu||'—')}</div><div>接口盘口字段</div><div>${esc(l?.drawOdds||'—')}</div><div>冻结槽</div><div>${esc(l?.freeze_slot||l?.latest_prematch?.freeze_slot||'历史回填')}</div></div></div></div><div class="notice ${x.v[1]}">联合审计：${x.v[0]}。该结论只比较两套独立输出，不修改索伦原始预测。</div>`;d.scrollIntoView({behavior:'smooth',block:'nearest'})}
if(TOKEN){renderShell();load()}else loginUI();
</script></body></html>
