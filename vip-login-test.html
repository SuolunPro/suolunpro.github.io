<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>索伦VIP登录验收 · 测试</title><style>body{font:16px system-ui;background:#f3f5f9;color:#182235;max-width:450px;margin:6vh auto;padding:18px}main{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:10px;font-size:16px}input{border:1px solid #cbd5e1}button{border:0;background:#1d4ed8;color:white;font-weight:700}button:disabled{opacity:.6}small{color:#64748b}#result{white-space:pre-wrap;overflow-wrap:anywhere}#logout{background:#64748b}</style></head><body><main><h2>索伦VIP · 登录验收</h2><p><small>Cloudflare D1测试环境；不会修改正式网站登录或足球分析模块。</small></p><div id="form"><label>会员邮箱<input id="email" type="email" autocomplete="username"></label><label>密码<input id="password" type="password" autocomplete="current-password"></label><button id="login">验证登录</button></div><p id="result" role="status"></p><button id="logout" hidden>退出测试</button></main><script>'use strict';const API='https://suolun-vip-staging.hjh19970220.workers.dev';const $=id=>document.getElementById(id);let token=null;async function call(path,body){const res=await fetch(API+path,{method:body?'POST':'GET',headers:{...(body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error||'HTTP '+res.status);return data}function logout(){token=null;$('password').value='';$('form').hidden=false;$('logout').hidden=true;$('result').textContent='已退出测试'}$('logout').onclick=logout;$('login').onclick=async()=>{$('login').disabled=true;$('result').textContent='正在验证…';try{const auth=await call('/auth/login',{email:$('email').value.trim(),password:$('password').value});token=auth.token;const me=await call('/auth/me');$('result').textContent='登录成功 ✓\n邮箱：'+me.email+'\n身份：'+(me.role==='admin'?'管理员':'普通VIP')+'\n会员类型：'+me.vip_name+'\n到期时间（北京时间）：'+new Date(me.expires_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'\n\n仅验证身份与有效期；七大模块权限仍需单独验收。';$('password').value='';$('form').hidden=true;$('logout').hidden=false}catch(e){token=null;$('result').textContent='验证失败：'+e.message}finally{$('login').disabled=false}};window.addEventListener('pagehide',()=>{token=null;$('password').value=''})</script></body></html>
