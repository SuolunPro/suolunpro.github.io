name: Site module safety
on:
  push:
    paths:
      - 'index.html'
      - 'engine-validation.html'
      - 'cloudflare/vip/src/index.js'
      - '.github/workflows/site-module-safety.yml'
  pull_request:
  workflow_dispatch:
jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production engine4 shell and VIP gate
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const test=fs.readFileSync('engine-validation.html','utf8');
          const script=html.split('<script>')[1]?.split('</script>')[0];
          assert(script,'inline engine4 script missing');
          new vm.Script(script);
          for(const name of ['胜平负','让球','半全场','比分','总进球','冷门预警']){
            assert(html.includes("['"+name+"'"),'missing engine4 module '+name);
          }
          assert(!html.includes("['今日优选'"),'daily picks must stay hidden');
          for(const marker of ['vip-gate','vip-code','member-code-members.json','./data/engine4/','赛事分析说明','重要声明']){
            assert(html.includes(marker),'missing '+marker);
          }
          assert(!html.includes('workers.dev'),'homepage still calls a Worker');
          assert(test.includes("['胜平负'"),'validation page missing');
          console.log('PASS: 4.0 shell, hidden daily picks, member code gate, notices');
          JS
      - name: Check published snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/engine4/latest.json').read_text())
          assert isinstance(data.get('matches'),list) and data['matches']
          days=json.loads(Path('data/engine4/sales/index.json').read_text())['days']
          assert days and all((Path('data/engine4/sales')/(day+'.json')).exists() for day in days)
          PY
