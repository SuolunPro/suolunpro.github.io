name: Site module safety
on:
  push:
    paths:
      - 'index.html'
      - 'engine-validation.html'
      - 'cloudflare/vip/src/index.js'
      - '.github/workflows/site-module-safety.yml'
  pull_request:
  workflow_dispatch:
jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production engine4 shell and VIP gate
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const test=fs.readFileSync('engine-validation.html','utf8');
          const script=html.match(/<script>([\\s\\S]*?)<\\/script>/)?.[1];
          assert(script,'inline engine4 script missing');
          new vm.Script(script);
          for(const name of ['胜平负','让球','半全场','比分','总进球','冷门预警']){
            assert(html.includes("['"+name+"'"),'missing engine4 module '+name);
          }
          assert(!html.includes("['今日优选'"),'daily picks must stay hidden');
          for(const marker of ['vip-gate','/auth/login','/auth/me','/predictions?day=','模型调试与验证阶段','重要声明']){
            assert(html.includes(marker),'missing '+marker);
          }
          assert(!html.includes('./data/engine4/'),'public JSON bypass in homepage');
          assert(test.includes("['胜平负'"),'validation page missing');
          console.log('PASS: 4.0 shell, hidden daily picks, D1 gate, notices');
          JS
      - name: Verify unauthenticated API cannot return forecasts
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 'https://suolun-vip-staging.hjh19970220.workers.dev/predictions?day=latest')
          test "$status" = 401
