name: Public source connectivity probe
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile scripts/source_probe.py
      - name: Probe public source connectivity
        run: python scripts/source_probe.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-source-probe
          path: reports/source_probe.json
          retention-days: 7
          if-no-files-found: warn
