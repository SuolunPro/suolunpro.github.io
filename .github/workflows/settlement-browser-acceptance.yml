name: Settlement Browser Acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/settlement-acceptance.spec.cjs'
      - '.github/workflows/settlement-browser-acceptance.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/settlement-acceptance.spec.cjs --reporter=line
        env:
          CI: 'true'
