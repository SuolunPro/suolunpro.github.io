name: Read-only score and halftime SP probe
on:
  push:
    branches: [ops/probe-score-halftime-sp]
    paths: ['.github/workflows/probe-score-halftime-sp.yml']
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify official and mirror offer samples
        run: |
          python - <<'PY'
          import concurrent.futures,json,re,urllib.request
          base='https://webapi.sporttery.cn/gateway/'
          routes={
              'official_existing':base+'jc/football/getMatchCalculatorV1.qry?channel=c&poolCode=had,hhad,crs,ttg,hafu',
              'official_crs':base+'uniform/football/getMatchCalculatorV1.qry?channel=c&poolCode=crs',
              'official_hafu':base+'uniform/football/getMatchCalculatorV1.qry?channel=c&poolCode=hafu',
              'mirror':'https://qiulaile.vip/api/matches?matchType=0&mode=full',
          }
          keys='hh hd ha dh dd da ah ad aa'.split()
          def quote(v):
              try: return 1<float(v)<10000
              except (TypeError,ValueError): return False
          def request(name,url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Referer':'https://m.sporttery.cn/' if name!='mirror' else 'https://qiulaile.vip/'})
                  with urllib.request.urlopen(req,timeout=18) as f: d=json.load(f)
                  if name=='mirror':
                      rows=d.get('matches',[]) if isinstance(d,dict) else d
                      fields=sorted({k for m in rows if isinstance(m,dict) for k in m})
                      return dict(source=name,rows=len(rows),fields=fields)
                  rows=[m for group in d.get('value',{}).get('matchInfoList',[]) for m in group.get('subMatchList',[])]
                  out=dict(source=name,rows=len(rows),score=0,half_full=0,complete_score=0,complete_half_full=0)
                  for m in rows:
                      c=m.get('crs') or {}; h=m.get('hafu') or {}
                      scores={f'{k[1:3]}:{k[4:6]}':v for k,v in c.items() if re.fullmatch(r's\d{2}s\d{2}',k) and quote(v)}
                      half={k:h[k] for k in keys if quote(h.get(k))}
                      ident={k:m.get(k) for k in ('matchNumStr','businessDate','matchDate','matchTime','homeTeamAllName','awayTeamAllName')}
                      out['score']+=bool(scores); out['half_full']+=bool(half)
                      if len(scores)==28:
                          out['complete_score']+=1
                          out.setdefault('example_score',dict(match=ident,top4=sorted(scores.items(),key=lambda x:float(x[1]))[:4]))
                      if len(half)==9:
                          out['complete_half_full']+=1
                          out.setdefault('example_half_full',dict(match=ident,quotes=half))
                      if len(scores)==28 and len(half)==9:
                          out.setdefault('example_both',dict(match=ident,score_top4=sorted(scores.items(),key=lambda x:float(x[1]))[:4],half_quotes=half))
                  return out
              except Exception as e: return dict(source=name,error=str(e))
          with concurrent.futures.ThreadPoolExecutor() as pool:
              for out in pool.map(lambda kv:request(*kv),routes.items()):
                  print(json.dumps(out,ensure_ascii=False))
          PY
