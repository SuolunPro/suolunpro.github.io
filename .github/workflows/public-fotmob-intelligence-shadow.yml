name: Public FotMob intelligence shadow collector
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-fotmob-intelligence-shadow
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector
        run: python -m py_compile scripts/fotmob_form_collector.py
      - name: Collect public snapshot prematch form
        run: python scripts/fotmob_form_collector.py data/engine4/latest.json
      - name: Commit only public intelligence snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/engine4/intelligence/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: public FotMob intelligence shadow'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
