name: Sync 90scale 4.0 results to website
# Recovery trigger: 2026-11-08 22:49 CST; guardian checks must pass before publication.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-engine4-results.yml'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: sync-engine4-website
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch engine snapshots
        env:
          ENGINE4_READ_TOKEN: ${{ secrets.ENGINE4_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ENGINE4_READ_TOKEN" || { echo 'Missing ENGINE4_READ_TOKEN secret'; exit 1; }
          for attempt in 1 2 3; do
            if git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENGINE4_READ_TOKEN" | base64 -w0)" clone --depth 1 https://github.com/SuolunPro/90scale-engine.git /tmp/engine-source; then
              break
            fi
            rm -rf /tmp/engine-source
            if [ "$attempt" -eq 3 ]; then echo "::error::Engine source clone failed after 3 attempts"; exit 1; fi
            sleep $((attempt * 10))
          done
          test -s /tmp/engine-source/data/engine4/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('/tmp/engine-source/data/engine4')
          latest=json.loads((src/'latest.json').read_text(encoding='utf-8'))
          assert isinstance(latest.get('matches'),list) and latest.get('generated_at')
          sales=list((src/'sales').glob('*.json'))
          assert sales, 'No sale-day files found; refusing empty sync'
          print('Engine snapshot:',latest['generated_at'],'sales:',len(sales))
          # Guardian stage 1: read-only integrity check; never alter frozen predictions.
          from datetime import datetime,timezone,timedelta
          from collections import Counter
          problems=[]
          for f in sales:
              try:
                  data=json.loads(f.read_text(encoding='utf-8'))
                  if not isinstance(data.get('matches'),list):
                      problems.append(f'{f.name}: matches missing')
                  if data.get('sale_day') and data['sale_day']!=f.stem:
                      problems.append(f'{f.name}: sale_day mismatch')
              except (ValueError,OSError,TypeError) as exc:
                  problems.append(f'{f.name}: invalid JSON ({exc})')
          if problems:
              for p in problems[:20]: print('::error::Guardian: '+p)
              raise SystemExit('Guardian blocked unsafe snapshot publication')
          unsettled=Counter()
          for f in sales:
              data=json.loads(f.read_text(encoding='utf-8'))
              for m in data['matches']:
                  if not m.get('settlement'):
                      unsettled[f.stem]+=1
          print('Guardian: JSON integrity PASS; unresolved per day:',dict(unsettled))
          with open('/tmp/guardian-report.txt','w') as out:
              out.write('Guardian read-only integrity: PASS\\n')
              out.write(f'Sales files checked: {len(sales)}\\n')
              out.write(f'Unsettled matches by sale day: {dict(unsettled)}\\n')
          PY
          # Self-check: Beijing sale-day routing, source freshness, and frozen predictions.
          python - <<'PY'
          import json
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          source=Path('/tmp/engine-source/data/engine4')
          website=Path('data/engine4')
          bj=datetime.now(timezone(timedelta(hours=8)))
          latest=json.loads((source/'latest.json').read_text())
          sale_day=latest.get('sale_day')
          generated=datetime.fromisoformat(latest['generated_at'].replace('Z','+00:00'))
          if generated.tzinfo is None:
              raise SystemExit('Guardian: engine generated_at missing timezone')
          if generated>datetime.now(timezone.utc)+timedelta(minutes=5):
              raise SystemExit('Guardian: engine generated_at is in the future')
          if sale_day!=bj.date().isoformat():
              print('::warning::Guardian: latest sale day differs from Beijing today; date selector must use dated history')
          dated=source/'sales'/f'{sale_day}.json'
          if not dated.exists():
              raise SystemExit('Guardian: missing latest sale-day history')
          old_path=website/'latest.json'
          if old_path.exists():
              old=json.loads(old_path.read_text())
              old_time=datetime.fromisoformat(old['generated_at'].replace('Z','+00:00'))
              if old_time.tzinfo is None or generated<old_time:
                  raise SystemExit('Guardian: engine snapshot older than published website; refusing rollback')
          for old_path in (website/'sales').glob('*.json'):
              new_path=source/'sales'/old_path.name
              if not new_path.exists():
                  continue
              old=json.loads(old_path.read_text())
              new=json.loads(new_path.read_text())
              prior={str(m.get('source_id') or (m.get('match_no'),m.get('kickoff'))):m for m in old.get('matches',[])}
              for match in new.get('matches',[]):
                  key=str(match.get('source_id') or (match.get('match_no'),match.get('kickoff')))
                  previous=prior.get(key)
                  if not previous:
                      continue
                  try:
                      kickoff=datetime.fromisoformat(match['kickoff'].replace(' ','T')).replace(tzinfo=bj.tzinfo)
                  except (KeyError,ValueError,TypeError):
                      continue
                  if kickoff>bj:
                      continue
                  for field in ('prediction','predicted_at'):
                      if previous.get(field)!=match.get(field):
                          raise SystemExit(f'Guardian: frozen {field} changed in {old_path.name} fixture {key}')
          print('Guardian: Beijing date, monotonic publication and frozen prediction checks PASS')
          PY
          mkdir -p data/engine4/sales
          cp /tmp/engine-source/data/engine4/latest.json data/engine4/latest.json
          cp /tmp/engine-source/data/engine4/sales/*.json data/engine4/sales/
      # Results must be published before optional network image downloads.
      # Slow or blocked FotMob image requests must never delay settlements.
      - name: Commit and publish changed snapshots
        run: |
          set -euo pipefail
          git config user.name '90scale-sync[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add data/engine4/latest.json data/engine4/sales/
          if git diff --cached --quiet; then
            echo 'Already synchronized'
            exit 0
          fi
          git commit -m 'data: sync engine4 results and historical settlements'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "::error::Website publish failed after 3 attempts"; exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Guardian audit summary
        if: always()
        run: |
          if [ -f /tmp/guardian-report.txt ]; then
            cat /tmp/guardian-report.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Guardian: source unavailable or integrity check failed; publication blocked.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify published version
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          local=json.loads(Path('data/engine4/latest.json').read_text(encoding='utf-8'))
          remote=json.loads(subprocess.check_output(['git','show','origin/main:data/engine4/latest.json']))
          assert local['generated_at']==remote['generated_at'], 'Published website snapshot differs'
          print('Website snapshot verified:',remote['generated_at'])
          PY
