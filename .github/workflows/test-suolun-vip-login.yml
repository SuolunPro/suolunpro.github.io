name: Verify VIP bcrypt login end-to-end (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    environment: vip-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 48f8d496344b2e5f3e7f0c372d52e782
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare temporary synthetic member
        shell: bash
        run: |
          set -euo pipefail
          npm install -g wrangler@4
          npm install --prefix "$RUNNER_TEMP/bcrypt" --no-save bcryptjs@2.4.3
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const bcrypt=require(process.env.RUNNER_TEMP+'/bcrypt/node_modules/bcryptjs');
          const id=crypto.randomUUID();
          const password=crypto.randomBytes(32).toString('hex');
          const hash=bcrypt.hashSync(password,10);
          const email='vip-smoke-'+id+'@example.invalid';
          const expiry=new Date(Date.now()+3600*1000).toISOString();
          const sql="INSERT INTO vip_members(user_id,email,vip_name,expires_at,active,password_hash) VALUES ("+[id,email,'尊贵月卡VIP',expiry,'1',hash].map(s=>"'"+s.replace(/'/g,"''")+"'").join(',')+");";
          if ((sql.match(/,/g)||[]).length!==5) throw Error('Synthetic INSERT must contain six values');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/vip-smoke.sql',sql,{mode:0o600});
          fs.writeFileSync(process.env.RUNNER_TEMP+'/vip-smoke.json',JSON.stringify({id,email,password}),{mode:0o600});
          NODE
      - name: Insert synthetic member into isolated staging D1
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute suolun-vip-staging --remote --file="$RUNNER_TEMP/vip-smoke.sql" --yes >/dev/null
      - name: Test bcrypt login and authenticated identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          (async()=>{
            const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/vip-smoke.json','utf8'));
            const base='https://suolun-vip-staging.hjh19970220.workers.dev';
            const res=await fetch(base+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:data.email,password:data.password})});
            if(res.status!==200)throw Error('bcrypt login failed, status '+res.status);
            const login=await res.json();
            if(!login.token)throw Error('login token missing');
            const me=await fetch(base+'/auth/me',{headers:{Authorization:'Bearer '+login.token}});
            if(me.status!==200)throw Error('authenticated identity failed, status '+me.status);
            const identity=await me.json();
            if(identity.email!==data.email||identity.vip_name!=='尊贵月卡VIP')throw Error('identity mismatch');
            console.log('Synthetic bcrypt login and authenticated identity checks passed.');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Remove synthetic member
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/vip-smoke.json" ]; then
            node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/vip-smoke.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/vip-cleanup.sql',"DELETE FROM vip_members WHERE user_id='"+d.id+"';",{mode:0o600});
          NODE
            wrangler d1 execute suolun-vip-staging --remote --file="$RUNNER_TEMP/vip-cleanup.sql" --yes >/dev/null
          fi
          rm -f "$RUNNER_TEMP/vip-smoke.sql" "$RUNNER_TEMP/vip-smoke.json" "$RUNNER_TEMP/vip-cleanup.sql"
