name: 90scale 4.0 website validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine4/**'
      - '.github/workflows/engine4-validation.yml'
  schedule:
    - cron: '20 4,6,8,10,12,14 * * *'
    - cron: '0,15,30,45 * * * *'
permissions:
  contents: write
concurrency:
  group: engine4-validation
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check code and tests
        run: |
          python -m py_compile engine4/legacy_score.py engine4/okooo_betfair.py engine4/market_bridge.py engine4/engine.py engine4/fotmob.py engine4/settle.py engine4/fotmob_results.py engine4/aggregate.py
          python -m unittest discover -s engine4/tests -v
      - name: Refresh Okooo prematch evidence
        run: python -m engine4.okooo_betfair
      - name: Refresh fixtures and prematch predictions
        run: |
          cp data/engine4/latest.json /tmp/engine4-before.json 2>/dev/null || true
          if ! python -m engine4.engine; then
            cp /tmp/engine4-before.json data/engine4/latest.json
          fi
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          path=Path('data/engine4/latest.json')
          doc=json.loads(path.read_text())
          if not any((m.get('prediction') or {}).get('status')=='PREDICTED' for m in doc.get('matches',[])):
              before=Path('/tmp/engine4-before.json')
              if before.exists(): shutil.copyfile(before,path)
              else: raise SystemExit('No predictions and no previous snapshot')
          PY
      - name: Audit newly generated score Top4\n        run: |\n          python - <<'PY'\n          import json\n          from pathlib import Path\n          d=json.loads(Path('data/engine4/latest.json').read_text())\n          fresh=[m for m in d.get('matches',[]) if (m.get('prediction') or {}).get('status')=='PREDICTED' and (m.get('prediction') or {}).get('modules',{}).get('比分',{}).get('top3') and (m.get('prediction') or {}).get('modules',{}).get('比分',{}).get('legacy_method')]\n          assert all(len(m['prediction']['modules']['比分'].get('top4',[]))==4 for m in fresh), 'New score prediction missing Top4'\n          print('New Top4 score predictions:',len(fresh),'of',len(d.get('matches',[])),'fixtures; historical frozen Top3 retained')\n          PY\n      - name: Restore fixtures, verify results and calculate metrics
        run: python -m engine4.aggregate
      - name: Verify published market coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/engine4/latest.json').read_text())
          m=d.get('matches',[])
          print(json.dumps({'sale_day':d.get('sale_day'),'status':d.get('status'),
            'matches':len(m),'predicted':sum((x.get('prediction') or {}).get('status')=='PREDICTED' for x in m),
            'betfair':sum(bool((x.get('bifa') or {}).get('prematch_verified')) for x in m),
            'daily_selected':sum((x.get('prediction') or {}).get('modules',{}).get('今日优选',{}).get('status')=='SELECTED' for x in m),
            'warnings':sum(bool((x.get('prediction') or {}).get('modules',{}).get('冷门预警',{}).get('triggered')) for x in m)},ensure_ascii=False))
          PY
      - name: Publish JSON to website
        run: |
          mkdir -p data/engine4/history
          cp data/engine4/latest.json data/engine4/history/$(date -u +%Y%m%dT%H%M%SZ).json
          git config user.name '90scale-engine[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add data/engine4
          git diff --cached --quiet || (git commit -m 'data: refresh verified engine4 validation' && git pull --rebase && git push)
      - name: Verify remote snapshot
        run: |
          git fetch origin main
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          local=json.loads(Path('data/engine4/latest.json').read_text())
          remote=json.loads(subprocess.check_output(['git','show','origin/main:data/engine4/latest.json']))
          assert remote['generated_at']==local['generated_at'], 'remote snapshot differs from run output'
          print('Verified remote latest.json:',remote['sale_day'],remote['generated_at'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine4-validation-run
          path: data/engine4/latest.json
          retention-days: 14

