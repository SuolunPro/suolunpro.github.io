name: 90scale 4.0 website validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine4/**'
      - '.github/workflows/engine4-validation.yml'
  schedule:
    - cron: '0,15,30,45 4-17 * * *'
    - cron: '0,10,20,30,40,50 0-6,14-23 * * *'
permissions:
  contents: write
concurrency:
  group: engine4-validation
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment: vip-staging
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 48f8d496344b2e5f3e7f0c372d52e782
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore private engine4 snapshots from D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" > "$RUNNER_TEMP/databases.json"
          DB_ID=$(jq -r '.result[]? | select(.name=="suolun-vip-staging") | .uuid' "$RUNNER_TEMP/databases.json" | head -n1)
          test -n "$DB_ID"
          echo "VIP_D1_ID=$DB_ID" >> "$GITHUB_ENV"
          jq -n --arg sql 'SELECT sale_day,payload FROM vip_predictions' '{sql:$sql}' > "$RUNNER_TEMP/query.json"
          curl -fsS -X POST "$API/$DB_ID/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/query.json" > "$RUNNER_TEMP/result.json"
          jq -e '.success==true and .result[0].success==true and (.result[0].results | length)>0' "$RUNNER_TEMP/result.json" >/dev/null
          python - "$RUNNER_TEMP/result.json" <<'PY'
          import json,sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text())['result'][0]['results']
          for row in rows:
              key=row['sale_day']
              path=(Path('data/engine4/latest.json') if key=='latest' else
                    Path('data/engine4/history')/(key[8:]+'.json') if key.startswith('history/') else
                    Path('data/engine4/sales')/(key+'.json'))
              path.parent.mkdir(parents=True,exist_ok=True)
              doc=json.loads(row['payload'])
              assert isinstance(doc.get('matches'),list)
              path.write_text(json.dumps(doc,ensure_ascii=False))
          print('Restored private engine4 snapshots:',len(rows))
          PY
          rm -f "$RUNNER_TEMP/databases.json" "$RUNNER_TEMP/query.json" "$RUNNER_TEMP/result.json"
      - name: Check code and tests
        run: |
          python -m py_compile engine4/legacy_score.py engine4/okooo_betfair.py engine4/market_bridge.py engine4/engine.py engine4/fotmob.py engine4/settle.py engine4/fotmob_results.py engine4/aggregate.py
          python -m unittest discover -s engine4/tests -v
      - name: Decide whether prediction or settlement is due
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          now=datetime.now(timezone.utc)
          bj=now.astimezone(timezone(timedelta(hours=8)))
          forced=os.environ.get('EVENT_NAME')!='schedule'
          fixtures=[]
          for path in [Path('data/engine4/latest.json'),*Path('data/engine4/sales').glob('*.json')]:
              try: fixtures.extend(json.loads(path.read_text()).get('matches',[]))
              except (OSError,ValueError): pass
          unique={}
          for m in fixtures:
              unique[str(m.get('source_id') or (m.get('match_no'),m.get('kickoff')))]=m
          active=False
          near=False
          pending=False
          for m in unique.values():
              try:
                  kickoff=datetime.fromisoformat(m['kickoff'].replace(' ','T')).replace(tzinfo=bj.tzinfo).astimezone(timezone.utc)
                  end_raw=m.get('sale_end') or m.get('sale_end_at') or m.get('stop_sale_at')
                  if end_raw:
                      end=datetime.fromisoformat(end_raw.replace('Z','+00:00').replace(' ','T'))
                      if end.tzinfo is None: end=end.replace(tzinfo=bj.tzinfo)
                      end=end.astimezone(timezone.utc)
                  else:
                      # Beijing-time daily sales cutoff: Friday 22:00, weekend 23:00.
                      # Never update a fixture after its own kickoff.
                      sale_day=datetime.fromisoformat(m.get('sale_day') or bj.date().isoformat()).replace(tzinfo=bj.tzinfo)
                      weekday=sale_day.weekday()
                      cutoff_hour=22 if weekday==4 else 23 if weekday in (5,6) else None
                      end=(sale_day.replace(hour=cutoff_hour,minute=0,second=0,microsecond=0).astimezone(timezone.utc)
                           if cutoff_hour is not None else kickoff)
                  end=min(end,kickoff)
                  if now < end and now < kickoff:
                      active=True
                      if end-now <= timedelta(hours=2): near=True
                  if not m.get('settlement') and kickoff+timedelta(minutes=120)<=now<=kickoff+timedelta(days=2):
                      pending=True
              except (KeyError,ValueError,TypeError): continue
          # The discovery window is for fixtures not yet in local snapshots.
          # Outside it, do not fetch new market data after all known matches close.
          cutoff=22 if bj.weekday()==4 else 23 if bj.weekday() in (5,6) else 24
          discovery=12<=bj.hour<cutoff and not unique
          predict=forced or ((active or discovery) and (bj.minute%15==0 if near else bj.minute%30==0))
          settle=forced or (pending and bj.minute%10==0)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"predict={'true' if predict else 'false'}\n")
              out.write(f"settle={'true' if settle else 'false'}\n")
          print({'bj':bj.isoformat(),'active':active,'near':near,'pending':pending,'predict':predict,'settle':settle})
          PY
      - name: Refresh Okooo prematch evidence
        if: steps.gate.outputs.predict == 'true'
        run: python -m engine4.okooo_betfair || echo 'Okooo unavailable; continue with verified available sources'
      - name: Refresh fixtures and prematch predictions
        if: steps.gate.outputs.predict == 'true'
        run: |
          cp data/engine4/latest.json /tmp/engine4-before.json 2>/dev/null || true
          if ! python -m engine4.engine; then
            cp /tmp/engine4-before.json data/engine4/latest.json
          fi
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          path=Path('data/engine4/latest.json')
          doc=json.loads(path.read_text())
          if not any((m.get('prediction') or {}).get('status')=='PREDICTED' for m in doc.get('matches',[])):
              before=Path('/tmp/engine4-before.json')
              if before.exists(): shutil.copyfile(before,path)
              else: raise SystemExit('No predictions and no previous snapshot')
          PY
      - name: Audit newly generated score Top4
        if: steps.gate.outputs.predict == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/engine4/latest.json').read_text())
          fresh=[m for m in d.get('matches',[]) if (m.get('prediction') or {}).get('modules',{}).get('比分',{}).get('legacy_method')]
          assert all(len(m['prediction']['modules']['比分'].get('top4',[]))==4 for m in fresh), 'New score prediction missing Top4'
          print('Verified score Top4 predictions:',len(fresh))
          PY
      - name: Restore fixtures, verify results and calculate metrics
        if: steps.gate.outputs.predict == 'true' || steps.gate.outputs.settle == 'true'
        run: python -m engine4.aggregate
      - name: Verify published market coverage
        if: steps.gate.outputs.predict == 'true' || steps.gate.outputs.settle == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/engine4/latest.json').read_text())
          m=d.get('matches',[])
          print(json.dumps({'sale_day':d.get('sale_day'),'status':d.get('status'),
            'matches':len(m),'predicted':sum((x.get('prediction') or {}).get('status')=='PREDICTED' for x in m),
            'betfair':sum(bool((x.get('bifa') or {}).get('prematch_verified')) for x in m),
            'daily_selected':sum((x.get('prediction') or {}).get('modules',{}).get('今日优选',{}).get('status')=='SELECTED' for x in m),
            'warnings':sum(bool((x.get('prediction') or {}).get('modules',{}).get('冷门预警',{}).get('triggered')) for x in m)},ensure_ascii=False))
          PY
      - name: Publish snapshots to authenticated D1 API
        if: steps.gate.outputs.predict == 'true' || steps.gate.outputs.settle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$VIP_D1_ID/query"
          for file in data/engine4/latest.json data/engine4/sales/*.json data/engine4/history/*.json; do
            test -f "$file" || continue
            if [ "$file" = data/engine4/latest.json ]; then key=latest; elif [[ "$file" == data/engine4/history/* ]]; then key="history/$(basename "$file" .json)"; else key=$(basename "$file" .json); fi
            jq -n --arg sql 'INSERT INTO vip_predictions(sale_day,payload,updated_at) VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(sale_day) DO UPDATE SET payload=excluded.payload,updated_at=CURRENT_TIMESTAMP' --arg key "$key" --rawfile payload "$file" '{sql:$sql,params:[$key,$payload]}' > "$RUNNER_TEMP/query.json"
            curl -fsS -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/query.json" > "$RUNNER_TEMP/result.json"
            jq -e '.success==true and .result[0].success==true' "$RUNNER_TEMP/result.json" >/dev/null
          done
          jq -n --arg sql 'SELECT sale_day,length(payload) AS bytes FROM vip_predictions WHERE sale_day="latest"' '{sql:$sql}' > "$RUNNER_TEMP/query.json"
          curl -fsS -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/query.json" > "$RUNNER_TEMP/result.json"
          jq -e '.result[0].results[0].bytes>100' "$RUNNER_TEMP/result.json" >/dev/null
          echo "Verified private D1 latest snapshot."
          rm -f "$RUNNER_TEMP/query.json" "$RUNNER_TEMP/result.json"
      - name: Publish same-origin GitHub Pages snapshots
        if: steps.gate.outputs.predict == 'true' || steps.gate.outputs.settle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sales=Path('data/engine4/sales')
          days=sorted(p.stem for p in sales.glob('????-??-??.json'))
          assert days and Path('data/engine4/latest.json').exists()
          (sales/'index.json').write_text(json.dumps({'days':days},ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/engine4/latest.json data/engine4/sales data/engine4/history
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish engine4 snapshots for same-origin access'
            # Model collectors may leave changed caches outside the published snapshots.
            git stash push --include-untracked --quiet
            git pull --rebase origin main
            git push origin HEAD:main
          fi
