name: 90scale 4.0 website validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine4/**'
      - '.github/workflows/engine4-validation.yml'
  schedule:
    - cron: '20 4,6,8,10,12,14 * * *'
    - cron: '0,30 * * * *'
permissions:
  contents: write
concurrency:
  group: engine4-validation
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check code and tests
        run: |
          python -m py_compile engine4/engine.py engine4/fotmob.py engine4/settle.py engine4/fotmob_results.py engine4/aggregate.py
          python -m unittest discover -s engine4/tests -v
      - name: Refresh fixtures and prematch predictions
        run: |
          cp data/engine4/latest.json /tmp/engine4-before.json 2>/dev/null || true
          if ! python -m engine4.engine; then
            cp /tmp/engine4-before.json data/engine4/latest.json
          fi
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          path=Path('data/engine4/latest.json')
          doc=json.loads(path.read_text())
          if not any((m.get('prediction') or {}).get('status')=='PREDICTED' for m in doc.get('matches',[])):
              before=Path('/tmp/engine4-before.json')
              if before.exists(): shutil.copyfile(before,path)
              else: raise SystemExit('No predictions and no previous snapshot')
          PY
      - name: Restore fixtures, verify results and calculate metrics
        run: python -m engine4.aggregate
      - name: Publish JSON to website
        run: |
          mkdir -p data/engine4/history
          cp data/engine4/latest.json data/engine4/history/$(date -u +%Y%m%dT%H%M%SZ).json
          git config user.name '90scale-engine[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add data/engine4
          git diff --cached --quiet || (git commit -m 'data: refresh verified engine4 validation' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine4-validation-run
          path: data/engine4/latest.json
          retention-days: 14
