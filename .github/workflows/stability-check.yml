name: stability-check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontend-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production member code and 4.0 invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          home=Path('index.html').read_text()
          test=Path('engine-validation.html').read_text()
          # Production may contain newer UI changes; validate both pages independently.
          assert home.strip() and test.strip(), 'Empty production or validation page'
          for marker in ('vip-code','member-code-members.json','./data/engine4/','模型调试与验证阶段','重要声明','ftHandicapRiskNote'):
              assert marker in home, marker
          for marker in ("['胜平负'","['让球'","['半全场'","['比分'","['总进球'","['冷门预警'"):
              assert marker in home, marker
          assert "['今日优选'" not in home
          assert 'workers.dev' not in home
          assert 'supabase.co' not in home.lower()
          for marker in ('<<<<<<<','=======','>>>>>>>'):
              assert marker not in home
          print('stability-check: OK')
          PY
