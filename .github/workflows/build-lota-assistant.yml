name: Build LOTA assistant Windows validation EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/lota-assistant/*.py'
      - 'tools/lota-assistant/requirements.txt'
      - '.github/workflows/build-lota-assistant.yml'
permissions:
  contents: read
concurrency:
  group: lota-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/lota-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate matching and publication gates
        run: python -m unittest -v test_core
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name 90scale-lota-assistant --hidden-import keyring.backends.Windows --collect-all rapidocr --collect-all onnxruntime app.py
      - uses: actions/upload-artifact@v4
        with:
          name: 90scale-lota-assistant-windows-validation
          path: tools/lota-assistant/dist/90scale-lota-assistant.exe
          retention-days: 30
