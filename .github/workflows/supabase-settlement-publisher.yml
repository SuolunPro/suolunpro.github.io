name: Supabase verified settlement publisher (public)
# Trigger immediate publisher replay for independently verified 2026-11-15 004.
on:
  push:
    paths:
      - 'scripts/publish-supabase-settlement.cjs'
      - '.github/workflows/supabase-settlement-publisher.yml'
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: public-supabase-settlement-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish independently verified settlement to public snapshots
        run: node scripts/publish-supabase-settlement.cjs
      - name: Commit changed settlement snapshots
        run: |
          git config user.name '90scale-settlement[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add data/engine4/sales data/engine4/latest.json
          if git diff --cached --quiet; then
            echo 'No new verified settlements'
            exit 0
          fi
          git commit -m 'data: publish Supabase verified settlement'
          git push origin HEAD:main
