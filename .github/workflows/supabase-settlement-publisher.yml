name: Supabase verified settlement publisher (public)
# Recovery replay 2026-11-17 22:06 CST: Supabase-verified 001 remains unpublished.
# Supabase verified results are replayed on every run; a concurrent prediction sync
# must never cause a verified settlement to be dropped.
on:
  push:
    paths:
      - 'scripts/publish-supabase-settlement.cjs'
      - '.github/workflows/supabase-settlement-publisher.yml'
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: engine4-site-data-writer
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay, validate and publish verified settlements
        run: |
          set -euo pipefail
          git config user.name '90scale-settlement[bot]'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/publish-supabase-settlement.cjs
            git add data/engine4/sales data/engine4/latest.json
            if git diff --cached --quiet; then
              echo 'No new verified settlements'
              exit 0
            fi
            git commit -m 'data: publish Supabase verified settlement'
            if git push origin HEAD:main; then
              echo 'Supabase settlements published'
              exit 0
            fi
            echo "::warning::Concurrent site update; replaying verified results ($attempt/5)"
            sleep 5
          done
          echo '::error::Verified settlement publication failed after five replays'
          exit 1

