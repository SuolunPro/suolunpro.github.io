name: Supabase verified settlement publisher (public)
on:
  push:
    paths:
      - 'scripts/publish-supabase-settlement.cjs'
      - '.github/workflows/supabase-settlement-publisher.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
concurrency:
  group: engine4-site-data-writer
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish independently verified settlement to public snapshots
        run: node scripts/publish-supabase-settlement.cjs
      - name: Commit changed settlement snapshots
        run: |
          set -euo pipefail
          git config user.name '90scale-settlement[bot]'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git add data/engine4/sales data/engine4/latest.json
            if git diff --cached --quiet; then
              echo 'No new verified settlements'
              exit 0
            fi
            git commit -m 'data: publish Supabase verified settlement'
            if git push origin HEAD:main; then
              echo 'Verified settlements published'
              exit 0
            fi
            echo "::warning::Publish attempt ${attempt}/5 failed; refresh public snapshot and recalculate"
            git fetch origin main
            git reset --hard origin/main
            node scripts/publish-supabase-settlement.cjs
            sleep 10
          done
          echo '::error::Supabase settlement publication failed after five attempts'
          exit 1
