name: Probe GPT Durable Object storage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-gpt-do.yml'
      - 'cloudflare/gpt-do-probe/**'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: vip-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 48f8d496344b2e5f3e7f0c372d52e782
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler@4
      - name: Deploy isolated storage probe
        working-directory: cloudflare/gpt-do-probe
        run: |
          cat > wrangler.toml <<'EOF'
          name = "suolun-prediction-storage-probe"
          main = "src/index.js"
          compatibility_date = "2026-10-01"
          workers_dev = true
          [[durable_objects.bindings]]
          name = "PREDICTION_STORE"
          class_name = "PredictionStore"
          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["PredictionStore"]
          EOF
          wrangler deploy
      - name: Verify isolated storage read-write
        run: |
          code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' https://suolun-prediction-storage-probe.hjh19970220.workers.dev/health)
          cat /tmp/probe.json
          test "$code" = 200
          jq -e '.worker == true and .storage == true' /tmp/probe.json
