name: Deploy GPT VIP prediction API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-gpt-vip-predictions.yml'
      - 'cloudflare/gpt-predictions/**'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vip-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 48f8d496344b2e5f3e7f0c372d52e782
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          npm install -g wrangler@4
      - name: Diagnose Cloudflare token and account access
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in "https://api.cloudflare.com/client/v4/user/tokens/verify" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; do
            status=$(curl -sS -o /tmp/cf-diagnostic.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint")
            echo "Endpoint: ${endpoint%%\\?*} HTTP $status"
            jq -c '{success,errors:[.errors[]? | {code,message}]}' /tmp/cf-diagnostic.json || true
          done
      - name: Configure and deploy Worker
        working-directory: cloudflare/gpt-predictions
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.toml <<EOF
          name = "suolun-gpt-predictions"
          main = "src/index.js"
          compatibility_date = "2026-10-01"
          workers_dev = true
          [[durable_objects.bindings]]
          name = "PREDICTION_STORE"
          class_name = "PredictionStore"
          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["PredictionStore"]
          EOF
          wrangler deploy
      - name: Verify deployed Worker endpoints
        shell: bash
        run: |
          set -euo pipefail
          URL="https://suolun-gpt-predictions.hjh19970220.workers.dev"
          health=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/health")
          unauth=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' "$URL/predictions?date=2026-11-04")
          echo "health=$health unauthenticated_prediction=$unauth"
          jq -c '{error,message}' /tmp/unauth.json || true
          test "$health" = 200
          test "$unauth" = 401
          jq -c '{ok,configured}' /tmp/health.json
          jq -e '.configured == true' /tmp/health.json
