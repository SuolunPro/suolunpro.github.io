name: Sync verified 90scale engine data to website
# Trigger website data sync after dual-sale-day engine publication.
# Preserve public Supabase settlements and recompute daily metrics when merging predictions.
# Result-only recovery: reconcile verified engine settlement after 2026-11-13 001.
# Re-run synchronization to reconcile the corrected latest.json and validate counts.
# Health-check requested safe reconciliation of duplicate sale-day snapshots; verification fails closed.
on:
  repository_dispatch:
    types: [engine4_data_updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-engine4.yml'
      - '.github/workflows/engine4-result-backfill.yml'
      - 'scripts/sync_engine4.py'
      - 'scripts/verify_engine4_sync.py'
      - 'scripts/build_growth.py'
      - 'scripts/build_traffic.py'
      - 'scripts/portal_seo.py'
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: engine4-site-data-writer
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Download private engine snapshots
        env:
          ENGINE_READ_TOKEN: ${{ secrets.ENGINE4_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ENGINE_READ_TOKEN}" ]; then
            echo "::error::ENGINE4_READ_TOKEN is missing. The engine repository is private; anonymous git clone cannot sync it."
            exit 1
          fi
          # Keep the token out of the command line, remote URL and workflow logs.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENGINE_READ_TOKEN" | base64 -w0)"
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/90scale-engine
            if git clone --depth 1 --filter=blob:none --sparse https://github.com/SuolunPro/90scale-engine.git /tmp/90scale-engine &&
               git -C /tmp/90scale-engine sparse-checkout set data/engine4; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then echo "::error::Failed to read engine after five attempts"; exit 1; fi
            sleep 12
          done
          test -s /tmp/90scale-engine/data/engine4/latest.json
      - name: Merge newer snapshots without losing verified settlements
        run: python scripts/sync_engine4.py /tmp/90scale-engine/data/engine4 data/engine4
      - name: Verify merged website snapshot before publishing
        run: |
          python scripts/verify_engine4_sync.py /tmp/90scale-engine/data/engine4 data/engine4
      - name: Publish website data
        id: publish
        run: |
          set -euo pipefail
          git config user.name '90scale-site-sync[bot]'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync_engine4.py /tmp/90scale-engine/data/engine4 data/engine4
            python scripts/verify_engine4_sync.py /tmp/90scale-engine/data/engine4 data/engine4
            git add data/engine4
            # Render separately so a portal failure cannot block verified data publication.
            if [ -f scripts/build_growth.py ]; then
              if portal_output="$(mktemp -d)" &&
                 python scripts/build_growth.py --output "$portal_output" &&
                 cp -R "$portal_output/football/." football/ &&
                 cp "$portal_output/sitemap.xml" "$portal_output/robots.txt" "$portal_output/llms.txt" . &&
                 git add football sitemap.xml robots.txt llms.txt; then
                echo 'Public football portal generated'
              else
                echo '::warning::Public football portal generation failed; publishing verified engine data only'
              fi
              if [ -n "${portal_output:-}" ]; then rm -rf "$portal_output"; fi
            fi
            if git diff --cached --quiet; then
              echo 'Already synchronized'
              exit 0
            fi
            portal_changed=false
            if ! git diff --cached --quiet -- football sitemap.xml robots.txt llms.txt; then
              portal_changed=true
            fi
            git commit -m 'data: sync verified 90scale results to website'
            if git push origin HEAD:main; then
              echo "portal_changed=$portal_changed" >> "$GITHUB_OUTPUT"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Request Pages rebuild for automated portal updates
        if: steps.publish.outputs.portal_changed == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
      - name: Inspect public SEO and notify IndexNow
        if: steps.publish.outputs.published == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 2
        env:
          PORTAL_PUBLISHED: ${{ steps.publish.outputs.published }}
          PREVIOUS_PUSH: ${{ github.event.before }}
        run: |
          if [ -n "$PREVIOUS_PUSH" ] && git cat-file -e "$PREVIOUS_PUSH^{commit}" 2>/dev/null; then
            python scripts/portal_seo.py --previous "$PREVIOUS_PUSH"
          elif [ "$PORTAL_PUBLISHED" = true ]; then
            python scripts/portal_seo.py --previous HEAD^
          else
            python scripts/portal_seo.py
          fi
