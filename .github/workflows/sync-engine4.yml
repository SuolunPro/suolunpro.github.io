name: Sync verified 90scale engine data to website
# Trigger website data sync after dual-sale-day engine publication.
# Re-run synchronization to reconcile the corrected latest.json and validate counts.
on:
  repository_dispatch:
    types: [engine4_data_updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-engine4.yml'
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: sync-90scale-engine
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download private engine snapshots
        env:
          ENGINE_READ_TOKEN: ${{ secrets.ENGINE4_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ENGINE_READ_TOKEN}" ]; then
            echo "::error::ENGINE4_READ_TOKEN is missing. The engine repository is private; anonymous git clone cannot sync it."
            exit 1
          fi
          # Keep the token out of the command line, remote URL and workflow logs.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENGINE_READ_TOKEN" | base64 -w0)"
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/90scale-engine
            if git clone --depth 1 --filter=blob:none --sparse https://github.com/SuolunPro/90scale-engine.git /tmp/90scale-engine &&
               git -C /tmp/90scale-engine sparse-checkout set data/engine4; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then echo "::error::Failed to read engine after five attempts"; exit 1; fi
            sleep 12
          done
          test -s /tmp/90scale-engine/data/engine4/latest.json
      - name: Merge newer snapshots without losing verified settlements
        run: python scripts/sync_engine4.py /tmp/90scale-engine/data/engine4 data/engine4
      - name: Verify merged website snapshot before publishing
        run: |
          python scripts/verify_engine4_sync.py /tmp/90scale-engine/data/engine4 data/engine4
      - name: Publish website data
        run: |
          set -euo pipefail
          git config user.name '90scale-site-sync[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add data/engine4
          if git diff --cached --quiet; then
            echo 'Already synchronized'
            exit 0
          fi
          git commit -m 'data: sync verified 90scale results to website'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Website snapshot published"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Retrying website publication ($attempt/5)"
            sleep 12
          done
          echo "::error::Website publication failed after five attempts"
          exit 1
