name: Deploy isolated VIP staging (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vip-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 48f8d496344b2e5f3e7f0c372d52e782
      VIP_SESSION_SECRET: ${{ secrets.VIP_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare token
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          npm install -g wrangler@4
      - name: Find or create dedicated D1 database
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" > /tmp/vip-d1.json
          DB_ID=$(jq -r '.result[]? | select(.name=="suolun-vip-staging") | .uuid' /tmp/vip-d1.json | head -n1)
          if [ -z "$DB_ID" ]; then
            curl -fsS -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"suolun-vip-staging"}' > /tmp/vip-d1-created.json
            DB_ID=$(jq -r '.result.uuid // empty' /tmp/vip-d1-created.json)
          fi
          test -n "$DB_ID" || { echo "Could not find/create D1 database"; exit 1; }
          echo "VIP_D1_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Configure staging Worker
        shell: bash
        run: |
          cat > cloudflare/vip/wrangler.toml <<EOF
          name = "suolun-vip-staging"
          main = "src/index.js"
          compatibility_date = "2026-10-01"
          workers_dev = true
          [[d1_databases]]
          binding = "DB"
          database_name = "suolun-vip-staging"
          database_id = "$VIP_D1_ID"
          EOF
      - name: Initialize D1 and deploy staging
        working-directory: cloudflare/vip
        run: |
          wrangler d1 execute suolun-vip-staging --remote --file=schema.sql --yes
          wrangler deploy
      - name: Configure session signing secret
        working-directory: cloudflare/vip
        shell: bash
        run: |
          if [ -n "$VIP_SESSION_SECRET" ]; then
            printf '%s' "$VIP_SESSION_SECRET" | wrangler secret put SESSION_SECRET
          else
            echo "::warning::VIP_SESSION_SECRET not configured. Login stays unavailable (503); health check works."
          fi
      - name: Deployment complete
        run: echo "Staging deployed; production website was not changed."
