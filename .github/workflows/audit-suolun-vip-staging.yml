name: Audit VIP staging membership (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: vip-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 48f8d496344b2e5f3e7f0c372d52e782
    steps:
      - name: Audit D1 member counts without disclosing identities
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare token'; exit 1; }
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" > "$RUNNER_TEMP/db-list.json"
          DB_ID=$(jq -r '.result[]? | select(.name=="suolun-vip-staging") | .uuid' "$RUNNER_TEMP/db-list.json" | head -n1)
          test -n "$DB_ID" || { echo 'Staging D1 database not found'; exit 1; }
          jq -n '{sql:"SELECT COUNT(*) AS total_rows, COALESCE(SUM(CASE WHEN active=1 AND datetime(expires_at)>datetime(\u0027now\u0027) THEN 1 ELSE 0 END),0) AS active_vip, COALESCE(SUM(CASE WHEN active=1 AND datetime(expires_at)>datetime(\u0027now\u0027) AND vip_name=\u0027尊贵月卡VIP\u0027 THEN 1 ELSE 0 END),0) AS active_monthly, COALESCE(SUM(CASE WHEN active=1 AND datetime(expires_at)>datetime(\u0027now\u0027) AND password_hash GLOB \u0027$2*\u0027 THEN 1 ELSE 0 END),0) AS active_bcrypt, COALESCE(SUM(CASE WHEN active=1 AND datetime(expires_at)>datetime(\u0027now\u0027) AND expires_at>=\u00272100-01-01\u0027 THEN 1 ELSE 0 END),0) AS long_expiry_accounts FROM vip_members"}' > "$RUNNER_TEMP/query.json"
          curl --fail --silent --show-error -X POST "$API/$DB_ID/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/query.json" > "$RUNNER_TEMP/result.json"
          jq -e '.success == true and .result[0].success == true' "$RUNNER_TEMP/result.json" >/dev/null || { echo 'D1 audit query failed'; exit 1; }
          jq '.result[0].results[0] | {total_rows,active_vip,active_monthly,active_bcrypt,long_expiry_accounts}' "$RUNNER_TEMP/result.json"
          rm -f "$RUNNER_TEMP/db-list.json" "$RUNNER_TEMP/query.json" "$RUNNER_TEMP/result.json"
