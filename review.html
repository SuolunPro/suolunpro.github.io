<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>索伦引擎 · 邀请审核后台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#242933;background:#f3f5f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh}.layout{max-width:800px;margin:0 auto;padding:22px 13px 48px}
header{background:#171e2a;color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}header a{color:#d4dee8;text-decoration:none;font-size:12px}h1{font-size:23px;margin:10px 0 4px}h2{font-size:17px;margin:0 0 8px}.sub{font-size:12px;color:#afbdcd;line-height:1.7}
.panel,.item{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 6px #1420360b}.muted{color:#757e8c;font-size:12px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:#f7f8fa;border-radius:10px;padding:12px 7px;text-align:center}.stat b{font-size:23px;display:block}.stat small{font-size:11px;color:#777}
.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}select,button,textarea{font:inherit;border-radius:9px}select,textarea{border:1px solid #cbd2dc;padding:10px;color:#242933;background:white}button{border:0;padding:11px 14px;cursor:pointer;background:#c52832;color:#fff;font-size:13px;font-weight:650}button.secondary{background:#415267}button.danger{background:#7b4a48}button:disabled{opacity:.5;cursor:default}
.item{border:1px solid #e9edf3}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.tag{border-radius:50px;background:#fff3dc;color:#895a09;font-size:11px;padding:4px 9px}.tag.ok{background:#e7f6ef;color:#187653}.tag.rejected{background:#f8ebeb;color:#a34545}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0}.meta div{min-width:0;font-size:12px;color:#7b8290}.meta strong{display:block;font-size:13px;font-weight:600;color:#30394b;overflow-wrap:anywhere;margin-top:4px}
.flags{background:#fff7e9;border-radius:9px;padding:9px 12px;font-size:12px;color:#815714;margin:9px 0;line-height:1.7}
.clean{background:#eef7f2;color:#2d7353}.review-note{width:100%;resize:vertical;min-height:64px;margin:10px 0 7px;font-size:13px}
.buttons{display:flex;gap:8px;flex-wrap:wrap}.alert{background:#fff1ef;color:#a1362d;padding:11px;border-radius:9px;font-size:12px;line-height:1.8;margin-bottom:13px}
#message{font-size:13px;min-height:23px;color:#a1362d;margin:9px 0;white-space:pre-wrap}
@media(max-width:390px){.meta{grid-template-columns:1fr}.layout{padding-top:10px}}
</style></head>
<body><div class="layout">
<header><a href="./">← 返回索伦引擎</a><h1>邀请审核后台</h1><div class="sub">1—9位基础条件通过后自动计入；第10位起需管理员结合 AI 辅助意见复核。风险迹象不等于作弊证明</div></header>
<div id="message" role="status" aria-live="polite"></div>
<section class="panel"><h2>邀请审核概况</h2>
<div id="stats" class="stats"><div class="stat">—<small>待审核</small></div><div class="stat">—<small>已通过</small></div><div class="stat">—<small>已拒绝</small></div></div>
<div class="tabs"><label for="status">查看</label>
<select id="status"><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已拒绝</option></select>
<button id="reload" class="secondary">刷新</button></div>
<p class="muted">每次最多显示最近100条。第1—9位未触发基础异常规则的邀请自动通过；第10位及以上，或较少邀请中触发集中注册迹象的记录，将待人工复核。你可复制脱敏摘要发给 ChatGPT 共同分析，最终由管理员决定。</p></section>
<div id="records"></div></div>
<script>
"use strict";
const API="https://ttydbcejxqxdkcfoizkj.supabase.co/functions/v1/soren-referral-review-v1";
const msg=document.getElementById("message"),records=document.getElementById("records"),stats=document.getElementById("stats");
const select=document.getElementById("status"),reload=document.getElementById("reload");
const text=(tag,content,cls)=>{const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=String(content??"");return el};
function session(){for(const store of [localStorage,sessionStorage]){
  try{const s=JSON.parse(store.getItem("soren_auth_v2")||"null");if(s&&s.access_token&&s.user)return s}catch{}
}return null}
function time(t){if(!t)return"暂无记录";const d=new Date(t);return Number.isNaN(+d)?"暂无记录":d.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",hour12:false})}
async function request(method,payload){
  const s=session();if(!s)throw Error("请先返回索伦引擎登录管理员账号，再打开审核后台");
  if(s.expires_at && Number(s.expires_at)<Date.now()+10000)throw Error("登录已过期，请返回索伦引擎重新登录后再试");
  const response=await fetch(API+(method==="GET"?"?status="+encodeURIComponent(select.value):""),{
    method,headers:{"Authorization":"Bearer "+s.access_token,...(method==="POST"?{"Content-Type":"application/json"}:{})},
    ...(method==="POST"?{body:JSON.stringify(payload)}:{}),cache:"no-store"
  });
  const body=await response.json();
  if(!response.ok||!body.ok){
    if(response.status===403)throw Error("无管理员权限：请使用被授权的索伦账号登录");
    if(response.status===401)throw Error("登录状态无效，请返回索伦引擎重新登录");
    if(body.error==="ALREADY_REVIEWED")throw Error("这条邀请已被审核，请刷新列表");
    throw Error("操作未完成："+String(body.error||response.status));
  }
  return body;
}
function meta(root,label,value){const item=document.createElement("div");item.append(text("span",label),text("strong",value));root.append(item)}
function renderItem(r){
  const card=text("section","","item"),head=text("div","","row");
  head.append(text("strong","邀请码 "+String(r.inviteCode||"—")),text("span",({pending:"待审核",approved:"已通过",rejected:"已拒绝"}[r.reviewStatus]||r.reviewStatus),r.reviewStatus==="approved"?"tag ok":r.reviewStatus==="rejected"?"tag rejected":"tag"));card.append(head);
  const m=text("div","","meta");
  meta(m,"受邀账号",String(r.invitedEmailHint||"—"));
  meta(m,"该邀请人在本次活动的第几位",r.inviteOrdinal??"待确认");
  meta(m,"绑定时间（北京时间）",time(r.boundAt));
  meta(m,"账号注册",time(r.invitedCreatedAt));
  meta(m,"最近登录",time(r.invitedLastSignInAt));
  meta(m,"十分钟内同邀请人其他绑定数",r.otherInvites10m??0);
  meta(m,"同邀请人关联二十四小时绑定数",r.invites24h??0);
  card.append(m);
  const signals=Array.isArray(r.riskSignals)?r.riskSignals:[];
  const requiresJointReview=Number(r.inviteOrdinal)>=10;
  const reviewIntro=requiresJointReview
    ?"第10位及以上：须由管理员结合 ChatGPT 的辅助分析复核；模型意见仅作参考，不自动审批。"
    :(r.reviewStatus==="pending"?"低于10位但触发异常迹象，需要人工复核。":"1—9位的自动通过或历史确认记录。");
  card.append(text("p",reviewIntro,"muted"));
  const flags=text("div",signals.length?signals.join("；"):"未触发预设集中注册迹象。缺少独立身份核验时仍有小号风险。",signals.length?"flags":"flags clean");card.append(flags);
  if(r.reviewStatus!=="pending"){
    card.append(text("p","审核时间："+time(r.reviewedAt),"muted"));
    if(r.reviewNote)card.append(text("p","审核说明："+String(r.reviewNote),"muted"));
  }else{
    if(requiresJointReview){
      const copy=text("button","复制脱敏摘要 · 和 ChatGPT 复核","secondary");
      copy.addEventListener("click",async()=>{
        const summary=[
          "请辅助复核索伦引擎邀请奖励是否需要补充核验。以下仅为统计迹象，不能据此认定小号或真实身份。",
          "这是该邀请人第"+String(r.inviteOrdinal)+"位邀请。",
          "受邀账号注册时间："+time(r.invitedCreatedAt)+"；绑定时间："+time(r.boundAt)+"；最近登录："+time(r.invitedLastSignInAt),
          "十分钟内同邀请人其他绑定数："+String(r.otherInvites10m??0)+"；二十四小时关联绑定数："+String(r.invites24h??0),
          "风险迹象："+(signals.length?signals.join("；"):"未触发已设置的集中注册阈值"),
          "请列出应向管理员核实的独立证据、可能的误判及风险；不要代替管理员批准或拒绝。"
        ].join("\n");
        try{await navigator.clipboard.writeText(summary);msg.textContent="脱敏复核摘要已复制，可以粘贴给 ChatGPT。"}
        catch{msg.textContent="复制失败，请使用系统浏览器重试。"}
      });
      card.append(copy,text("p","请将复制内容发给 ChatGPT 获取复核意见。管理员核对事实后，再决定是否审核通过。","muted"));
    }
    const note=text("textarea","","review-note");
    note.maxLength=800;note.placeholder="填写审核依据（至少12字）。通过需说明如何独立核验真实用户；风险迹象、验证码通过或注册成功本身不构成核验依据。";
    note.setAttribute("aria-label","审核依据");
    let jointConfirmed=null;
    if(requiresJointReview){
      const rowConfirm=text("label","","muted");rowConfirm.style.display="flex";rowConfirm.style.alignItems="flex-start";rowConfirm.style.gap="8px";
      jointConfirmed=document.createElement("input");jointConfirmed.type="checkbox";jointConfirmed.style.flex="0 0 auto";jointConfirmed.style.marginTop="4px";
      rowConfirm.append(jointConfirmed,text("span","已与 ChatGPT 进行辅助复核，并由我本人独立确认最终审核结论。"));
      card.append(rowConfirm);
    }
    const row=text("div","","buttons");
    const approve=text("button","审核通过"),reject=text("button","拒绝邀请","danger");
    async function decide(action){
      const reason=note.value.trim();
      if(reason.length<12){msg.textContent="请填写至少12字审核依据";note.focus();return}
      if(requiresJointReview&&!jointConfirmed?.checked){msg.textContent="该邀请已达10位，请先完成与 ChatGPT 的辅助复核并勾选确认。";return}
      if(action==="approve"&&!confirm("确认已独立核验真实新用户，并批准该邀请计入奖励？"))return;
      if(action==="reject"&&!confirm("确认拒绝此邀请？请确保有充分证据，避免误伤真实用户。"))return;
      approve.disabled=true;reject.disabled=true;msg.textContent="正在写入审核结果…";
      try{await request("POST",{invitedId:r.invitedId,action,note:reason});msg.textContent="审核记录已保存";await load();}
      catch(e){msg.textContent=e.message;approve.disabled=false;reject.disabled=false}
    }
    approve.addEventListener("click",()=>decide("approve"));reject.addEventListener("click",()=>decide("reject"));
    row.append(approve,reject);card.append(note,row);
  }
  return card;
}
let loading=false;
async function load(){
  if(loading)return;loading=true;reload.disabled=true;msg.textContent="正在核验管理员权限并读取记录…";
  try{
    const body=await request("GET");const data=body.review||{};
    stats.replaceChildren();
    for(const [key,label] of [["pending","待审核"],["approved","已通过"],["rejected","已拒绝"]]){
      const tile=text("div","","stat");tile.append(text("b",data[key]??0),text("small",label));stats.append(tile);
    }
    records.replaceChildren();
    if(!Array.isArray(data.records)||!data.records.length)records.append(text("section","当前筛选下暂无邀请记录","panel muted"));
    else data.records.forEach(r=>records.append(renderItem(r)));
    msg.textContent="记录已更新。请勿只凭异常信号判定违规。";
  }catch(e){records.replaceChildren();msg.textContent=e.message}
  finally{loading=false;reload.disabled=false}
}
reload.addEventListener("click",load);select.addEventListener("change",load);
load();
</script></body></html>
