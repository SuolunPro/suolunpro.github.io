<body>
<div id="app"><div class="loading">正在连接豪·足球模型…</div></div>
<script>
const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-console-v1';
const HB_CUM_API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-basketball-7m-probe-v01';
const APP_BUILD='2026-09-14 豪竞3.2前端v36-hygiene';
let DATA=null,TAB='dashboard',AUTO_TIMER=null,DETAIL=null,RESET_HJ_SCROLL=false;
let HB_CUM=null;
async function checkBuildVersion(){try{const r=await fetch('/version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return false;const j=await r.json();if(j&&j.build&&j.build!==APP_BUILD){const target=String(j.build),u=new URL(location.href);if(u.searchParams.get('v')===target){console.warn('Build mismatch persists after one cache-busting reload; suppressing refresh loop.',{app:APP_BUILD,target});return false}u.searchParams.set('v',target);u.searchParams.set('t',Date.now().toString());location.replace(u.toString());return true}return false}catch(_){return false}}
function forcePageRefresh(){const u=new URL(location.href);u.searchParams.set('v',APP_BUILD);u.searchParams.set('t',Date.now().toString());location.replace(u.toString())}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?(a*100/b).toFixed(1)+'%':'—';
const fmtTime=v=>{if(!v)return '—';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch{return String(v)}};
const ageMinutes=v=>v?Math.max(0,Math.round((Date.now()-new Date(v).getTime())/60000)):null;
const code=v=>v==='主胜'?'3':v==='平'?'1':v==='客胜'?'0':'';
const hitTop=r=>!!(r.top1&&r.result_verified&&code(r.top1)===r.result_1x2);
const hitTicket=r=>!!(r.ticket_pick&&r.result_verified&&String(r.ticket_pick).includes(String(r.result_1x2)));
const result=r=>!r.result_verified?'待结算':(r.result_home??'?')+'-'+(r.result_away??'?')+' · '+(r.result_1x2==='3'?'主胜':r.result_1x2==='1'?'平':'客胜');
function token(){return localStorage.getItem('hao_console_token')||''}
function activeNames(){const ks=Object.keys(DATA?.active_models||{});const hj=DATA?.role_models?.hj||ks.find(k=>k.includes('豪竟')||k.includes('豪竞'))||'豪竞';const hc=DATA?.role_models?.hc||ks.find(k=>k.includes('豪传'))||'豪传';const hb=DATA?.role_models?.hb||ks.find(k=>k.includes('豪篮'))||'豪篮1.0';return {hj,hc,hb}}
function activeByRole(role){const n=activeNames(),name=role==='hj'?n.hj:role==='hc'?n.hc:n.hb;return DATA?.active_models?.[name]||null}
function metric(l,v,s='',c=''){return '<div class="metric '+c+'"><div class="ml">'+esc(l)+'</div><div class="mv">'+esc(v)+'</div><div class="tiny">'+esc(s)+'</div></div>'}
function runFresh(run){const m=ageMinutes(run?.run_time);if(m==null)return {text:'模型无运行',tone:'bad'};const now=DATA?.server_time?new Date(DATA.server_time):new Date();const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).formatToParts(now),p={};for(const x of parts)p[x.type]=x.value;const today=p.year+'-'+p.month+'-'+p.day,h=Number(p.hour);const pool=String(run?.pool_date||'');if(pool&&pool<today&&h<12)return {text:'等待今日12:00首轮 · 展示上一销售日冻结盘',tone:'warn'};if(m<=75)return {text:'模型更新 '+m+' 分钟前',tone:'good'};if(m<=180)return {text:'模型更新 '+m+' 分钟前',tone:'warn'};return {text:'模型已 '+m+' 分钟未运行',tone:'bad'}}
function nextModelRunText(){const now=DATA?.server_time?new Date(DATA.server_time):new Date(),parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now),p={};for(const x of parts)p[x.type]=x.value;const h=Number(p.hour),m=Number(p.minute),slots=[12,14,16,18,20,21,22],n=slots.find(x=>x>h||(x===h&&m<1));if(n!=null)return String(n).padStart(2,'0')+':00';return '明天 12:00'}
function shell(body){const f=runFresh(DATA?.hj?.run),n=activeNames();return '<div class="wrap"><div class="top"><div><div class="title">豪·足球模型</div><div class="subtitle">'+esc(n.hj)+' × '+esc(n.hc)+' × '+esc(n.hb)+' · 足球 + 竞彩篮球量化控制台</div></div><div class="topright"><span class="fresh good">页面同步 '+esc(fmtTime(DATA?.server_time))+'</span><span class="fresh '+f.tone+'">'+esc(f.text)+' · 下次三模型 '+esc(nextModelRunText())+'</span><span class="lock">🔒 私人访问</span><button class="logout" onclick="logout()">退出</button></div></div><nav>'+[['dashboard','总览'],['haojing',n.hj],['haochuan',n.hc],['haolan',n.hb],['cumulative','累计'],['history','历史'],['sources','数据状态']].map(x=>'<button onclick="setTab(\''+x[0]+'\')" class="'+(TAB===x[0]?'active':'')+'">'+esc(x[1])+'</button>').join('')+'</nav><div class="actions"><button class="refresh" onclick="forcePageRefresh()">🔄 立即刷新</button></div>'+body+'<div class="footer">页面每60秒读取一次数据库；三模型自动时段：12/14/16/18/20/21/22点（北京时间），周末追加22:30；系统每小时自动自检并安全自愈。缺失数据保持未确认，不用其他机构冒充补齐。最后API读取：'+esc(fmtTime(DATA?.server_time))+' · 版本：'+esc(APP_BUILD)+'</div></div>'}
function login(){clearInterval(AUTO_TIMER);document.getElementById('app').innerHTML='<div class="login"><form class="loginbox" id="lf"><h1>🔒 豪·足球模型</h1><div class="subtitle">私人版 · 自动读取当前active模型</div><div class="err" id="err">账号或密码不正确。</div><label>用户名</label><input id="u" autocomplete="username" value="hao"><label>密码</label><input id="p" type="password" autocomplete="current-password"><button>进入控制台</button></form></div>';document.getElementById('lf').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+'?login=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});const j=await r.json();if(r.ok&&j.token){localStorage.setItem('hao_console_token',j.token);load(true)}else document.getElementById('err').style.display='block'}catch(_){document.getElementById('err').style.display='block'}}}
function logout(){localStorage.removeItem('hao_console_token');DATA=null;login()}

function hjPoissonScoreData(r){
  const s=r?.source_status||{},lh=Number(s.hhad_lambda_home),la=Number(s.hhad_lambda_away),st=String(s.hhad_shadow_status||'');
  if(!Number.isFinite(lh)||!Number.isFinite(la)||lh<=0||la<=0||st==='MARKET_ONLY')return null;
  const fact=n=>{let x=1;for(let i=2;i<=n;i++)x*=i;return x};
  const pp=(l,k)=>Math.exp(-l)*Math.pow(l,k)/fact(k);
  const cells=[];
  for(let h=0;h<=6;h++)for(let a=0;a<=6;a++)cells.push({score:h+'-'+a,p:pp(lh,h)*pp(la,a)});
  cells.sort((x,y)=>y.p-x.p);
  const total=lh+la,pt=k=>Math.exp(-total)*Math.pow(total,k)/fact(k);
  const bands=[
    {label:'0–1球',p:pt(0)+pt(1)},
    {label:'2–3球',p:pt(2)+pt(3)},
    {label:'4–5球',p:pt(4)+pt(5)},
    {label:'6+球',p:Math.max(0,1-[0,1,2,3,4,5].reduce((z,k)=>z+pt(k),0))}
  ].sort((x,y)=>y.p-x.p);
  return {top3:cells.slice(0,3),top16:cells.slice(0,16),goalBand:bands[0],lh,la,status:st};
}

function systemHealthSection(){
 const H=DATA?.system_health||{},x=H.latest||null;
 if(!x)return '<section class="section"><div class="shead"><h2>🛡️ 系统健康</h2><span>每小时自检 + 自动修复</span></div><div class="notice warn" style="margin:12px">⚠️ 尚无系统自检记录。</div></section>';
 const st=String(x.overall_status||'attention'),rs=x.run_status||{};
 const waits=Array.isArray(rs.source_warnings)?rs.source_warnings:[];
 const acts=Array.isArray(x.actions)?x.actions:[],rawBad=Array.isArray(x.unresolved)?x.unresolved:[],bad=rawBad.filter(v=>v&&((v.count==null)||Number(v.count)>0));
 const hasHardFault=bad.length>0;
 const tone=hasHardFault?'bad':(waits.length||st==='waiting'||st==='attention'||st==='healed'?'warn':'good');
 const label=hasHardFault?'🚨 真故障':(waits.length||st==='waiting'||st==='attention'?'⏳ 系统正常 · 等待数据':st==='healed'?'🛠️ 已自动修复':'✅ 系统正常');
 const snap=H.last_snapshot||{},ago=ageMinutes(x.checked_at);
 const modelState=(r,name)=>{if(!r)return name+'：等待真实在售池';return name+'：run '+(r.id??'—')+' · '+(r.status||'—')};
 let html='<section class="section"><div class="shead"><h2>🛡️ 系统健康</h2><span>每小时第10分自检 · 第40分Watchdog</span></div>';
 html+='<div class="grid4" style="padding:12px">'+
   metric('总体',label,'最近自检 '+(ago==null?'—':ago+'分钟前'),tone)+
   metric('数据等待',String(waits.length)+'项',waits.length?waits.map(w=>w.source||w.type).join(' / '):'没有等待项',waits.length?'warn':'good')+
   metric('硬故障',String(bad.length)+'项',bad.length?'需要处理':'0项 · 系统链路正常',bad.length?'bad':'good')+
   metric('灾备快照',snap.snapshot_date||'—',snap.created_at?fmtTime(snap.created_at):'每天23:35自动保存',snap.snapshot_date?'good':'warn')+
 '</div>';
 html+='<div class="cards" style="padding:0 12px 12px"><div class="card"><b>豪竞</b><div class="tiny" style="margin-top:6px">'+esc(modelState(rs.haojing,'豪竞'))+'</div></div><div class="card"><b>豪传</b><div class="tiny" style="margin-top:6px">'+esc(modelState(rs.haochuan,'豪传'))+'</div></div><div class="card"><b>豪篮</b><div class="tiny" style="margin-top:6px">'+esc(modelState(rs.haolan,'豪篮'))+'</div></div></div>';
 if(bad.length)html+='<div class="notice bad" style="margin:0 12px 12px"><b>真故障：</b> '+esc(bad.map(v=>(v.source?String(v.source)+' · ':'')+(v.type||'unknown')).join('、'))+'</div>';
 if(waits.length)html+='<div class="notice warn" style="margin:0 12px 12px"><b>等待/非阻断：</b> '+waits.map(v=>esc(v.message||((v.source||'数据源')+'等待更新'))).join('；')+'</div>';
 else if(!bad.length&&acts.length)html+='<div class="notice warn" style="margin:0 12px 12px">🛠️ 本轮已自动处理：'+esc(acts.map(v=>v.type||'repair').join('、'))+'</div>';
 else if(!bad.length)html+='<div class="notice good" style="margin:0 12px 12px">✅ 网页、核心数据源、三模型revision、定时任务当前未发现硬故障。</div>';
 return html+'</section>';

const rs=rows.map(r=>{const hw=Number(r.p_home_win)>=Number(r.p_away_win),hc=Number(r.p_home_cover)>=Number(r.p_away_cover),ov=Number(r.p_over)>=Number(r.p_under);return '<tr><td><b>'+esc(r.match_no)+'</b></td><td>'+esc(r.away_team)+' @ '+esc(r.home_team)+'</td><td>'+esc(r.expected_away_points==null?'—':Number(r.expected_away_points).toFixed(1))+' : '+esc(r.expected_home_points==null?'—':Number(r.expected_home_points).toFixed(1))+'</td><td>'+esc(hw?'主胜':'客胜')+'</td><td>'+esc(hbPct(hw?r.p_home_win:r.p_away_win))+'</td><td>'+esc(r.official_spread_home??'—')+'</td><td>'+esc(hc?'让分主胜':'让分客胜')+'</td><td>'+esc(hbPct(hc?r.p_home_cover:r.p_away_cover))+'</td><td>'+esc(r.official_total??'—')+'</td><td>'+esc(ov?'大分':'小分')+'</td><td>'+esc(hbPct(ov?r.p_over:r.p_under))+'</td><td>'+esc(dqZh(r.dq))+'</td><td>'+esc(hbLight(r.lineup_light))+'</td><td>'+esc(hbLight(r.market_volatility_light))+'</td><td>'+esc(hbLight(r.direction_light||r.final_selection_light))+'</td><td>'+esc(hbLight(r.core_leg_light))+'</td><td>'+esc(hbActual(r))+'</td><td><b>'+esc(hbHit(r))+'</b></td></tr>'}).join('');
return h+'<section class="section"><div class="shead"><h2>今日竞彩篮球全池</h2><span>方向灯=可买方向 · 核心腿灯=最稳串关资格 · 赛前冻结 + 完场结算</span></div><div class="tablewrap"><table><thead><tr><th>场</th><th>对阵</th><th>预计比分</th><th>胜负Top1</th><th>胜率</th><th>官方让分</th><th>让分Top1</th><th>穿盘率</th><th>官方总分</th><th>大小Top1</th><th>概率</th><th>DQ</th><th>阵容灯</th><th>市场灯</th><th>方向灯</th><th>核心腿灯</th><th>赛果/比分</th><th>推荐结果</th></tr></thead><tbody>'+rs+'</tbody></table></div></section>'}

async function loadHbCumulative(){try{const r=await fetch(HB_CUM_API+'?t='+Date.now(),{cache:'no-store'}),j=await r.json();if(r.ok&&j.ok)HB_CUM=j;else HB_CUM=null}catch(_){HB_CUM=null}if(TAB==='cumulative'&&DATA)render()}
function renderCumulative(){const c=DATA.cumulative||{},h=c.hj||{},r=c.hc||{},b=HB_CUM||{},bo=b.overall||{},bm=b.moneyline||{},bs=b.spread||{},bt=b.total||{},bc=b.core||{};const hbMain=HB_CUM?((bo.hits||0)+'/'+(bo.scored||0)):'加载中';const hbPct=HB_CUM?pct(bo.hits,bo.scored):'读取最终冻结盘';return '<div class="grid4">'+metric('豪竞正式Top1',(h.hits||0)+'/'+(h.scored||0),pct(h.hits,h.scored))+metric('豪竞正式竞彩日',String(h.days||0),'完整正式样本')+metric('豪传9/9',String(r.full9||0),'正式期数 '+String(r.issues||0))+metric('豪传累计票面',(r.hits||0)+'/'+(r.scored||0),pct(r.hits,r.scored))+metric('🏀 豪篮全池首选',hbMain,hbPct,HB_CUM?'good':'warn')+'</div><section class="section"><div class="shead"><h2>🏀 豪篮累计命中率</h2><span>按销售日最终冻结盘去重 · 完场后自动累计</span></div><div class="grid4" style="padding:12px">'+metric('全池冻结首选',HB_CUM?((bo.hits||0)+'/'+(bo.scored||0)):'加载中',HB_CUM?pct(bo.hits,bo.scored):'—')+metric('胜负概率Top1',HB_CUM?((bm.hits||0)+'/'+(bm.scored||0)):'—',HB_CUM?pct(bm.hits,bm.scored):'仅有效概率样本')+metric('让分Top1',HB_CUM?((bs.hits||0)+'/'+(bs.scored||0)):'—',HB_CUM?pct(bs.hits,bs.scored):'仅有效盘口样本')+metric('大小分Top1',HB_CUM?((bt.hits||0)+'/'+(bt.scored||0)):'—',HB_CUM?pct(bt.hits,bt.scored):'仅有效总分样本')+metric('核心腿',HB_CUM?((bc.hits||0)+'/'+(bc.scored||0)):'—',HB_CUM?pct(bc.hits,bc.scored):'核心绿灯样本')+metric('完整结算日',HB_CUM?String(b.days||0):'—','每销售日只计一次，不重复revision')+'</div></section><section class="section"><div class="shead"><h2>胜平负决策质量</h2><span>正式累计</span></div><div class="grid4" style="padding:12px">'+metric('稳腿',(h.anchorHits||0)+'/'+(h.anchorScored||0),pct(h.anchorHits,h.anchorScored))+metric('高信心',(h.highHits||0)+'/'+(h.highScored||0),pct(h.highHits,h.highScored))+metric('历史PASS隔离',String(h.passIsolated||0),'错误场成功隔离')+metric('历史PASS误杀',String(h.passFalseKills||0),'被PASS但首选命中')+'</div></section><section class="section"><div class="shead"><h2>让球决策质量</h2><span>仅统计上线后真实赛前灯</span></div><div class="grid4" style="padding:12px">'+metric('🟢绿灯',(h.handicapGreenHits||0)+'/'+(h.handicapGreenScored||0),pct(h.handicapGreenHits,h.handicapGreenScored))+metric('🟡黄灯',(h.handicapYellowHits||0)+'/'+(h.handicapYellowScored||0),pct(h.handicapYellowHits,h.handicapYellowScored))+metric('实际出手',(h.handicapOutHits||0)+'/'+(h.handicapOutScored||0),pct(h.handicapOutHits,h.handicapOutScored))+metric('🔴PASS',String(h.handicapRedPass||0),'避错 '+String(h.handicapPassAvoided||0)+' · 误杀 '+String(h.handicapPassFalseKills||0))+'</div></section>'}
function renderHistory(){if(!Array.isArray(DATA?.history))return '<section class="section"><div class="shead"><h2>历史运行记录</h2><span>按需加载，不拖慢首页</span></div><div class="loading" style="min-height:180px">正在读取历史索引…</div></section>';const arr=DATA.history;return '<section class="section"><div class="shead"><h2>历史运行记录</h2><span>点击查看逐场明细</span></div><div class="tablewrap"><table><thead><tr><th>日期</th><th>模型</th><th>修订</th><th>池</th><th>状态</th><th>完整</th><th>正式</th><th>运行时间</th></tr></thead><tbody>'+arr.map(r=>'<tr class="clickrow" onclick="openRun('+Number(r.id)+')"><td>'+esc(r.pool_date)+'</td><td><b>'+esc(r.model_name)+' '+esc(r.model_version||'')+'</b></td><td>'+esc(r.model_revision_tag||'未记录')+'</td><td>'+esc(r.pool_label||r.pool_kind||'—')+'</td><td>'+esc(r.status||'—')+'</td><td>'+(r.data_complete?'✅':'⚠️')+'</td><td>'+(r.formal_allowed?'✅':'否')+'</td><td>'+esc(fmtTime(r.run_time))+'</td></tr>').join('')+'</tbody></table></div></section>'}
async function loadHistory(){try{const r=await fetch(API+'?api=1&history=1&t='+Date.now(),{headers:{Authorization:'Bearer '+token()},cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'读取失败');DATA.history=j.history||[];if(TAB==='history')render()}catch(e){DATA.history=[];if(TAB==='history')render()}}
async function openRun(id){document.getElementById('app').innerHTML='<div class="loading">正在读取历史复盘…</div>';try{const r=await fetch(API+'?api=1&run_id='+id,{headers:{Authorization:'Bearer '+token()},cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'读取失败');DETAIL={history:j.detail};TAB='history';render()}catch(e){DETAIL=null;render()}}
function historyDetail(){const d=DETAIL?.history;if(!d)return null;const run=d.run||{},rows=d.rows||[];return '<div><button class="backbtn" onclick="DETAIL=null;render()">← 返回历史</button></div><div class="grid4" style="margin-top:10px">'+metric('日期',run.pool_date||'—',run.pool_label||'')+metric('模型',run.model_name||'—',run.model_revision_tag||'')+metric('状态',run.status||'—',run.formal_allowed?'正式':'仅复盘')+metric('逐场记录',String(rows.length),'run_id '+run.id)+'</div><section class="section"><div class="tablewrap"><table><thead><tr><th>场</th><th>对阵</th><th>首选方向</th><th>第二</th><th>票面</th><th>DQ</th><th>HUR</th><th>DTR</th><th>DLR</th><th>处理</th><th>赛果</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.match_no)+'</td><td>'+esc(r.home_team)+' - '+esc(r.away_team)+'</td><td>'+esc(r.top1||'—')+'</td><td>'+esc(r.second_pick||'—')+'</td><td>'+esc(r.ticket_pick_after_gate||r.ticket_pick||'—')+'</td><td>'+esc(dqZh(r.dq))+'</td><td>'+esc(r.hur||'—')+'</td><td>'+esc(r.dtr||'—')+'</td><td>'+esc(r.dlr||'—')+'</td><td>'+esc(r.final_handling||r.keep_discard||'—')+'</td><td>'+esc(result(r))+'</td></tr>').join('')+'</tbody></table></div></section>'}function renderSources(){return systemHealthSection()+sourceStatusSection()+'<section class="section"><div class="shead"><h2>数据纪律</h2><span>新主链正式展示口径</span></div><div class="cards"><div class="card"><b>竞彩SP</b><div class="tiny">SP必须同时核验销售日、场号和主客队身份。澳客/500只有身份严格确认后才进入verified；无法确认时使用明确标注的球来乐结构化备用且DQ最高B，任何来源都不冒充Sporttery官网直连。</div></div><div class="card"><b>亚洲盘委员会</b><div class="tiny">Bet365、皇冠、William Hill亚洲盘、12Bet分别核验，不互相冒充；同向不按机构数量机械重复加权。</div></div><div class="card"><b>欧赔</b><div class="tiny">William Hill同公司欧赔初→即→临/当前；外围平均欧赔不能补成William。</div></div><div class="card"><b>刷新原则</b><div class="tiny">数据库无新赛前快照时保持原状态；开赛后不把赛中赔率写回赛前冻结。</div></div></div></section>'}
function render(){if(!DATA)return;let b;if(DETAIL?.history)b=historyDetail();else if(DETAIL?.row)b=matchDetail();else if(TAB==='dashboard')b=dashboard();else if(TAB==='haojing')b=renderHaojing();else if(TAB==='haochuan')b=renderHaochuan();else if(TAB==='haolan')b=renderHaolan();else if(TAB==='cumulative')b=renderCumulative();else if(TAB==='history')b=renderHistory();else b=renderSources();document.getElementById('app').innerHTML=shell(b);if(RESET_HJ_SCROLL){requestAnimationFrame(()=>{document.querySelectorAll('.hjtablewrap').forEach(el=>{el.scrollLeft=0});RESET_HJ_SCROLL=false})}}
checkBuildVersion();setInterval(checkBuildVersion,30000);load(true);
</script>
