<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>豪竞3.2｜赛事分析</title>
<style>
:root{--bg:#06111f;--panel:#0d2035;--line:#1d4267;--text:#f1f7ff;--muted:#8da8c0;--blue:#59aaff;--green:#43d69b;--gold:#f1c76b;--purple:#bf9cff;--orange:#ffc66d;--red:#ff9dac}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 85% -15%,#173b65 0,#06111f 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.wrap{max-width:1120px;margin:auto;padding:18px 14px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:25px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:7px;align-items:center}.pill,.btn{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#0a1b2e;color:#c9def1;font-size:11px}.pill.ok{border-color:#23664e;color:#8ce6ba}.btn{cursor:pointer;border-radius:9px}.tabs{display:flex;gap:8px;margin:16px 0 11px}.tabs button{border:1px solid transparent;background:transparent;color:#8fa8c0;padding:8px 13px;border-radius:10px;cursor:pointer}.tabs button.on{background:#153d68;border-color:#2b6aa4;color:white}.hero,.section,.metric,.match{background:linear-gradient(180deg,#0e2239,#0a192a);border:1px solid var(--line);border-radius:15px}.hero{padding:17px;margin-bottom:11px}.hero h1{font-size:20px;margin:0 0 6px}.hero p{margin:0;color:#a6bdd2;font-size:13px;line-height:1.65}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{padding:13px;min-height:102px}.ml{font-size:11px;color:var(--muted)}.mv{font-size:24px;font-weight:900;margin:8px 0 4px}.ms{font-size:11px;color:#86a4be;line-height:1.45}.section{margin-top:12px;overflow:hidden}.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}.shead h2{font-size:16px;margin:0}.shead span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:11px}.match{padding:14px;background:#0b1b2d}.mh,.main{display:flex;justify-content:space-between;gap:8px;align-items:center}.no{font-weight:900;color:var(--gold)}.league,.time{font-size:11px;color:var(--muted)}.teams{font-size:16px;font-weight:850;margin:10px 0 9px}.pick{font-size:21px;font-weight:950}.prob{font-size:12px;color:#9bd2ff}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{border:1px solid #274a68;background:#091827;border-radius:999px;padding:5px 8px;font-size:11px;color:#c2d4e4}.single{border-color:#267052;color:#91e9bd}.double{border-color:#674f83;color:#d8b9ff}.candidate{border-color:#80602a;color:#ffd58b}.watch{border-color:#6d4350;color:#ffb2bd}.record{padding:18px;text-align:center}.big{font-size:36px;font-weight:950;margin:8px 0}.label{font-size:13px;color:#b6cadb}.desc{font-size:12px;color:#7f9ab3;line-height:1.65;margin-top:7px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:11px}.note{padding:13px 14px;color:#92acc3;font-size:12px;line-height:1.7}.login{min-height:92vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(92vw,400px);background:#0c1c2f;border:1px solid #234765;border-radius:20px;padding:24px}.loginbox h1{margin:0 0 7px}.loginbox label{display:block;font-size:12px;color:#9eb5ca;margin:13px 0 6px}.loginbox input{width:100%;padding:13px;border-radius:10px;border:1px solid #294c6c;background:#071522;color:white;font-size:16px}.loginbox button{width:100%;border:0;border-radius:11px;padding:13px;margin-top:18px;background:#2d83e5;color:white;font-weight:850}.err{display:none;margin-top:11px;padding:9px;border-radius:9px;background:#351923;border:1px solid #743447;color:#ffb0bd;font-size:12px}.loading{min-height:75vh;display:grid;place-items:center;color:var(--muted);text-align:center}.footer{text-align:center;color:#668098;font-size:11px;line-height:1.7;margin-top:17px}
@media(max-width:820px){.metrics{grid-template-columns:1fr 1fr}.grid,.twocol{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:13px 10px 40px}.top{align-items:flex-start}.brand{font-size:21px}.actions .pill{display:none}.metrics{grid-template-columns:1fr 1fr}.mv{font-size:21px}.teams{font-size:15px}.shead{align-items:flex-start}.shead span{max-width:45%;text-align:right}}
</style>
</head>
<body><div id="app"><div class="loading">正在加载赛事数据…</div></div>
<script>
const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-member-api-v01';
let DATA=null,TAB='live',TIMER=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{if(!v)return '—';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch{return '—'}};
const pct=v=>v==null?'—':Number(v).toFixed(2)+'%';
function token(){return localStorage.getItem('hj32_customer_token')||localStorage.getItem('hao_member_access_token')||''}
function saveSession(s){if(!s?.access_token)return;localStorage.setItem('hj32_customer_token',s.access_token);if(s.refresh_token)localStorage.setItem('hj32_customer_refresh',s.refresh_token)}
function logout(){localStorage.removeItem('hj32_customer_token');localStorage.removeItem('hj32_customer_refresh');clearInterval(TIMER);DATA=null;login()}
function login(){clearInterval(TIMER);document.getElementById('app').innerHTML='<div class="login"><form class="loginbox" id="lf"><h1>豪竞3.2</h1><div class="sub">赛事数据分析 · 会员登录</div><label>会员邮箱</label><input id="email" type="email" autocomplete="username" required placeholder="请输入邮箱"><label>密码</label><input id="password" type="password" autocomplete="current-password" required placeholder="请输入密码"><button>进入赛事分析</button><div class="err" id="err"></div><div class="sub" style="margin-top:14px">没有账号请联系管理员开通。</div></form></div>';document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),er=document.getElementById('err');b.disabled=true;b.textContent='登录中…';er.style.display='none';try{const r=await fetch(API+'?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(!r.ok||!j.ok||!j.session)throw new Error(j.error||'登录失败');saveSession(j.session);await load(true)}catch(x){er.textContent=x.message||'登录失败';er.style.display='block';b.disabled=false;b.textContent='进入赛事分析'}}}
async function refreshSession(){const rt=localStorage.getItem('hj32_customer_refresh');if(!rt)return false;try{const r=await fetch(API+'?action=refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});const j=await r.json();if(r.ok&&j.ok&&j.session){saveSession(j.session);return true}}catch(_){}return false}
async function load(show=false,retry=true){if(!token()){login();return}if(show)document.getElementById('app').innerHTML='<div class="loading">正在同步最新数据…</div>';try{let r=await fetch(API+'?action=hj32&t='+Date.now(),{headers:{Authorization:'Bearer '+token()},cache:'no-store'});if(r.status===401&&retry&&await refreshSession())return load(show,false);const j=await r.json();if(r.status===401){logout();return}if(r.status===403)throw new Error('会员权限已到期，请联系管理员续期');if(!r.ok||!j.ok)throw new Error(j.error||'读取失败');DATA=j.dashboard;render();clearInterval(TIMER);TIMER=setInterval(()=>{if(document.visibilityState==='visible')load(false)},60000)}catch(e){document.getElementById('app').innerHTML='<div class="loading">'+esc(e.message)+'<br><br><button class="btn" onclick="load(true)">重新连接</button></div>'}}
function metric(l,v,s){return '<div class="metric"><div class="ml">'+esc(l)+'</div><div class="mv">'+esc(v)+'</div><div class="ms">'+esc(s)+'</div></div>'}
function classChip(x){const c=String(x?.code||'');if(c==='SINGLE')return '<span class="chip single">🟢 单向关注</span>';if(c==='STRONG_DOUBLE')return '<span class="chip double">🟣 双向保护</span>';if(c==='CANDIDATE_DOUBLE')return '<span class="chip candidate">🟠 双向观察</span>';if(c==='PASS')return '<span class="chip watch">⚪ 暂不建议</span>';return '<span class="chip">待确认</span>'}
function matchCard(r){const sd=r.single_double||{},p=r.top1_probability==null?'—':(r.top1_probability*100).toFixed(1)+'%',picks=(sd.picks||[]).filter(Boolean);return '<div class="match"><div class="mh"><div><span class="no">'+esc(r.match_no)+'</span> <span class="league">'+esc(r.league)+'</span></div><span class="time">'+esc(fmt(r.kickoff_bjt))+'</span></div><div class="teams">'+esc(r.home_team)+' vs '+esc(r.away_team)+'</div><div class="main"><div class="pick">'+esc(r.top1||'未确认')+'</div><div class="prob">参考概率 '+esc(p)+'</div></div><div class="chips">'+classChip(sd)+'<span class="chip">第二方向 '+esc(r.second_pick||'—')+'</span><span class="chip">信心 '+esc(r.confidence||'—')+'</span><span class="chip">风险 '+esc(r.risk||'—')+'</span>'+(picks.length>1?'<span class="chip">组合 '+esc(picks.join(' + '))+'</span>':'')+(r.handicap_pick?'<span class="chip">让球参考 '+esc(r.handicap_pick)+'</span>':'')+'</div></div>'}
function liveView(){const d=DATA,rows=d.live?.rows||[],run=d.run||{};return '<div class="hero"><h1>今日赛事模型分析</h1><p>赛事数据持续同步更新。页面展示当前赛前首选方向、第二方向、单双结构与风险等级。</p></div><div class="metrics">'+metric('今日赛事',rows.length+' 场','日期 '+(run.pool_date||'—'))+metric('数据状态','已同步','每60秒自动刷新')+metric('分析版本','豪竞3.2','当前版本')+metric('最后更新',fmt(d.generated_at),'北京时间')+'</div><section class="section"><div class="shead"><h2>今日赛事</h2><span>赛前参考方向</span></div><div class="grid">'+rows.map(matchCard).join('')+'</div></section>'}
function historyView(){const v=DATA.locked_validation||{},a=v.single_direction||{},b=v.single_double_coverage||{};return '<div class="hero"><h1>历史回溯战绩</h1><p>以下为豪竞3.2锁定历史样本的回溯结果，用于展示过去样本中的模型表现。历史表现不代表未来结果。</p></div><div class="twocol"><div class="section record"><div class="label">FT Top1 单方向</div><div class="big">'+pct(a.rate)+'</div><div class="desc">'+esc(a.hits||0)+' / '+esc(a.scored||0)+' 场命中</div></div><div class="section record"><div class="label">单双混合覆盖</div><div class="big">'+pct(b.rate)+'</div><div class="desc">'+esc(b.hits||0)+' / '+esc(b.scored||0)+' 场覆盖</div></div></div><section class="section"><div class="shead"><h2>回溯说明</h2><span>锁定历史样本</span></div><div class="note">回溯样本共 '+esc(a.scored||0)+' 场。Top1按每场第一方向统计；单双混合覆盖按对应单双结构统计。页面不展示实战投注收益，不提供结果保证。</div></section>'}
function render(){const body=TAB==='history'?historyView():liveView();document.getElementById('app').innerHTML='<div class="wrap"><div class="top"><div><div class="brand">豪竞3.2｜赛事分析</div><div class="sub">赛前数据分析 · 实时同步 · 历史回溯</div></div><div class="actions"><span class="pill ok">● 数据已同步</span><button class="btn" onclick="load(true)">刷新</button><button class="btn" onclick="logout()">退出</button></div></div><div class="tabs"><button class="'+(TAB==='live'?'on':'')+'" onclick="TAB=\'live\';render()">今日赛事</button><button class="'+(TAB==='history'?'on':'')+'" onclick="TAB=\'history\';render()">回溯战绩</button></div>'+body+'<div class="footer">豪竞3.2 · 赛事数据分析<br>历史回溯仅代表过去样本表现，不代表未来结果。</div></div>'}
load(true);
</script>
</body></html>
