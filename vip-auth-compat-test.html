<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP认证兼容验收（隔离测试）</title><style>body{font:16px system-ui;max-width:540px;margin:30px auto;padding:16px;background:#f4f6fa}main{background:#fff;border-radius:14px;padding:22px}input,button{display:block;box-sizing:border-box;width:100%;padding:12px;margin:12px 0;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f7;padding:12px}</style></head><body><main><h2>VIP认证兼容验收 · 隔离测试</h2><p>此页面只在测试分支，绝不修改正式网站登录。</p><label>邮箱<input id="email" type="email" autocomplete="username"></label><label>密码<input id="password" type="password" autocomplete="current-password"></label><button id="login">验证Cloudflare VIP</button><button id="probe">检查足球接口（不发送VIP令牌）</button><button id="logout">退出测试</button><pre id="output" role="status">等待操作</pre></main><script type="module">
import {createVipAuthAdapter} from './cloudflare/vip/staging-auth-adapter.js';
const vip=createVipAuthAdapter(), $=id=>document.getElementById(id);
$('login').onclick=async()=>{try{const m=await vip.login($('email').value.trim(),$('password').value);$('password').value='';$('output').textContent='Cloudflare VIP登录成功\n身份：'+m.role+'\n到期：'+m.expires_at+'\n注意：未测试旧足球接口授权';}catch(e){$('output').textContent='登录失败：'+e.message}};
$('logout').onclick=()=>{vip.logout();$('password').value='';$('output').textContent='已退出'};
$('probe').onclick=async()=>{const url='https://ttydbcejxqxdkcfoizkj.supabase.co/functions/v1/soren-public-api-v1?view=membership';try{const r=await fetch(url,{cache:'no-store'});$('output').textContent='旧足球会员接口匿名请求：HTTP '+r.status+'\n'+(r.status===401||r.status===403?'旧接口仍需单独身份兼容，禁止直接替换令牌。':'此结果不能证明Cloudflare令牌获旧接口授权。');}catch(e){$('output').textContent='旧接口网络访问失败：'+e.name+'（不涉及VIP密码）'}};
</script></body></html>
