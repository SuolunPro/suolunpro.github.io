<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT智能预测 · 九十刻度</title><style>body{margin:0;background:#f5f6fa;color:#182335;font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}header{background:#a81e2c;color:white;padding:20px;border-radius:14px}a{color:inherit}.box{background:white;padding:18px;margin-top:16px;border-radius:12px;box-shadow:0 1px 8px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.item{background:#f5f6fa;padding:12px;border-radius:8px}small{color:#667}.empty{padding:30px;text-align:center;color:#667}b{font-size:17px}.warn{color:#9a3b12}</style></head><body><div class="wrap"><header><a href="./index.html">← 返回九十刻度</a><h1>GPT智能预测</h1><div>胜平负Top2 · 比分Top3 · 半全场Top3 · 总进球Top3 · 冷门预警 · 今日优选</div></header><div class="box"><label>赛事日期 <input id="date" type="date"></label> <button id="refresh">刷新</button><p id="status">读取中…</p></div><div id="matches"></div></div><script src="./gpt-predictions-config.js"></script><script>const date=document.getElementById('date'),out=document.getElementById('matches'),status=document.getElementById('status');const now=new Date(Date.now()+8*3600000);date.value=now.toISOString().slice(0,10);const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function line(label,items){return '<div class="item"><strong>'+esc(label)+'</strong><p>'+((Array.isArray(items)&&items.length)?items.map(esc).join(' / '):'未确认')+'</p></div>'}async function load(){out.innerHTML='';status.textContent='读取公开预测快照中…';try{const config=window.SOULUN_GPT_API||'';if(!config)throw Error('VIP预测接口尚未部署，请稍后再试');const session=JSON.parse(localStorage.getItem('soren_auth_v2')||sessionStorage.getItem('soren_auth_v2')||'null');if(!session?.access_token)throw Error('请先返回首页登录VIP账号');const res=await fetch(config.replace(/\/$/,'')+'/predictions?date='+encodeURIComponent(date.value),{cache:'no-store',headers:{Authorization:'Bearer '+session.access_token}});if(res.status===404){status.textContent='该日期暂无已发布快照';return}if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(data.schema_version!==1||!Array.isArray(data.matches))throw Error('数据格式不符');status.textContent='快照时间：'+(data.generated_at||'未确认')+'｜场次：'+data.matches.length+'｜状态：'+(data.status||'未确认');if(!data.matches.length){out.innerHTML='<div class="box empty">暂无经过核验的预测；不会使用示例数据填充。</div>';return}for(const m of data.matches){const el=document.createElement('section');el.className='box';el.innerHTML='<h2>'+esc(m.number)+' '+esc(m.home)+' VS '+esc(m.away)+'</h2><small>来源：'+esc(m.source)+' ｜赛前核验：'+esc(m.verified?'已核验':'未核验')+'</small><div class="grid">'+line('胜平负 Top2',m.wdl_top2)+line('比分 Top3',m.score_top3)+line('半全场 Top3',m.htft_top3)+line('总进球 Top3',m.goals_top3)+line('冷门预警',m.upset?[m.upset.direction,m.upset.focus,m.upset.risk]:[])+line('今日优选',m.daily_pick?[m.daily_pick] : [])+'</div><p class="warn">'+esc(m.note||'')+'</p>';out.append(el)}}catch(e){status.textContent='读取失败：'+e.message}}date.addEventListener('change',load);document.getElementById('refresh').onclick=load;load();</script></body></html>
