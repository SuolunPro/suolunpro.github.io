<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九十刻度 · AI七模块测试</title><link rel="stylesheet" href="./assets/app-20261003.css"><style>.test-wrap{max-width:980px;margin:auto;padding:16px}.test-banner{padding:12px;background:#fff4dd;border:1px solid #e8c27c;border-radius:10px;margin:12px 0}.test-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.test-controls button{border:1px solid #ddd;background:white;border-radius:8px;padding:9px}.test-controls button.active{background:#d72b30;color:white}.test-card{background:#fff;border:1px solid #e7e7e7;border-radius:12px;padding:16px;margin:12px 0}.test-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.test-grid div{background:#f7f8fa;padding:12px;border-radius:8px}body{background:#f5f6fa}</style></head><body><div class="app"><header class="hero"><div class="brandbar"><div class="brand"><img class="logo" src="./assets/ninety-mark-avatar.jpg" width="40" height="40" alt=""><div><strong>九十刻度</strong><small>NINETY MARK</small></div></div><div class="version">测试环境</div></div><div class="models"><a class="model" href="./index.html">返回原七大模块</a></div><div class="hero-copy"><h1>AI预测 · 七大模块测试</h1><p>沿用原站样式 · 仅测试数据适配 · 不影响正式预测</p></div></header><main class="test-wrap"><div class="test-banner"><b>隔离测试版</b><br>当前未接通经过核验的GPT预测快照。不会把演示数据当作正式推荐，也不会修改旧库。</div><p class="test-banner">自动展示最近一次已发布的预测；后台仍按固定时段更新。</p><section class="test-card"><h2>最新预测状态</h2><p id="state">未接入已核验快照；等待自动发布链路。</p></section><section class="test-card"><h2>七大模块</h2><div class="test-grid" id="modules"></div></section><section class="test-card"><h2>赛果核验</h2><p>待真实赛前冻结快照及官方完赛比分接通后，按原始预测快照独立核验；未核验不计算命中率。</p></section></main></div><script>
const labels=['胜平负','全场让球','半全场 Top3','全场比分 Top3','总进球 Top3','冷门预警','今日优选'];
const times=['12:30','14:30','16:30','17:30','18:30','19:30','20:30','21:30'];
const state=document.getElementById('state'),modules=document.getElementById('modules');
let generation=0;
function bjDate(offset=0){const d=new Date(Date.now()+28800000+offset*86400000);return d.toISOString().slice(0,10);}
function safe(v){return String(v??'未确认').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show(v){if(v==null||v==='')return '未确认';if(Array.isArray(v))return v.map(show).join(' / ');if(typeof v==='object')return Object.entries(v).map(([k,x])=>safe(k)+': '+show(x)).join(' · ');return safe(v);}
function render(data){const matches=data.matches||data.fixtures||data.predictions||[];if(!Array.isArray(matches))throw Error('预测列表不是数组');state.textContent='最新已发布预测：'+(data._date||'')+' '+(data._time||'')+' · '+matches.length+' 场 · '+(data.generated_at||data.snapshot_time||'发布时间未标记');const specs=[['胜平负',['win_draw_lose','ft','spf']],['全场让球',['handicap','rqspf']],['半全场 Top3',['half_full_top3','half_full','bqc']],['全场比分 Top3',['score_top3','score']],['总进球 Top3',['goals_top3','total_goals']],['冷门预警',['upset_warning','upset']],['今日优选',['daily_pick','preferred']]];modules.innerHTML=specs.map(([label,keys])=>'<div><strong>'+label+'</strong>'+(matches.length?matches.map(m=>{const name=safe((m.match_no||m.code||'')+' '+(m.home_team||m.home||'?')+' vs '+(m.away_team||m.away||'?'));const key=keys.find(k=>m[k]!==undefined);return '<p><b>'+name+'</b><br>'+ (key?show(m[key]):'未确认')+'</p>';}).join(''):'<p>本时段无可核验比赛</p>')+'</div>').join('');}
async function load(){const seq=++generation;state.textContent='正在查找最新已发布预测…';modules.innerHTML=labels.map(l=>'<div><strong>'+l+'</strong><p>加载中…</p></div>').join('');const dates=[bjDate(),bjDate(-1)];const nowBJ=new Date(Date.now()+28800000);const currentHHMM=nowBJ.toISOString().slice(11,16).replace(':','');const candidates=[{date:dates[0],t:'最新',hhmm:'latest'}];for(const date of dates){for(const t of [...times].reverse()){const hhmm=t.replace(':','');if(date===dates[0]&&hhmm>currentHHMM)continue;candidates.push({date,t,hhmm});}}for(const c of candidates){try{const r=await fetch('./data/ai-predictions/'+c.date+'/'+c.hhmm+'.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)continue;const data=await r.json();if(seq!==generation)return;const matches=data.matches||data.fixtures||data.predictions;if(!Array.isArray(matches)||!matches.length)continue;data._date=c.date;data._time=c.t;render(data);return;}catch(e){continue;}}if(seq!==generation)return;state.textContent='暂无已发布预测：最近两天没有找到有效预测文件。';modules.innerHTML=labels.map(l=>'<div><strong>'+l+'</strong><p>暂无已发布预测</p></div>').join('');}
load();setInterval(load,300000);
</script></body></html>
