<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九十刻度 · AI七模块测试</title><link rel="stylesheet" href="./assets/app-20261003.css"><style>body{background:#f4f5f7}.test-wrap{max-width:980px;margin:auto;padding:14px}.test-banner{padding:12px 14px;background:#fff8e8;border:1px solid #ecd8ab;border-radius:12px;margin:12px 0;font-size:13px;color:#7b612e}.test-card{background:transparent;border:0;padding:0;margin:18px 0}.test-card h2{font-size:19px;margin:0 0 12px}.test-grid{display:grid;grid-template-columns:1fr;gap:12px}.module-panel{background:#fff;border:1px solid #e6e9ee;border-radius:15px;padding:14px;box-shadow:0 2px 8px #15213b08}.module-title{font-size:17px;font-weight:750;border-left:4px solid #d23a39;padding-left:10px;margin-bottom:12px}.match-card{border-top:1px solid #edf0f3;padding:12px 0}.match-card:first-of-type{border-top:0}.match-code{font-size:12px;color:#8a91a0}.match-teams{font-size:16px;font-weight:700;margin:6px 0 10px}.pick-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.pick{display:inline-block;border-radius:8px;padding:6px 11px;background:#fff0ef;color:#c62d31;border:1px solid #f4d2d0;font-size:14px;font-weight:700}.pick.alt{background:#f3f5f7;color:#687282;border-color:#e7eaee}.match-note{font-size:12px;color:#89909a;margin-top:9px;line-height:1.5}.test-grid div{background:transparent;padding:0}.hero-copy p{font-size:13px}</style></head><body><div class="app"><header class="hero"><div class="brandbar"><div class="brand"><img class="logo" src="./assets/ninety-mark-avatar.jpg" width="40" height="40" alt=""><div><strong>九十刻度</strong><small>NINETY MARK</small></div></div><div class="version">测试环境</div></div><div class="models"><a class="model" href="./index.html">返回原七大模块</a></div><div class="hero-copy"><h1>AI预测 · 七大模块测试</h1><p>沿用原站样式 · 仅测试数据适配 · 不影响正式预测</p></div></header><main class="test-wrap"><div class="test-banner"><b>隔离测试版</b><br>当前未接通经过核验的GPT预测快照。不会把演示数据当作正式推荐，也不会修改旧库。</div><p class="test-banner">自动展示最近一次已发布的预测；后台仍按固定时段更新。</p><section class="test-card"><h2>最新预测状态</h2><p id="state">未接入已核验快照；等待自动发布链路。</p></section><section class="test-card"><h2>七大模块</h2><div class="test-grid" id="modules"></div></section><section class="test-card"><h2>赛果核验</h2><p>待真实赛前冻结快照及官方完赛比分接通后，按原始预测快照独立核验；未核验不计算命中率。</p></section></main></div><script>
const labels=['胜平负','全场让球','半全场 Top3','全场比分 Top3','总进球 Top3','冷门预警','今日优选'];
const times=['12:30','14:30','16:30','17:30','18:30','19:30','20:30','21:30'];
const state=document.getElementById('state'),modules=document.getElementById('modules');
let generation=0;
function bjDate(offset=0){const d=new Date(Date.now()+28800000+offset*86400000);return d.toISOString().slice(0,10);}
function safe(v){return String(v??'未确认').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show(v){if(v==null||v==='')return '未确认';if(Array.isArray(v))return v.map(show).join(' / ');if(typeof v==='object')return Object.entries(v).map(([k,x])=>safe(k)+': '+show(x)).join(' · ');return safe(v);}
function pick(v,alt=false){return '<span class="pick'+(alt?' alt':'')+'">'+safe(v)+'</span>';}
function moduleValue(m,key){const v=m[key];if(v===undefined||v===null)return '<span class="match-note">暂无预测</span>';if(key==='ft'||key==='handicap'||key==='spf'||key==='rqspf'||key==='win_draw_lose'){if(typeof v==='object'){let a=v.top1||v.first||'未确认',b=v.top2||v.second;return '<div class="pick-row">'+pick(a)+(b?pick('备选 '+b,true):'')+'</div>';}return pick(v);}
if(key==='upset_warning'||key==='upset'){const yes=typeof v==='object'?v.triggered:!!v;return '<div class="pick-row">'+pick(yes?'冷门风险预警':'未触发预警',!yes)+'</div>';}
if(key==='daily_pick'||key==='preferred'){const yes=typeof v==='object'?v.selected:!!v;return '<div class="pick-row">'+pick(yes?'入选今日优选':'暂不入选',!yes)+'</div>';}
const a=Array.isArray(v)?v:(typeof v==='object'?(v.top3||v.picks||v.values||[]):[v]);return '<div class="pick-row">'+(Array.isArray(a)?a.map((x,i)=>pick((i+1)+'. '+(typeof x==='object'?(x.value||x.pick||x.score||'未确认'):x),i>0)).join(''):pick(a))+'</div>';}
function render(data){const matches=data.matches||data.fixtures||data.predictions||[];if(!Array.isArray(matches))throw Error('预测列表不是数组');state.textContent='最新预测 · '+(data._date||'')+' '+(data._time||'')+' · 共 '+matches.length+' 场';const specs=[['胜平负',['ft','win_draw_lose','spf']],['全场让球',['handicap','rqspf']],['半全场 Top3',['half_full_top3','half_full','bqc']],['全场比分 Top3',['score_top3','score']],['总进球 Top3',['goals_top3','total_goals']],['冷门预警',['upset_warning','upset']],['今日优选',['daily_pick','preferred']]];modules.innerHTML=specs.map(([label,keys])=>'<article class="module-panel"><div class="module-title">'+label+'</div>'+(matches.length?matches.map(m=>{const k=keys.find(k=>m[k]!==undefined);return '<div class="match-card"><div class="match-code">'+safe(m.match_no||m.code||'')+'</div><div class="match-teams">'+safe(m.home_team||m.home||'?')+' <span style="color:#a0a6b0;font-weight:400">VS</span> '+safe(m.away_team||m.away||'?')+'</div>'+(k?moduleValue(m,k):'<span class="match-note">暂无预测</span>')+'</div>';}).join(''):'<p>暂无已发布预测</p>')+'</article>').join('');}
async function load(){const seq=++generation;state.textContent='正在查找最新已发布预测…';modules.innerHTML=labels.map(l=>'<div><strong>'+l+'</strong><p>加载中…</p></div>').join('');const dates=[bjDate(),bjDate(-1)];const nowBJ=new Date(Date.now()+28800000);const currentHHMM=nowBJ.toISOString().slice(11,16).replace(':','');const candidates=[{date:dates[0],t:'最新',hhmm:'latest'}];for(const date of dates){for(const t of [...times].reverse()){const hhmm=t.replace(':','');if(date===dates[0]&&hhmm>currentHHMM)continue;candidates.push({date,t,hhmm});}}for(const c of candidates){try{const r=await fetch('./data/ai-predictions/'+c.date+'/'+c.hhmm+'.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)continue;const data=await r.json();if(seq!==generation)return;const matches=data.matches||data.fixtures||data.predictions;if(!Array.isArray(matches)||!matches.length)continue;data._date=c.date;data._time=c.t;render(data);return;}catch(e){continue;}}if(seq!==generation)return;state.textContent='暂无已发布预测：最近两天没有找到有效预测文件。';modules.innerHTML=labels.map(l=>'<div><strong>'+l+'</strong><p>暂无已发布预测</p></div>').join('');}
load();setInterval(load,300000);
</script></body></html>
