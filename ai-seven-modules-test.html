<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九十刻度 · AI七模块测试</title><link rel="stylesheet" href="./assets/app-20261003.css"><style>.test-wrap{max-width:980px;margin:auto;padding:16px}.test-banner{padding:12px;background:#fff4dd;border:1px solid #e8c27c;border-radius:10px;margin:12px 0}.test-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.test-controls button{border:1px solid #ddd;background:white;border-radius:8px;padding:9px}.test-controls button.active{background:#d72b30;color:white}.test-card{background:#fff;border:1px solid #e7e7e7;border-radius:12px;padding:16px;margin:12px 0}.test-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.test-grid div{background:#f7f8fa;padding:12px;border-radius:8px}body{background:#f5f6fa}</style></head><body><div class="app"><header class="hero"><div class="brandbar"><div class="brand"><img class="logo" src="./assets/ninety-mark-avatar.jpg" width="40" height="40" alt=""><div><strong>九十刻度</strong><small>NINETY MARK</small></div></div><div class="version">测试环境</div></div><div class="models"><a class="model" href="./index.html">返回原七大模块</a></div><div class="hero-copy"><h1>AI预测 · 七大模块测试</h1><p>沿用原站样式 · 仅测试数据适配 · 不影响正式预测</p></div></header><main class="test-wrap"><div class="test-banner"><b>隔离测试版</b><br>当前未接通经过核验的GPT预测快照。不会把演示数据当作正式推荐，也不会修改旧库。</div><label>竞彩日期 <input type="date" id="date"></label><div class="test-controls" id="times"></div><section class="test-card"><h2>本时段预测状态</h2><p id="state">未接入已核验快照；等待自动发布链路。</p></section><section class="test-card"><h2>七大模块</h2><div class="test-grid" id="modules"></div></section><section class="test-card"><h2>赛果核验</h2><p>待真实赛前冻结快照及官方完赛比分接通后，按每个时段独立核验；未核验不计算命中率。</p></section></main></div><script>const labels=['胜平负','全场让球','半全场 Top3','全场比分 Top3','总进球 Top3','冷门预警','今日优选'];document.getElementById('modules').innerHTML=labels.map(x=>'<div><strong>'+x+'</strong><p>暂无已核验预测</p></div>').join('');const d=new Date(Date.now()+28800000);document.getElementById('date').value=d.toISOString().slice(0,10);const times=['12:30','14:30','16:30','17:30','18:30','19:30','20:30','21:30'];document.getElementById('times').innerHTML=times.map((t,i)=>'<button type="button" data-t="'+t+'" class="'+(i===0?'active':'')+'">'+t+'</button>').join('');document.getElementById('times').onclick=e=>{if(!e.target.dataset.t)return;document.querySelectorAll('#times button').forEach(b=>b.classList.toggle('active',b===e.target));document.getElementById('state').textContent=document.getElementById('date').value+' '+e.target.dataset.t+'：未接入已核验预测快照。'};</script></body></html>
