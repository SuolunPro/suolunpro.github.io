<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>豪竞3.3｜实战版</title>
<style>
:root{--bg:#07111f;--p:#0d1b2d;--p2:#10233b;--line:#1b3554;--text:#eef6ff;--muted:#8da7c1;--green:#35d48b;--yellow:#ffc95d;--red:#ff7180;--blue:#62adff;--violet:#b88cff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 85% -10%,#173a62 0,#07111f 44%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.wrap{max-width:920px;margin:auto;padding:14px 12px 48px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.brand{font-size:23px;font-weight:900}.sub{color:var(--muted);font-size:12px;line-height:1.5;margin-top:4px}.topBtns{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #28547e;background:#102c49;color:#dff0ff;border-radius:10px;padding:8px 10px;font-size:12px;cursor:pointer}.btn.ghost{background:transparent;border-color:#203c59;color:#91abc4}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:linear-gradient(180deg,#10243b,#0b1929);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:22px;margin-top:5px}.stat span{font-size:11px;color:var(--muted)}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.filter{border:1px solid #234766;background:#0a1928;color:#9db5cc;border-radius:999px;padding:8px 13px;font-size:13px;white-space:nowrap}.filter.on{background:#174779;border-color:#2b6ca4;color:#fff}.hint{font-size:11px;color:#7895b1;margin:0 2px 10px}.list{display:grid;gap:10px}.match{background:linear-gradient(180deg,#0f2238,#0a1827);border:1px solid #1c3a58;border-radius:16px;overflow:hidden}.match.reco{border-color:#2b6a91}.match.watch{border-color:#66552b}.match.pass{opacity:.84}.main{padding:13px 14px;cursor:pointer}.head,.pickrow,.statusLine{display:flex;justify-content:space-between;gap:8px;align-items:center}.no{font-weight:900;color:#f0c86b}.league,.time{font-size:11px;color:#7f9bb7}.teams{font-size:17px;font-weight:850;margin:9px 0 11px;line-height:1.35}.ftLabel{font-size:11px;color:#84a2bf}.ft{font-size:20px;font-weight:900}.best{text-align:right}.best small{display:block;color:#8aa6c0;font-size:10px;margin-bottom:3px}.best strong{font-size:17px;color:#cfeaff}.badgebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge{font-size:10px;border:1px solid #203d5a;border-radius:7px;padding:4px 6px;color:#91abc5}.badge.good{border-color:#26734f;color:#8ee6b7}.badge.warn{border-color:#765d27;color:#f4cf7c}.badge.bad{border-color:#6d3440;color:#ff9aa5}.badge.violet{border-color:#634b82;color:#d3b9ff}.statusLine{margin-top:10px;padding-top:10px;border-top:1px solid #18334e;font-size:12px}.status{font-weight:850}.status.good{color:#7ce0aa}.status.warn{color:#f5cd72}.status.bad{color:#ff91a0}.settle{color:#8aa6bf}.simple{display:none;border-top:1px solid #1a3550;background:#091724;padding:12px 14px}.match.open .simple{display:block}.five{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.signal{background:#0d2033;border:1px solid #1a3b59;border-radius:11px;padding:9px 7px;text-align:center}.signal span{display:block;font-size:10px;color:#7f9ab4;margin-bottom:5px}.signal b{font-size:12px}.reason{margin-top:10px;font-size:12px;color:#9eb4c9;line-height:1.55}.empty{padding:45px 15px;text-align:center;color:#819cb6}.login{min-height:85vh;display:grid;place-items:center;padding:16px}.loginBox{width:min(92vw,380px);background:#0d1b2d;border:1px solid #1d3a5a;border-radius:20px;padding:23px}.loginBox h1{margin:0 0 5px;font-size:22px}.loginBox label{display:block;font-size:12px;color:#91a8bf;margin:12px 0 6px}.loginBox input{width:100%;border:1px solid #284866;background:#081522;color:white;border-radius:11px;padding:13px}.loginBox .go{width:100%;margin-top:17px;border:0;border-radius:11px;background:#2e83e6;color:white;padding:13px;font-weight:850}.err{display:none;color:#ff9dad;font-size:12px;margin-top:9px}.footer{font-size:10px;color:#607b95;text-align:center;margin-top:17px;line-height:1.5}.loading{min-height:70vh;display:grid;place-items:center;color:#86a0ba}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.five{grid-template-columns:repeat(2,1fr)}.signal:last-child{grid-column:span 2}.top{display:block}.topBtns{justify-content:flex-start;margin-top:9px}.teams{font-size:16px}.ft{font-size:19px}.best strong{font-size:15px}}
</style>
</head>
<body><div id="app"><div class="loading">正在读取豪竞3.3…</div></div>
<script>
const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-console-v1';
const BUILD='豪竞3.3实战前端-v4-20260916';
let DATA=null,FILTER='all',TIMER=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const token=()=>localStorage.getItem('hao_console_token')||'';
const fmt=v=>{if(!v)return '—';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch{return '—'}};
function logout(){localStorage.removeItem('hao_console_token');DATA=null;login()}
function login(){clearInterval(TIMER);document.getElementById('app').innerHTML=`<div class="login"><form class="loginBox" id="lf"><h1>豪竞3.3</h1><div class="sub">实战极简版 · 使用原控制台账号</div><label>用户名</label><input id="u" value="hao" autocomplete="username"><label>密码</label><input id="p" type="password" autocomplete="current-password"><button class="go">进入</button><div class="err" id="err">账号或密码不正确</div></form></div>`;document.getElementById('lf').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+'?login=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});const j=await r.json();if(r.ok&&j.token){localStorage.setItem('hao_console_token',j.token);load(true)}else document.getElementById('err').style.display='block'}catch(_){document.getElementById('err').style.display='block'}}}
async function load(show=false){if(!token()){login();return}if(show)document.getElementById('app').innerHTML='<div class="loading">读取最新赛前冻结数据…</div>';try{const r=await fetch(API+'?api=1&t='+Date.now(),{headers:{Authorization:'Bearer '+token()},cache:'no-store'});if(r.status===401){logout();return}const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'读取失败');DATA=j;render();clearInterval(TIMER);TIMER=setInterval(()=>{if(document.visibilityState==='visible')load(false)},60000)}catch(e){document.getElementById('app').innerHTML='<div class="empty">连接失败：'+esc(e.message)+'<br><br><button class="btn" onclick="load(true)">重试</button></div>'}}
function ss(r){return r?.source_status||{}}
function bp(r){const s=ss(r);return s.hj33_best_play_selector_v01||s.hj32_best_play_selector_v02||s.hj32_best_play_selector_v01||null}
function sd(r){return ss(r).single_double_v01||null}
function arr(v){return Array.isArray(v)?v:[]}
function plan(r){
 const b=bp(r),d=sd(r),route=r?.optimal_market_route||{},fh=String(r?.final_handling||''),up=fh.toUpperCase();
 const rr=String(route?.route_status||'').toUpperCase(),rm=String(route?.selected_market||'').toUpperCase(),rp=String(route?.selected_pick||'');
 if(rr==='RECOMMEND'&&rp&&rm&&rm!=='FT_HAD'){const market=rm==='OFFICIAL_HHAD'?'官方让球':rm==='ASIAN_HANDICAP'?'亚洲盘':rm;return {kind:'reco',formal:true,market,picks:[rp],label:rp,line:route?.selected_line??r?.official_handicap??null,single:true,double:false,reason:route?.route_reason||'最优玩法路由'}}
 const ba=String(b?.action||''),bm=String(b?.selected_market||''),bc=String(b?.class_code||''),bpicks=arr(b?.selected_picks).filter(Boolean);
 if(ba.startsWith('RECOMMEND')&&bpicks.length){return {kind:'reco',formal:true,market:bm==='OFFICIAL_HHAD'?'官方让球':'胜平负',picks:bpicks,label:bpicks.join(' + '),line:r?.official_handicap??null,classCode:bc,reason:b?.reason||'',single:ba==='RECOMMEND_SINGLE'||bpicks.length===1,double:ba==='RECOMMEND_DOUBLE'||bpicks.length>1}}
 if(/DOUBLE/.test(up)&&r?.top1&&r?.second_pick){const ps=[r.top1,r.second_pick];return {kind:'reco',formal:true,market:'胜平负',picks:ps,label:ps.join(' + '),line:null,classCode:'HJ33_DOUBLE',reason:'3.3最终双选',single:false,double:true}}
 if(/SINGLE/.test(up)){const pk=r?.ticket_pick||r?.top1;if(pk)return {kind:'reco',formal:true,market:'胜平负',picks:[pk],label:String(pk),line:null,classCode:'HJ33_SINGLE',reason:'3.3最终单选',single:true,double:false}}
 const dc=String(d?.class_code||''),dp=arr(d?.picks).filter(Boolean);
 if((dc==='CANDIDATE_DOUBLE'||dc==='STRONG_DOUBLE')&&dp.length>=2)return {kind:'reco',formal:true,market:'胜平负',picks:dp,label:dp.join(' + '),line:null,classCode:dc,reason:d?.reason||'',single:false,double:true};
 if(dc==='SINGLE'&&dp.length===1)return {kind:'reco',formal:true,market:'胜平负',picks:dp,label:dp[0],line:null,classCode:dc,reason:d?.reason||'',single:true,double:false};
 if(rr==='RECOMMEND'&&rp)return {kind:'reco',formal:true,market:'胜平负',picks:[rp],label:rp,line:null,classCode:'ROUTE',reason:route?.route_reason||'',single:true,double:false};
 if(r?.ticket_pick)return {kind:'reco',formal:true,market:'胜平负',picks:[r.ticket_pick],label:String(r.ticket_pick),line:null,classCode:'FT_SINGLE_FALLBACK',reason:'读取正式ticket_pick',single:true,double:false};
 return {kind:'pass',formal:false,market:'—',picks:[],label:'PASS',line:null,classCode:bc||dc||'PASS',reason:b?.reason||d?.reason||'当前没有正式可执行玩法',single:false,double:false};
}
function topProb(r){const s=ss(r),p=s.p_raw||{};let v=r.top1==='主胜'?Number(p.home):r.top1==='平'?Number(p.draw):Number(p.away);if(!Number.isFinite(v))v=Number(s.top1_prob);return Number.isFinite(v)?(v*100).toFixed(1)+'%':'—'}
function riskTone(v){return String(v||'').includes('红')?'bad':String(v||'').includes('黄')?'warn':'good'}
function riskText(r){return 'HUR '+(r.hur||'—')+' · DTR '+(r.dtr||'—')+' · DLR '+(r.dlr||'—')}
function strengthText(r){const e=ss(r).elo||{},d=Number(e.elo_diff);if(!Number.isFinite(d))return '未确认';if(Math.abs(d)<30)return '接近';return d>0?'主队较强':'客队较强'}
function marketText(r){const s=ss(r),c=s.market_direction_conflict;if(c===true||String(c)==='true')return '有冲突';if(c===false||String(c)==='false')return '同向';return '已读取'}
function marginText(r){const s=ss(r);return s.structural_handicap_pick||r.handicap_pick||'未确认'}
function intelText(r){const s=ss(r),d=s.single_double_v01||{};return d.intelligence_participated?'已介入':'无正式介入'}
function statusLabel(pl){if(pl.kind==='reco')return pl.single?'🟢 正式推荐 · 单':'🟣 正式推荐 · 双';if(pl.kind==='watch')return '🟠 观察 · 候选双';return '⚪ PASS'}
function resultText(r){if(!r.result_verified)return '待结算';return (r.result_home??'?')+'-'+(r.result_away??'?')+' · '+(r.result_1x2==='3'?'主胜':r.result_1x2==='1'?'平':'客胜')}
function actualCode(r,pl){if(!r.result_verified)return null;if(pl.market==='胜平负')return r.result_1x2==='3'?'主胜':r.result_1x2==='1'?'平':'客胜';if(pl.market==='官方让球'){const h=Number(r.result_home),a=Number(r.result_away),hd=Number(pl.line??r.official_handicap);if(!Number.isFinite(h)||!Number.isFinite(a)||!Number.isFinite(hd))return null;const x=h+hd-a;return x>0?'让胜':x===0?'让平':'让负'}return null}
function hit(r,pl){const a=actualCode(r,pl);return a?pl.picks.includes(a):null}
function scoreData(r){const s=ss(r),lh=Number(s.hhad_lambda_home),la=Number(s.hhad_lambda_away);if(!Number.isFinite(lh)||!Number.isFinite(la)||lh<=0||la<=0)return null;const f=n=>{let x=1;for(let i=2;i<=n;i++)x*=i;return x},pp=(l,k)=>Math.exp(-l)*Math.pow(l,k)/f(k),xs=[];for(let h=0;h<=6;h++)for(let a=0;a<=6;a++)xs.push({score:h+'-'+a,p:pp(lh,h)*pp(la,a)});xs.sort((a,b)=>b.p-a.p);return xs.slice(0,3)}
function scorePicksText(r){const x=scoreData(r);return x?x.map(v=>v.score).join(' / '):'未形成'}
function scoreHit(r){if(!r.result_verified)return null;const x=scoreData(r);return x?x.some(v=>v.score===String(r.result_home)+'-'+String(r.result_away)):null}
function outcome(r,pl){if(!r.result_verified)return {state:'pending',label:'待结算'};const ph=hit(r,pl),sh=scoreHit(r),tags=[];if(ph===true)tags.push(pl.double?'双选命中':pl.market==='官方让球'?'让球命中':'玩法命中');if(sh===true)tags.push('比分命中');if(tags.length)return {state:'hit',label:'✅ '+tags.join(' + ')};if(pl.kind==='pass')return {state:'neutral',label:'PASS'};return {state:'miss',label:'❌ 未中'}}
function card(r){const pl=plan(r),oc=outcome(r,pl),tone=oc.state==='hit'?'good':oc.state==='miss'?'bad':pl.kind==='reco'?'good':'warn',settled=r.result_verified;let settle=!settled?'待结算':oc.label+' · '+resultText(r);const score=scorePicksText(r);return `<div class="match ${pl.kind}" data-kind="${pl.kind}"><div class="main" onclick="this.parentElement.classList.toggle('open')"><div class="head"><div><span class="no">${esc(r.match_no)}</span> <span class="league">${esc(r.league||'')}</span></div><span class="time">${esc(fmt(r.kickoff_bjt))}</span></div><div class="teams">${esc(r.home_team)} <span style="color:#617c96;font-weight:500">vs</span> ${esc(r.away_team)}</div><div class="pickrow"><div><div class="ftLabel">FT参考</div><div class="ft">${esc(r.top1||'未确认')}</div><div class="sub">第二方向 ${esc(r.second_pick||'—')} · ${esc(topProb(r))} · 信心${esc(r.confidence_label||'—')}</div></div><div class="best"><small>${esc(pl.market)}最终玩法</small><strong>${esc(pl.label)}</strong></div></div><div class="badgebar"><span class="badge ${tone}">${esc(pl.double?'双选·任一中=成功':pl.single?'单选':pl.kind==='pass'?'PASS':'最终玩法')}</span><span class="badge">比分 ${esc(score)}</span><span class="badge">${esc(r.dq||'DQ—')}</span></div><div class="statusLine"><span class="status ${tone}">${esc(settle)}</span><span class="settle">${scoreHit(r)===true?'✅ 比分命中':''}</span></div></div><div class="simple"><div class="five"><div class="signal"><span>最终玩法</span><b>${esc(pl.label)}</b></div><div class="signal"><span>玩法市场</span><b>${esc(pl.market)}</b></div><div class="signal"><span>比分Top3</span><b>${esc(score)}</b></div><div class="signal"><span>平局风险</span><b>${esc(r.dtr||'—')}</b></div><div class="signal"><span>冷门风险</span><b>${esc(r.hur||'—')}</b></div></div><div class="reason"><b>结算口径：</b>${esc(pl.double?'双选任一方向命中即成功；':'按最终玩法结算；')}${esc(scoreHit(r)===true?'比分预测同时命中。':'比分预测命中时另标成功。')}<br><b>理由：</b>${esc(pl.reason||'—')}</div></div></div>`}
function setFilter(x){FILTER=x;render()}
function render(){const rawRows=DATA?.hj?.rows||[],rows=rawRows.filter((r,i,a)=>a.findIndex(x=>String(x.home_team||'').trim()+'|'+String(x.away_team||'').trim()===String(r.home_team||'').trim()+'|'+String(r.away_team||'').trim())===i);if(!rows.length){document.getElementById('app').innerHTML='<div class="empty">当前没有豪竞3.3比赛数据</div>';return}const plans=rows.map(plan),reco=plans.filter(x=>x.kind==='reco').length,watch=plans.filter(x=>x.kind==='watch').length,pass=plans.filter(x=>x.kind==='pass').length,singles=plans.filter(x=>x.kind==='reco'&&x.single).length;let show=rows.filter((r,i)=>FILTER==='all'||plans[i].kind===FILTER||(FILTER==='single'&&plans[i].kind==='reco'&&plans[i].single));const btn=(k,t)=>`<button class="filter ${FILTER===k?'on':''}" onclick="setFilter('${k}')">${t}</button>`;document.getElementById('app').innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">豪竞3.3 · 实战版</div><div class="sub">豪竞3.3正式运行库 · 先看结论，需要时再展开证据 · 当前销售日 ${esc(DATA?.hj?.run?.pool_date||'—')}</div></div><div class="topBtns"><button class="btn" onclick="load(true)">刷新</button><button class="btn ghost" onclick="location.href='live.html'">研究版</button><button class="btn ghost" onclick="logout()">退出</button></div></div><div class="stats"><div class="stat"><span>全池</span><b>${rows.length}</b></div><div class="stat"><span>正式推荐</span><b>${reco}</b></div><div class="stat"><span>观察</span><b>${watch}</b></div><div class="stat"><span>PASS</span><b>${pass}</b></div></div><div class="filters">${btn('all','全部 '+rows.length)}${btn('reco','只看推荐 '+reco)}${btn('single','只看单选 '+singles)}${btn('watch','观察 '+watch)}${btn('pass','PASS '+pass)}</div><div class="hint">双选任一方向命中即标记成功；页面展示的比分Top3若命中，也直接标记“比分命中”。最终玩法可为胜平负或官方让球。</div><div class="list">${show.map(card).join('')}</div><div class="footer">${esc(BUILD)} · 页面每60秒读取一次数据库 · 豪竞3.3正式口径。</div></div>`}
load(true);
</script></body></html>
